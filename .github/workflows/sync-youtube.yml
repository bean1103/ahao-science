name: Sync YouTube videos

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 Asia/Taipei every day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-youtube.mjs
      - name: Commit if videos changed
        run: |
          if ! git diff --quiet data/videos.json; then
            git config user.name "youtube-sync"
            git config user.email "youtube-sync@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Sync new YouTube videos"
            git push
          fi
