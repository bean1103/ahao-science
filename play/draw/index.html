<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>抽籤 · 阿豪自然</title>
<link rel="icon" href="../../assets/chars/point.webp">
<style>
:root{--bg:#191919;--panel:#252525;--panel2:#2f2f2f;--line:#2f2f2f;--ink:rgba(255,255,255,.9);--muted:#9b9b9b;--accent:#4dab9a;--gold:#ffd84a;--pink:#4e2c3c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--gold);text-decoration:none;font-weight:700;font-size:15px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.classes{display:flex;gap:8px;flex-wrap:wrap}
.classes button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px}
.classes button[aria-pressed="true"]{background:#fff;color:#191919;border-color:#fff}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:min(46vh,380px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:20px;overflow:hidden}
.stage img{position:absolute;left:12px;bottom:0;width:min(22%,120px);height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.res{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{min-width:min(40vw,200px);text-align:center;background:var(--panel2);border-radius:14px;padding:14px 18px}
.card b{display:block;font-size:clamp(56px,14vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.card span{display:block;font-size:clamp(20px,4.5vw,36px);margin-top:6px;font-weight:700}
.res.many .card b{font-size:clamp(40px,9vw,80px)}.res.many .card span{font-size:clamp(16px,3.4vw,26px)}
.card.spin b{color:var(--muted)}
.card.hit{background:var(--pink)}
@media (prefers-reduced-motion:no-preference){.card.hit{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.08)}100%{transform:scale(1)}}}
.hint{color:var(--muted);font-size:14px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.go{background:#fff;color:#191919;border-radius:14px;padding:16px 36px;font-size:22px;font-weight:700}
.num{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.num button{background:var(--panel2);border-radius:8px;width:36px;height:36px;font-size:20px}
.num b{min-width:2.2em;text-align:center}
.opt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.opt label{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:15px;line-height:1.2}
.seat small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.used{opacity:.35}
.seat.off{background:transparent;border-style:dashed;color:var(--muted);text-decoration:line-through}
h2{font-size:17px;margin:6px 0 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
.set{display:grid;gap:10px;margin-top:10px}
.set input,.set textarea{background:var(--bg);border:1px solid #3a3a3a;border-radius:8px;padding:8px 10px;width:100%}
.set textarea{min-height:140px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn2{background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:14px}
.note{font-size:13px;color:var(--muted);line-height:1.6}
</style></head>
<body><div class="wrap">
<div class="top"><a href="../../index.html#tools">‹ 阿豪自然</a><div style="display:flex;gap:6px"><button class="pill" id="pinb">📌 浮動小視窗</button><button class="pill" id="snd">🔔 音效</button></div></div>
<div class="classes" id="cls" role="group" aria-label="班級"></div>
<div class="stage" aria-live="polite"><img src="../../assets/chars/point.webp" alt="" id="m"><div class="res" id="res"></div><div class="hint" id="hint"></div></div>
<div class="ctrl">
  <div class="num" aria-label="一次抽幾位"><button id="minus" aria-label="少抽一位">−</button><b id="n">1 位</b><button id="plus" aria-label="多抽一位">＋</button></div>
  <button class="go" id="go">抽！</button>
</div>
<div class="opt">
  <label><input type="checkbox" id="norep" checked> 抽過的先不再抽</label>
  <button class="btn2" id="reset">重新開始這一輪</button>
</div>
<h2>座號 <span class="hint">（點一下＝請假不抽，再點一下恢復）</span></h2>
<div class="seats" id="seats"></div>
<details id="setbox"><summary>⚙️ 班級設定（人數、學生名字）</summary>
  <div class="set">
    <div class="row"><label>班級名稱 <input id="cname" style="width:8em"></label><label>人數 <input id="ccount" type="number" min="1" max="60" style="width:5em"></label></div>
    <label>學生名字（選填，一行一位，照座號順序）<textarea id="cnames" placeholder="1 號的名字&#10;2 號的名字&#10;…"></textarea></label>
    <p class="note">🔒 名字只存在這台裝置的瀏覽器裡，不會上傳到網站，學生用自己的手機打開看不到。換裝置要重新貼一次；清除 Safari 瀏覽紀錄也會被清掉。iPhone／iPad 的 Safari 若超過 7 天沒打開這頁，名字可能會被自動清掉，建議用 Safari「分享 → 加入主畫面」打開，或把名單另外存一份方便再貼。</p>
    <div class="row" style="margin-top:6px"><b>📥 一次匯入全部班級名單</b></div>
    <label>貼上名單，或選擇名單檔。班級名稱單獨一行，下面每行寫「座號 姓名」<textarea id="bulk" placeholder="902&#10;1 王小明&#10;2 李小美&#10;907&#10;1 …"></textarea></label>
    <div class="row"><input type="file" id="bulkfile" accept=".txt,text/plain" style="width:auto"><button class="btn2" id="bulkgo">匯入</button><button class="btn2" id="bulkcopy">複製目前全部名單（備份用）</button><span class="hint" id="bulkmsg"></span></div>
    <p class="note">班級名稱要和上面的班級按鈕一樣，找不到就會新增一個班級。名單裡沒有的座號（例如缺 8 號、14 號）會自動標成請假不抽。匯入的名字一樣只存在這台裝置。</p>
    <div class="row"><button class="btn2" id="save">儲存</button><button class="btn2" id="addc">＋ 新增班級</button><button class="btn2" id="delc">刪除這個班級</button><span class="hint" id="saved"></span></div>
  </div>
</details>
</div>
<script>
const KEY="ahao-draw";const $=id=>document.getElementById(id);
const DEF={cur:0,sound:true,norep:true,n:1,classes:[{name:"902",count:30,names:[]},{name:"907",count:30,names:[]},{name:"908",count:30,names:[]},{name:"豪幸運七",count:30,names:[]}].map(c=>({...c,off:[],used:[]}))};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const C=()=>S.classes[S.cur]||S.classes[0];
const name=(c,i)=>(c.names[i-1]||"").trim();
let spinning=false,ac=null,last=[];
function tone(f,d,t0=0,v=.25){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function pool(c){const all=[...Array(+c.count||0)].map((_,i)=>i+1).filter(x=>!c.off.includes(x));const left=S.norep?all.filter(x=>!c.used.includes(x)):all;return {all,left}}
function render(){
  const c=C();
  $("cls").innerHTML=S.classes.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===S.cur}">${x.name}</button>`).join("");
  $("seats").innerHTML=[...Array(+c.count||0)].map((_,k)=>{const i=k+1,nm=name(c,i);return `<button class="seat ${c.off.includes(i)?"off":""} ${S.norep&&c.used.includes(i)?"used":""}" data-s="${i}" aria-pressed="${c.off.includes(i)}">${i}${nm?`<small>${nm.replace(/</g,"&lt;")}</small>`:""}</button>`}).join("");
  $("n").textContent=S.n+" 位";$("norep").checked=S.norep;$("snd").textContent=S.sound?"🔔 音效":"🔕 靜音";
  const p=pool(c);$("hint").textContent=S.norep?`還沒抽到 ${p.left.length} / ${p.all.length} 位`:`共 ${p.all.length} 位可抽`;
  if(!last.length)$("res").innerHTML=`<div class="card"><b>?</b><span>${c.name}</span></div>`;
  $("cname").value=c.name;$("ccount").value=c.count;$("cnames").value=(c.names||[]).join("\n");
}
function show(nums,final){const c=C();$("res").className="res"+(nums.length>2?" many":"");
  $("res").innerHTML=nums.map(x=>`<div class="card ${final?"hit":"spin"}"><b>${x}</b>${name(c,x)?`<span>${name(c,x).replace(/</g,"&lt;")}</span>`:""}</div>`).join("")}
function draw(){
  if(spinning)return;const c=C();let {left,all}=pool(c);
  if(!all.length){$("hint").textContent="這班沒有可以抽的座號";return}
  if(S.norep&&left.length<S.n){c.used=[];left=all;save()}
  const k=Math.min(S.n,left.length);const pick=[];const L=[...left];
  for(let i=0;i<k;i++){pick.push(L.splice(Math.floor(Math.random()*L.length),1)[0])}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
  spinning=true;$("m").src="../../assets/chars/think.webp";let t=0,steps=18;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce)steps=1;
  (function step(){t++;if(t<steps){show(pick.map(()=>all[Math.floor(Math.random()*all.length)]),false);tone(500+t*25,.05);setTimeout(step,30+t*t*.6)}
    else{show(pick,true);last=pick;tone(784,.18);tone(1047,.3,.12);if(S.norep)c.used.push(...pick);save();spinning=false;$("m").src="../../assets/chars/cheer.webp";render()}})();
}
$("go").onclick=draw;
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();draw()}});
$("cls").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.cur=+b.dataset.i;last=[];save();render()};
$("seats").onclick=e=>{const b=e.target.closest(".seat");if(!b)return;const c=C(),i=+b.dataset.s;c.off=c.off.includes(i)?c.off.filter(x=>x!==i):[...c.off,i];save();render()};
$("minus").onclick=()=>{S.n=Math.max(1,S.n-1);save();render()};$("plus").onclick=()=>{S.n=Math.min(8,S.n+1);save();render()};
$("norep").onchange=e=>{S.norep=e.target.checked;save();render()};
$("reset").onclick=()=>{const c=C();c.used=[];last=[];$("m").src="../../assets/chars/point.webp";save();render()};
$("snd").onclick=()=>{S.sound=!S.sound;save();render()};
$("save").onclick=()=>{const c=C();c.name=$("cname").value.trim()||c.name;c.count=Math.max(1,Math.min(60,+$("ccount").value||c.count));
  c.names=$("cnames").value.split(/\r?\n/).map(s=>s.replace(/^\s*\d+[\s.、:：-]+/,"").trim());while(c.names.length&&!c.names[c.names.length-1])c.names.pop();
  if(c.names.length>c.count)c.count=c.names.length;c.used=c.used.filter(x=>x<=c.count);c.off=c.off.filter(x=>x<=c.count);save();last=[];render();$("saved").textContent="已儲存在這台裝置 ✓";setTimeout(()=>$("saved").textContent="",2500)};
$("addc").onclick=()=>{S.classes.push({name:"新班級",count:30,names:[],off:[],used:[]});S.cur=S.classes.length-1;save();render();$("cname").focus()};
$("delc").onclick=()=>{if(S.classes.length<2)return;const b=$("delc");if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="再按一次確定刪除";setTimeout(()=>{b.dataset.sure="";b.textContent="刪除這個班級"},3000);return}
  S.classes.splice(S.cur,1);S.cur=0;b.dataset.sure="";b.textContent="刪除這個班級";save();render()};
// bulk import: a line without a seat number is a class name, lines like "12 王小明" are students of that class.
// Seat numbers are kept as written, so a class that skips 8 and 14 keeps its real numbers and those two are never drawn.
function parseBulk(txt){const out=[];let cur=null;
  txt.replace(/^﻿/,"").split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line)return;
    const m=line.match(/^(\d{1,2})[\s.、:：,，-]+(.+)$/);
    if(m&&cur){cur.map[+m[1]]=m[2].trim()}
    else if(!m){cur={name:line.replace(/^[#＃\s]+/,"").replace(/[:：]\s*$/,"").trim(),map:{}};out.push(cur)}});
  return out.filter(g=>Object.keys(g.map).length)}
function applyBulk(list){let created=0;
  list.forEach(g=>{const max=Math.min(60,Math.max(...Object.keys(g.map).map(Number)));
    let c=S.classes.find(x=>x.name===g.name);if(!c){c={name:g.name,count:max,names:[],off:[],used:[]};S.classes.push(c);created++}
    c.count=max;c.names=[...Array(max)].map((_,i)=>g.map[i+1]||"");
    c.off=[...Array(max)].map((_,i)=>i+1).filter(i=>!g.map[i]);
    c.used=(c.used||[]).filter(x=>x<=max&&!c.off.includes(x))});
  save();last=[];render();return created}
const dumpAll=()=>S.classes.map(c=>c.name+"\n"+(c.names||[]).map((n,i)=>n?`${i+1} ${n}`:"").filter(Boolean).join("\n")).join("\n");
const bmsg=t=>{$("bulkmsg").textContent=t;setTimeout(()=>$("bulkmsg").textContent="",3500)};
$("bulkfile").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$("bulk").value=t;bmsg("已讀入檔案，按「匯入」")})};
$("bulkgo").onclick=()=>{const list=parseBulk($("bulk").value);if(!list.length){bmsg("沒有讀到名單，請確認格式");return}
  const created=applyBulk(list);$("bulk").value="";bmsg(`已匯入 ${list.length} 個班級${created?`（新增 ${created} 個）`:""} ✓`)};
$("bulkcopy").onclick=()=>{const t=dumpAll();const fb=()=>{$("bulk").value=t;$("bulk").select();bmsg("請手動複製上面的文字")};
  try{navigator.clipboard.writeText(t).then(()=>bmsg("已複製 ✓"),fb)}catch(e){fb()}};
render();
// one-tap import: opening ".../draw/#roster=<base64url of the roster text>" loads the names into this device only.
// The part after # is never sent to the web server, and it is removed from the address bar right after loading.
(function(){const m=location.hash.match(/^#roster=([A-Za-z0-9_-]+)$/);if(!m)return;
  try{const bin=atob(m[1].replace(/-/g,"+").replace(/_/g,"/"));const list=parseBulk(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))));
    if(!list.length)return;applyBulk(list);history.replaceState(null,"",location.pathname+location.search);
    $("hint").textContent="✓ 已匯入 "+list.length+" 個班級的名單";setTimeout(render,3500)}catch(e){}})();
</script>
<script src="../float.js"></script>
<script src="../pip.js"></script>
<script>
// floating window: on computer Chrome/Edge an interactive mini window (draw from it); elsewhere (iPad Safari) a
// floating picture that shows who was drawn — draw on this page, or press ▶/⏸ in the mini window to draw again.
const dpip=window.AhaoPip?AhaoPip((g,w,h)=>{const c=C();g.fillStyle="#191919";g.fillRect(0,0,w,h);g.textAlign="center";g.textBaseline="middle";
  g.fillStyle="#9b9b9b";g.font="700 26px 'PingFang TC','Microsoft JhengHei',sans-serif";g.fillText(c.name+(spinning?"　抽籤中…":""),w/2,34);
  const a=last.length?last:[];if(!a.length){g.fillStyle="#fff";g.font="900 150px 'Arial Black',sans-serif";g.fillText("?",w/2,h/2+16);return}
  const n=a.length,cols=Math.min(n,3),rows=Math.ceil(n/cols),cw=(w-40)/cols,ch=(h-70)/rows;
  a.forEach((x,i)=>{const cx=20+cw*(i%cols)+cw/2,cy=64+ch*Math.floor(i/cols)+ch/2,nm=name(c,x);
    g.fillStyle="#4e2c3c";g.beginPath();g.roundRect?g.roundRect(cx-cw/2+6,cy-ch/2+6,cw-12,ch-12,16):g.rect(cx-cw/2+6,cy-ch/2+6,cw-12,ch-12);g.fill();
    const big=Math.min(ch*(nm?.5:.7),cw*.5);g.fillStyle="#fff";g.font=`900 ${big}px 'Arial Black',sans-serif`;g.fillText(x,cx,cy-(nm?ch*.14:0));
    if(nm){g.font=`700 ${Math.min(ch*.24,cw/(nm.length+1))}px 'PingFang TC','Microsoft JhengHei',sans-serif`;g.fillText(nm,cx,cy+ch*.26)}})
},{onPlayPause:()=>draw()}):null;
$("pinb").onclick=()=>{if("documentPictureInPicture" in window)return ahaoFloat("draw");
  if(dpip&&dpip.supported)dpip.open().catch(()=>{});else alertLite("這個瀏覽器不支援浮動小視窗。iPad 請用 Safari，電腦請用 Chrome 或 Edge。")};
</script>
</body></html>
