            "115-25": { subject: "【生物】", source: "翰林版第二冊 2-1", concept: "遺傳、染色體與基因", answer: "B", explanation: "題幹說明甲、乙兩個袋子皆放入 50 顆黑棋與 50 顆白棋混勻，各自從兩袋分別抽出一顆棋子，相當於親代皆為 Aa，其中黑色棋子相當於顯性遺傳因子A、白色棋子相當於隱性遺傳因子 a。甲乙兩袋抽出 A 或 a 的機率皆為 1/2，按照棋盤格方格法推測，出現顯隱性的比例大約為 3：1。", quote: "🧬 3：1 的機率不是運氣，是規律，掌握它就贏了！ 🧬" },
            "115-26": { subject: "【地科】", source: "翰林版第五冊 6-2", concept: "板塊運動與內營力的影響", answer: "A", explanation: "由題幹敘述可知此海域東、西兩側陸地距離逐年增加，兩個板塊受張裂的力量作用相互分離，岩漿湧出後應形成的是火成岩，且形成較新的海洋地殼，故(B)錯誤。東、西兩側應屬於不同的板塊，(C)錯誤。板塊間的聚合才有可能有海溝形成，故(D)錯誤。", quote: "🌋 板塊張裂生成新地殼，突破舊框架你也會煥然一新！ 🌋" },
            "115-27": { subject: "【地科】", source: "翰林版第六冊 3-1", concept: "地球的大氣", answer: "A", explanation: "甲圖是「氣溫隨高度的變化」乙圖是「氣壓隨高度的變化」，題幹主要區分對流層與平流層，兩者最大差異在於氣流的流動方向與隨高度升高時氣溫的變化情況，對流層隨高度升高降溫，平流層因為有臭氧層，隨高度升高會升溫，氣壓則皆隨高度上升而下降，無法藉由此分辨對流層與平流層。", quote: "🌡️ 越往上越冷？到了平流層反而升溫，堅持下去就會回暖！ 🌡️" },
            "115-28": { subject: "【理化】", source: "翰林版第六冊 1-2", concept: "生活用電", answer: "C", explanation: "無熔絲開關是用來避免延長線超過可負荷的最大電流值，以免燒毀而發生意外；若要防止超過可負荷的最大電壓值，應以插頭與插座孔型式來做預防。", quote: "🔌 知道自己的負荷上限，安全用電也安全用腦！ 🔌" },
            "115-29": { subject: "【生物】", source: "翰林版第二冊 3-4", concept: "植物界", answer: "C", explanation: "題幹敘述穿山龍花朵為白色，故可推測出此植物應為被子植物，按照被子植物的特徵判斷。(A)學名應用拉丁文二名法書寫；(B)被子植物利用種子生殖，而非孢子生殖；(D)毬果是裸子植物的生殖器官，並非被子植物。", quote: "🌸 開花結果靠種子，你的努力就是會發芽的種子！ 🌸" },
            "115-30": { subject: "【理化】", source: "翰林版第三冊 5-3", concept: "比熱", answer: "A", explanation: "相同質量與相同熱量都加熱 500 秒的條件下，溫度變化量與比熱成反比，與初溫無關。由圖(十七)可看出，同樣加熱 500 秒的情況下，甲乙的溫度變化量一樣且大於丙的溫度變化量。", quote: "🔥 比熱越小升溫越快，現在加熱正是時候！ 🔥" },
            "115-31": { subject: "【理化】", source: "翰林版第六冊 1-4", concept: "電流的化學效應", answer: "B", explanation: "電鍍時，被鍍物(鑰匙)需放置在與電池負極連接處，擬鍍金屬(銅片)需放置在與電池正極連接處，水溶液中的 Cu²⁺ 會往負極移動還原成金屬銅。", quote: "✨ 銅離子往負極跑，你的目標就在前方等你鍍上光芒！ ✨" },
            "115-32": { subject: "【理化】", source: "翰林版第四冊 6-3", concept: "壓力", answer: "B", explanation: "物體原體積為 6000 cm³，與桌面接觸面積為 600 cm²，若物體密度為 D，則原壓力 P＝6000D ÷ 600＝10D。物體後來體積 1600 cm³，與桌面接觸面積為 200 cm²，則後來壓力為 1600D ÷ 200＝8D＝(4/5)P。", quote: "🧱 面積變小壓力變大，專注一點就能產生大能量！ 🧱" },
            "115-33": { subject: "【理化】", source: "翰林版第四冊 6-4", concept: "浮力", answer: "B", explanation: "已知陶瓷碗本身密度大於水，若要浮出水面，需靠碗內的空間創造更多的液面下體積，產生更多的浮力。甲圖：若碗中裝滿水，則無法靠碗內的空間創造更多的液面下體積來產生浮力，應為沉體。乙圖：陶瓷碗若要浮出液面，碗內的水面應低於外面水面，才能靠碗內的空間創造更多的液面下體積，產生更多的浮力。", quote: "🥣 碗會浮起來是因為裝了空間，給自己留點空間更能浮出水面！ 🥣" },
            "115-34": { subject: "【地科】", source: "翰林版第六冊 3-3", concept: "氣團與鋒面", answer: "D", explanation: "由圖(二十)得知，臺灣受此氣壓系統影響，且題幹敘述，臺灣此時較為乾熱，故可推測此氣壓系統應為高氣壓，導致乾燥，另外對鋒面的敘述為長期存在於日本到中國間，且導致暴雨，推測應為滯留鋒。", quote: "🌤️ 看懂高氣壓與滯留鋒，天氣與考題都不再難測！ 🌤️" },
            "115-35": { subject: "【理化】", source: "翰林版第六冊 2-2", concept: "電流的磁效應", answer: "C", explanation: "依照安培右手定則，丙的磁針所在位置，若有電流通過，電流磁場與地球磁場方向一致，磁針不會因為電流通過而偏轉，無法藉此判斷是否有電流通過。", quote: "🧭 右手定則握在手，磁場方向一看就懂！ 🧭" },
            "115-36": { subject: "【理化】", source: "翰林版第三冊 2-2", concept: "溶液與濃度", answer: "D", explanation: "甲杯水溶液重量百分濃度 P%＝20 ÷ (20＋20) × 100%＝50%，乙杯水溶液重量百分濃度 P%＝30 ÷ (30＋20) × 100%＝60%。", quote: "🍬 濃度要算清楚，讀書的濃度也要加滿！ 🍬" },
            "115-37": { subject: "【生物】", source: "翰林版第一冊 3-2", concept: "酵素", answer: "B", explanation: "由題幹敘述可知此人體內的酵素可以分解蛋白質，並製造出產物 X，圖(二十二)顯示，隨時間此蛋白質數量漸少，產物 X 漸增，證明此酵素應屬於蛋白酶。(A)膽汁功能是乳化脂質，且無酵素；(C)(D)X 為蛋白質受酵素催化後的產物，並非受質，故不會因為此酵素分解或合成。", quote: "🥚 像蛋白酶一樣把大題目分解成小步驟，一口一口吃掉它！ 🥚" },
            "115-38": { subject: "【地科】", source: "翰林版第五冊 7-2", concept: "晝夜與四季", answer: "C", explanation: "由題幹得知此地點位於北半球且緯度高於嘉義，夏季時白天時數大於嘉義，春分秋分時太陽直射赤道，白天時數兩地相近，無明顯分別，冬季則白天時數小於嘉義。", quote: "☀️ 緯度不同白天不同，每個人都有屬於自己的時區！ ☀️" },
            "115-39": { subject: "【生物】", source: "翰林版第一冊 4-4", concept: "人體的循環系統", answer: "D", explanation: "甲：肺臟流出的血液屬於肺循環，會進入肺靜脈，接續進入左心房，而非右心房。乙：肝臟流出的血液屬於體循環的一部分，由肝臟流出的血液進入下大靜脈，接續進入右心房，而非右心室。", quote: "❤️ 肺循環、體循環走對路，答案自然流回心中！ ❤️" },
            "115-40": { subject: "【理化】", source: "翰林版第四冊 3-4", concept: "酸鹼反應", answer: "A", explanation: "鹽酸+氫氧化鈉→氯化鈉+水，然而氯化鈉在水中仍然是以解離形態存在，故鈉離子的數量不會改變，但因為鹽酸加入，溶液體積增加，使鈉離子的濃度下降。", quote: "⚗️ 離子數量不變，濃度會變，看清本質就不會被騙！ ⚗️" },
            "115-41": { subject: "【理化】", source: "翰林版第五冊 2-2", concept: "運動定律", answer: "B", explanation: "若物體重量為 W，圖中甲乙的運動狀態為合力＝0的表現，故 F 甲＝F 乙＝W，丙的加速度方向向下，故丙的合力向下，意味著 F 丙＜W。", quote: "🚀 合力為零就靜止，給自己一點推力就能加速前進！ 🚀" },
            "115-42": { subject: "【地科】", source: "翰林版第六冊 4-3", concept: "人與自然的互動", answer: "D", explanation: "由圖(二十六)敘述得知全臺有 14 個測站，單一測站的 pH 值為 4.96，圖(二十七)則是多個測站取平均值 pH 值為 5.86，故造成此誤差的主要原因應該是單一測站與多個測站取平均值造成的差異。", quote: "🌧️ 一站與多站平均大不同，看資料要看完整！ 🌧️" },
            "115-43": { subject: "【地科】", source: "翰林版第六冊 4-3", concept: "人與自然的互動", answer: "B", explanation: "表(三)中的甲乙兩部分，分別選取了北臺灣的臺北與宜蘭，和南臺灣的雲林和嘉義，兩者分別位處於東北季風的迎風面與背風面，主因是為了檢驗圖(二十六)中敘述，位於東北季風迎、背風面是否影響雨水 pH 值。(A)酸雨判定的標準與甲乙兩部分的選擇無關；(C)(D)酸雨發生的機率、汙染物種類與pH 的關聯性與甲乙的選擇無關。", quote: "🌬️ 迎風面與背風面都經歷過，你就更懂得比較！ 🌬️" },
            "115-44": { subject: "【生物】", source: "翰林版第一冊 4-2", concept: "植物體內物質的運輸", answer: "C", explanation: "由圖(二十九)得知，(A)0～1 時之間氣泡已經有移動距離，應判斷有發生蒸散作用；(B)3～4 時之間氣泡已經明顯有移動距離，故有發生蒸散作用；(D)從圖中可看出，6～7 時的平均蒸散速率較 7～8 時的平均蒸散速率小。", quote: "🍃 氣泡在動就是在蒸散，你的每一點進步都看得見！ 🍃" },
            "115-45": { subject: "【生物】", source: "翰林版第一冊 4-2", concept: "植物體內物質的運輸", answer: "D", explanation: "本題需選出最不可能的選項，植物的氣孔主要功能是蒸散作用，將根部的水分向上單向傳輸，無法向下運輸。", quote: "🌿 水分只能往上送，你的成績也只會往上升！ 🌿" },
            "115-46": { subject: "【理化】", source: "翰林版第五冊 1-4", concept: "自由落體運動", answer: "C", explanation: "不考慮空氣阻力，根據力學能守恆，自由落體的末速度只與落下高度有關，落下高度越高，落地速度越快。", quote: "💦 落得越高衝得越快，蓄積的能量終會爆發！ 💦" },
            "115-47": { subject: "【理化】", source: "翰林版第五冊 2-3", concept: "作用力與反作用力定律", answer: "A", explanation: "作用力與反作用力必須大小相等、方向相反。由圖(三十一)可看出(A)圖形水滴所受的作用力最大，反作用力亦最大。", quote: "💥 作用力越大反作用力越大，你的付出一定有回報！ 💥" },
            "115-48": { subject: "【理化】", source: "翰林版第四冊 1-1", concept: "常見的化學反應", answer: "D", explanation: "鹽酸與鎂帶反應會產生氫氣，雙氧水分解反應會產生氧氣，鹽酸與碳酸鈣反應會產生二氧化碳。", quote: "🫧 認清每一種氣體，就像認清每一個考點！ 🫧" },
            "115-49": { subject: "【理化】", source: "翰林版第三冊 2-1", concept: "認識物質", answer: "D", explanation: "空氣中氧氣占比約 1/5，5 mL 空氣應有 1 mL 氧氣，表(四)中組別二氣體剩餘體積為 4.5 mL，代表氧氣消耗 0.5 mL，大約是氧氣含量的一半。", quote: "🌬️ 氧氣只占五分之一，抓住關鍵比例就能解題！ 🌬️" },
            "115-50": { subject: "【理化】", source: "翰林版第四冊 2-2", concept: "氧化還原", answer: "A", explanation: "由表(五)得知，鐵活性小於碳，無法與二氧化碳發生氧化還原反應。", quote: "🏆 活性大小決定反應，主動積極決定你的成績！ 🏆" },

            // --- 114年 ---
            "114-1": { subject: "【理化】", source: "翰林版第三冊 3-4", concept: "聲波的傳播與應用", answer: "C", explanation: "超聲波頻率超過人耳振動頻率，耳膜無法與超聲波產生共振，故孕婦聽不見超聲波。", quote: "📡 你的頻率已經超越極限，繼續保持高頻接收知識吧！ 📡" },
            "114-2": { subject: "【理化】", source: "翰林版第三冊 1-3", concept: "體積與密度", answer: "B", explanation: "要測量物體的密度，公式為 D = M / V。因此我們需要測量兩個物理量：質量(M)與體積(V)。(1) 測量質量需使用「天平」。(2) 測量不規則物體的體積，通常使用「排水法」，這需要用到「量筒」。故選(B)天平與量筒。", quote: "🧱 紮實的基礎就像密度高的物質，絕對經得起考驗！ 🧱" },
            "114-3": { subject: "【生物】", source: "翰林版第二冊 4-2", concept: "生物間的互動關係", answer: "A", explanation: "根據題幹描述：(1)白尾八哥會和麻雀搶食飼料 → 這屬於「競爭」關係。(2)白尾八哥會捕食麻雀的幼鳥 → 這屬於「掠食」關係。綜合以上，兩者之間的交互作用包含競爭與掠食。", quote: "🦅 良性競爭讓你更強大，在考場上展現你的優勢吧！ 🦅" },
            "114-4": { subject: "【理化】", source: "翰林版第三冊 2-1 / 6-1", concept: "認識物質 / 元素與化合物", answer: "A", explanation: "我們來分析各選項的組成：(A) 硫磺(S)是元素，只含有一種原子。(B) 水(H₂O)是化合物，含有氫(H)和氧(O)兩種原子。(C) 18K金是合金(混合物)，主要含金(Au)和銅(Cu)等，至少兩種原子。(D) 空氣是混合物，含氮氣(N₂)、氧氣(O₂)等，原子種類多種。故原子種類最少的是硫磺。", quote: "💎 知識的純度越高，你的實力就越晶瑩剔透！ 💎" },
            "114-5": { subject: "【地科】", source: "翰林版第六冊 3-3", concept: "氣團與鋒面", answer: "D", explanation: "由圖中黑線的鋒面符號（三角形）可知此為「冷鋒」。冷鋒是冷氣團主動推向暖氣團。密度大的冷空氣(甲)會在下方推擠，密度小的暖空氣(乙)會被迫沿著鋒面抬升。因此，甲代表冷氣團，乙代表暖氣團。", quote: "🌧️ 冷暖氣團交會激發出雨水，你的努力將激發出豐碩成果！ 🌧️" },
            "114-6": { subject: "【地科】", source: "翰林版第六冊 4-3", concept: "人與自然的互動", answer: "A", explanation: "題目關鍵字是「超抽地下水」。長期超抽地下水會導致岩層孔隙中的水壓下降，土壤壓密，進而造成「地層下陷」。(B)順向坡易造成山崩；(C)土石流多與豪雨和坡度有關；(D)海嘯多由海底地震引起。", quote: "🏗️ 地基打得穩，大樓蓋得高，你的實力堅若磐石！ 🏗️" },
            "114-7": { subject: "【生物】", source: "翰林版第一冊 1-2", concept: "探究自然的科學方法", answer: "B", explanation: "本實驗目的是探討「太陽直射位置」與「地球引力」對立蛋的影響。因此，「太陽直射位置」（即不同的日期或地點）是操作變因，而「雞蛋的條件」必須是控制變因，保持不變。所以應使用「同一顆生雞蛋」在不同時間進行測試，才能公平比較。", quote: "🧪 控制好每一個變因，成功就是你能預期的結果！ 🧪" },
            "114-8": { subject: "【生物】", source: "翰林版第二冊 3-3", concept: "植物如何製造養分", answer: "A", explanation: "光合作用的條件需要「葉綠素」和「光」。(1) 甲部位呈現綠色（含葉綠素）且照得到光，能進行光合作用釋放氧氣。(2) 乙部位埋在土裡，雖有葉綠素但「照不到光」，無法進行光合作用，故無法釋放氧氣。故選(A)。", quote: "✨ 只要有光就能製造養分，你就是那個自帶光芒的人！ ✨" },
            "114-9": { subject: "【理化】", source: "翰林版第四冊 6-1 / 第五冊 2-3", concept: "力與平衡 / 作用力與反作用力", answer: "D", explanation: "首先，鉛筆靜止不動，處於力平衡狀態，所以左手推力等於右手推力，即 F左 = F右 = 1N。接著，根據牛頓第三運動定律（作用力與反作用力），手推筆的力等於筆推手的力，所以 F左' = F左 = 1N，F右' = F右 = 1N。因此四個力的大小皆為 1N。", quote: "⚖️ 找到身心的平衡點，所有壓力都能互相抵銷！ ⚖️" },
            "114-10": { subject: "【理化】", source: "翰林版第五冊 4-1", concept: "電荷與靜電現象", answer: "B", explanation: "靜電力的大小與距離平方成反比（距離越近，力越大）。(1) 乙球向左移近甲球：甲乙帶同性電（正電），距離變近，排斥力變大。(2) 乙球向左遠離丙球：乙丙帶同性電，距離變遠，排斥力變小。故選(B)。", quote: "🧲 你的吸引力法則正在運作，好成績正向你靠近！ 🧲" },
            "114-11": { subject: "【理化】", source: "翰林版第三冊 2-2", concept: "溶液與濃度", answer: "C", explanation: "ppm 是百萬分點濃度（mg/kg 或 mg/L）。題目給出 1 公斤 (1000 g) 的肉品中含有 30 毫克 (30 mg) 的萊克多巴胺。計算：30 mg / 1 kg = 30 ppm。故選(C)。", quote: "🔬 細節決定成敗，連百萬分之一的誤差都逃不過你的法眼！ 🔬" },
            "114-12": { subject: "【生物】", source: "翰林版第一冊 5-1", concept: "刺激與反應", answer: "C", explanation: "分析神經傳導路徑：(1) 兩人都「看見」明星，受器皆為眼睛（視網膜）。(2) 兩人皆做出反應（尖叫、追逐），中樞皆為大腦（意識行為）。(3) 整個過程都需要感覺神經元傳入訊息，以及運動神經元傳出命令。故選(C)。", quote: "⚡ 反應速度一流！你的大腦神經網路已經升級為光纖了！ ⚡" },
            "114-13": { subject: "【地科】", source: "翰林版第六冊 3-2", concept: "天氣現象", answer: "D", explanation: "題目討論的是台灣冬季的氣候特色。(D) 高雄位於台灣西南部，冬季時位於中央山脈的背風面，東北季風受到山脈阻擋，氣流下沉增溫，天氣通常晴朗乾燥，因此不需要擔心雨水隨東北風吹入陽台的問題，此建議最合理。", quote: "🌬️ 順風而行，逆風飛翔，無論風向如何你都能抵達目標！ 🌬️" },
            "114-14": { subject: "【理化】", source: "翰林版第三冊 4-5", concept: "色散與顏色", answer: "C", explanation: "紅光照射下出現紅色，該物體表面可為白或紅，此物體改由白光照射，將呈現白色或紅色。此題最多兩白球或兩紅球。紅光照射下出現黑色，該物體表面可為黑或紅以外的顏色，此物體改由白光照射，將呈現黑色或紅以外的顏色。此題有可能為 1 黑球或 1 紅色以外的球。(A)可能兩個皆為白球，無紅球；(B)可能無黑球；(D)依題意，無此種可能。", quote: "🌈 綻放你的光芒，讓世界看見你獨一無二的色彩！ 🌈" },
            "114-15": { subject: "【地科】", source: "翰林版第五冊 6-1", concept: "板塊運動", answer: "B", explanation: "板塊邊界與海陸交界不一定重合。(A)錯誤。(B)板塊交界地帶地殼變動活躍，地震頻繁，正確。(C)高聳山脈（如喜馬拉雅山）通常位於聚合性板塊交界。(D)中洋脊是張裂性板塊交界。", quote: "🌋 累積的能量即將爆發，你的實力將撼動全場！ 🌋" },
            "114-16": { subject: "【地科】", source: "翰林版第五冊 6-3", concept: "岩層的紀錄", answer: "C", explanation: "根據截切定律與疊置定律判斷：(1) 岩脈截切過砂岩與頁岩，代表岩脈最晚形成（600萬年前）。(2) 火山灰岩層在頁岩下方，代表最早形成（800萬年前）。(3) 因此，介於中間的頁岩與砂岩，其形成年代應在 800萬年 到 600萬年 之間。", quote: "📚 一步一腳印，你的努力就像岩層一樣層層堆疊！ 📚" },
            "114-17": { subject: "【理化】", source: "翰林版第三冊 6-3", concept: "物質結構與原子", answer: "A", explanation: "分析粒子數：Ca 的原子序 20，質子數 w=20。Ca²⁺ 是失去2個電子，電子數 y=18。Cl 的原子序 17，質子數 x=17。Cl⁻ 是得到1個電子，電子數 z=18。比較大小：w(20) > z(18)，故(A)正確。", quote: "⚛️ 掌握核心本質，你就是那個帶正電的能量中心！ ⚛️" },
            "114-18": { subject: "【理化】", source: "翰林版第四冊 6-2", concept: "摩擦力", answer: "C", explanation: "分析摩擦力圖形：(1) 當外力小於最大靜摩擦力（400gw）時，物體靜止，此時「靜摩擦力 = 外力」。(2) 因此，當外力 F 越小（但在 0~400gw 之間），靜摩擦力 f 也會隨之變小。故選(C)。", quote: "🚀 克服靜摩擦力之後，你將一路暢行無阻！ 🚀" },
            "114-19": { subject: "【理化】", source: "翰林版第四冊 3-2", concept: "酸和鹼", answer: "C", explanation: "這是一種碳封存技術。二氧化碳溶於水形成碳酸根離子，與岩石中的鈣離子反應，生成難溶於水的「碳酸鈣」(CaCO₃) 沉澱，藉此將二氧化碳固定在岩石中。", quote: "🔒 將知識牢牢封存在腦海裡，誰也帶不走！ 🔒" },
            "114-20": { subject: "【生物】", source: "翰林版第一冊 6-3", concept: "血糖恆定", answer: "B", explanation: "健康成人的血糖調節機制運作正常。進食後血糖會升高，胰島素分泌使血糖下降回正常值。圖(B)顯示甲（健康者）進食後血糖上升，隨後在短時間內降回正常範圍；乙（糖尿病患）血糖上升後難以將回，且基礎血糖較高。故選(B)。", quote: "🍬 保持穩定的實力輸出，你就是考場上的最佳MVP！ 🍬" },
            "114-21": { subject: "【理化】", source: "翰林版第四冊 5-4", concept: "有機物應用", answer: "D", explanation: "觀察圖表中的數據：PET、POM、PP 三種材質在 70℃ 時的質量變化率（磨損程度），都明顯高於 50℃ 時的數值。這表示在高溫環境下，這些塑膠材質的耗損率確實較高，耐用度下降。", quote: "🥤 選對方法就像選對容器，裝載無限的知識與潛力！ 🥤" },
            "114-22": { subject: "【生物】", source: "翰林版第一冊 4-2", concept: "植物運輸", answer: "C", explanation: "蒸散作用是植物體內水分向上運輸的主要動力。水分在植物體內是透過維管束中的「木質部」進行運輸。圖中乙的位置在維管束內側，為木質部；甲為外側的韌皮部。故選(C)。", quote: "🌳 向上輸送的動力源源不絕，你的成績蒸蒸日上！ 🌳" },
            "114-23": { subject: "【地科】", source: "翰林版第六冊 3-2", concept: "天氣現象", answer: "B", explanation: "風速的大小取決於「氣壓梯度力」。等壓線越密集，代表單位距離內的氣壓差越大，風速就越強。觀察四個選項，(B)圖中的低氣壓中心(1000)與外圍(1008)距離最近，等壓線最密，故風速最大。", quote: "💨 壓力越大動力越強，讓這股強風助你一臂之力！ 💨" },
            "114-24": { subject: "【生物】", source: "翰林版第二冊 3-2", concept: "生物分類", answer: "A", explanation: "分類階層口訣：界門綱目科屬種。題目表中列出了 3 個不同的「科」（雁鴨科、鸕鶿科、鵜鶘科）。因為「科」是「目」的下一層級，不同的科可能屬於同一個目，但也可能屬於不同的目，所以最多可能有 3 個目。屬名部分共有 4 個不同的字首（Mareca, Aythya, Phalacrocorax, Pelecanus），故有 4 個屬。", quote: "🗂️ 條理分明，邏輯清晰，任何難題都難不倒你的分類腦！ 🗂️" },
            "114-25": { subject: "【理化】", source: "翰林版第六冊 1-3", concept: "電池", answer: "B", explanation: "比較實驗數據：(1) 實驗1 vs 實驗2：改變正極銅片面積，功率由 0.45 變為 0.11 (差異大)。(2) 實驗1 vs 實驗3：改變負極鋅片面積，功率由 0.45 變為 0.42 (差異小)。結論：正極金屬片的面積對電池功率的影響較大。", quote: "🔋 充滿電量，蓄勢待發，這一刻你就是最強的發電機！ 🔋" },
            "114-26": { subject: "【理化】", source: "翰林版第三冊 5-3", concept: "比熱", answer: "D", explanation: "比熱的定義是物質升高 1℃ 所需的熱量。比熱越小，溫度越容易改變（升溫快、降溫也快）。鉛的比熱 (0.031) 遠小於銅的比熱 (0.093)。在質量相同、加熱熱源相同的條件下，比熱小的鉛，溫度上升會較快。", quote: "🌡️ 保持熱情但冷靜應對，你的心理素質高人一等！ 🌡️" },
            "114-27": { subject: "【生物】", source: "翰林版第一冊 1-3", concept: "實驗室器材", answer: "D", explanation: "古董顯微鏡的構造「丁」是反光鏡，用來反射光線。現代複式顯微鏡通常使用內建光源（燈泡）加上「光圈」或「聚光鏡」來調節進光量與光線聚焦，已較少使用反光鏡，故此構造的功能差異最大。", quote: "🔍 放大視野，看見細節，你的洞察力無人能及！ 🔍" },
            "114-28": { subject: "【理化】", source: "翰林版第四冊 2-2", concept: "氧化與還原", answer: "B", explanation: "碘液原本是褐色，與澱粉作用呈藍黑色。綠茶能使碘液退色，代表發生了氧化還原反應。碘被還原成碘離子（無色），這表示綠茶中含有具「還原能力」的物質（抗氧化劑），這與維生素C的作用相似。", quote: "🍊 還原事情的真相，你的邏輯推理能力就像維生素C一樣強大！ 🍊" },
            "114-29": { subject: "【理化】", source: "翰林版第三冊 1-3", concept: "體積與密度", answer: "D", explanation: "由圖可知液體分層情況：X 在下層，Y 在上層，故密度 Dx > Dy。題目說三個試管總體積相同。甲試管 X 液體佔比最多，因為 X 密度大，所以甲試管的總質量最大；丙試管 X 液體最少，總質量最小。順序為 甲 > 乙 > 丙。", quote: "🏆 不管環境如何分層，你永遠是浮在最頂尖的那一群！ 🏆" },
            "114-30": { subject: "【生物】", source: "翰林版第二冊 2-1", concept: "遺傳", answer: "A", explanation: "判斷顯隱性：親代甲(黑眼) x 乙(黑眼) 生出子代丙(紅眼)。這表示「紅眼」是隱性性狀(aa)，「黑眼」是顯性性狀(A_)。因為丙是 aa，其基因一個來自甲，一個來自乙，故甲、乙的基因型必定都是雜合子 Aa。所以甲和乙的基因型一定相同。", quote: "🧬 優秀是會遺傳的，而努力是你最強的顯性基因！ 🧬" },
            "114-31": { subject: "【理化】", source: "翰林版第六冊 2-2", concept: "電流的磁效應", answer: "A", explanation: "電流向北，依照安培右手定則，甲實驗磁針受到電流磁場的切線向東，於是向東方偏轉，乙實驗磁針受到電流磁場的切線向西，於是向西方偏轉，且由於電壓、電流較甲大，故偏轉角度也較大。", quote: "🧲 電流越大磁力越強，你的努力越多，前進的力量也越大！ 🧲" },
            "114-32": { subject: "【理化】", source: "翰林版第四冊 1-2", concept: "質量守恆定律", answer: "B", explanation: "化學反應前後，原子種類及數量必須固定，且依照質量守恆定律，化學反應前後總質量不變，總消耗質量＝總生成質量。(A)乙的質量應該減少，丁的質量應該增加；(C)化學反應後沒有生成丙，原子種類及數量無法固定；(D)化學反應後總質量減少，違反質量守恆定律。", quote: "⚖️ 原子不會憑空消失，你付出的努力也一點都不會少！ ⚖️" },
            "114-33": { subject: "【地科】", source: "翰林版第五冊 6-2", concept: "板塊運動", answer: "D", explanation: "圖中斷層面是向右傾斜的（乙側在斷層面上方，為上盤；甲側在下方，為下盤）。若要鑽探到斷層面，必須在斷層面的上方（乙側）向下鑽，才能與傾斜的斷層面相交。若在甲側鑽井，只會離斷層面越來越遠。", quote: "⛰️ 深入地底探尋真相，你的洞察力直達核心！ ⛰️" },
            "114-34": { subject: "【生物】", source: "翰林版第二冊 3-3", concept: "生物分類", answer: "D", explanation: "分析生物特徵：(1) 甲：有細胞核（真核）、有細胞壁、有菌絲、無葉綠體。這符合「真菌界」（如黴菌）的特徵。(2) 乙：無細胞核（原核）、有細胞膜、有葉綠素（可光合作用）。這符合「原核生物界」中的藍綠菌（藍綠藻）。", quote: "🍄 分辨真核與原核，就像分辨是非一樣，你心裡自有一把尺！ 🍄" },
            "114-35": { subject: "【生物】", source: "翰林版第二冊 1-1", concept: "細胞分裂", answer: "A", explanation: "題目中的「甲過程」指的是細胞數目增加、個體長大的過程，即「細胞分裂」。(1) 以葉片繁殖（無性生殖）長出幼苗，需透過細胞分裂。(2) 種子萌發（有性生殖後的發育）長成幼苗，也需透過細胞分裂來生長。故兩者皆包含甲過程。", quote: "🌱 不管是葉片還是種子，成長的本質都是不斷分裂與茁壯！ 🌱" },
            "114-36": { subject: "【生物】", source: "翰林版第一冊 3-1", concept: "養分測定", answer: "A", explanation: "唾液含有澱粉酶，能將澱粉分解成糖。(1) 正常情況：澱粉被分解，碘液測試不變色（無澱粉），本氏液測試變色（有糖）。(2) 題目問「唾液完全失去作用」：澱粉未被分解。因此，碘液測試應呈藍黑色（有澱粉），本氏液測試應不變色（無糖）。符合此結果的是表格中的第一列。", quote: "🍚 消化吸收知識的精華，轉化為滿滿的能量！ 🍚" },
            "114-37": { subject: "【地科】", source: "翰林版第五冊 7-1", concept: "太陽系", answer: "B", explanation: "行星繞日運轉，位置會改變。(A) 地球軌道在金星外側，不可能在水星金星間。(B) 地球(第3顆)與火星(第4顆)若分別運行到太陽兩側，太陽確實可能位於它們中間。(C) 太陽是中心，不會跑到金星水星中間。(D) 地球在火星內側，木星在更外側，地球不可能夾在火星木星中間。", quote: "🪐 在浩瀚宇宙中找到自己的定位，你就是最閃亮的那顆星！ 🪐" },
            "114-38": { subject: "【生物】", source: "翰林版第一冊 1-2", concept: "科學方法", answer: "C", explanation: "比較 81 年與 106 年的規範，106 年增加了許多具體要求（如扇葉距地高度、測量距離等）。這些新增的規定都是為了統一實驗中的「控制變因」，確保在不同地點、不同時間進行的測試，其結果具有可比性與公平性。", quote: "📏 標準越嚴格，你的實力就越能禁得起考驗！ 📏" },
            "114-39": { subject: "【理化】", source: "翰林版第三冊 3-2", concept: "力與運動", answer: "C", explanation: "利用 F = ma 判斷力的大小，加速度 a 可由 v-t 圖斜率求得。(1) 0~4秒：斜率固定且最陡，a = 1，F₂ = m × 1。(2) 4~6秒：水平線，斜率為0，a = 0，F₅ = 0。(3) 6~10秒：斜率固定（負值），大小與0~4秒相同，|a| = 1，F₇ = m × 1。故 F₂ = F₇ > F₅。", quote: "📈 看懂速度變化的趨勢，你就掌握了力量的方向！ 📈" },
            "114-40": { subject: "【理化】", source: "翰林版第三冊 5-1", concept: "熱對物質影響", answer: "A", explanation: "這是一個物理變化現象。燒瓶內的熱水蒸氣，因為碰到上方冰冷的冰塊，迅速「凝結」成液態水。氣體變液體體積急劇縮小，導致燒瓶內部氣壓瞬間降低，小於外界大氣壓力，因此將水槽中的水吸入燒瓶中。", quote: "❄️ 冷靜下來，像水蒸氣凝結一樣，把紛亂的思緒沉澱成智慧！ ❄️" },
            "114-41": { subject: "【理化】", source: "翰林版第五冊 能源", concept: "能源", answer: "D", explanation: "觀察圖表，液化氫在橫軸（單位質量能量）雖然很高，但在縱軸（單位體積能量）卻偏低。這意味著：雖然氫氣很輕、能量密度高，但因為它太蓬鬆（密度低），要儲存相同的能量，需要非常大的體積容器，這就是其儲存上的劣勢。", quote: "⛽ 雖然佔空間，但你的潛力就像氫燃料一樣爆發力十足！ ⛽" },
            "114-42": { subject: "【理化】", source: "翰林版第六冊 1-2", concept: "生活用電", answer: "B", explanation: "計算電費需使用「度」數（千瓦小時, kWh）。(1) 功率 700W = 0.7 kW。(2) 使用時間 30 小時。(3) 總耗電量 = 0.7 kW × 30 h = 21 度。(4) 總電費 = 21 度 × 3 元/度。故選(B) 0.7 × 30 × 3。", quote: "⚡ 每一分努力都像發電一樣，正在累積無價的能量！ ⚡" },
            "114-43": { subject: "【生物】", source: "翰林版第一冊 1-2", concept: "科學方法", answer: "D", explanation: "比較三個實驗的變綠速率：(1) 全程 10℃：第 15 天才變綠。(2) 全程 25℃：完全沒變綠。(3) 先 10℃ 處理 3 天再移至 25℃：第 5 天就變綠了。結論：經過低溫誘導後再回暖，能最快速促進蒜頭變綠。", quote: "🧄 經過低溫的考驗，你將在溫暖的時刻綻放最耀眼的色彩！ 🧄" },
            "114-44": { subject: "【理化】", source: "翰林版第四冊 3-3", concept: "酸鹼", answer: "C", explanation: "分析能讓蒜頭變綠的物質：食醋（含乙酸）、甲酸。不能變綠的：鹽酸、硫酸。乙酸(CH₃COOH)和甲酸(HCOOH)都是「有機酸」，分子中都含有羧基(-COOH)。鹽酸和硫酸是無機強酸，不含此結構。故關鍵在於 -COOH 原子團。", quote: "🧪 找到關鍵因子，就像找到解題的鑰匙，一通百通！ 🧪" },
            "114-45": { subject: "【生物】", source: "翰林版第一冊 4-4", concept: "血液循環", answer: "D", explanation: "觀察小花的檢驗結果：出血時間測定中，血滴持續出現直到最後，代表出血時間過長，凝血功能異常。在血液成分中，負責凝血作用的是「血小板」。因此醫生會懷疑是血小板數量不足或功能異常。", quote: "🩸 雖然受了點小傷，但你的修復能力超強，很快就能復原！ 🩸" },
            "114-46": { subject: "【生物】", source: "翰林版第一冊 4-4", concept: "血液成分", answer: "D", explanation: "承上題，人體血液中負責傷口凝血、止血的主要成分是「血小板」。(A)淋巴屬於淋巴系統；(B)白血球負責免疫；(C)紅血球負責運輸氧氣。故選(D)。", quote: "🛡️ 你的基礎知識就是你的血小板，為你的成績止血停損！ 🛡️" },
            "114-47": { subject: "【理化】", source: "翰林版第五冊 3-1", concept: "功與功率", answer: "B", explanation: "功 (W) = 力 (F) × 位移 (S)。(1) 查圖表：當懸掛砝碼質量 M = 200g 時，彈簧秤讀數（施力）F = 150 gw。(2) 位移 S = 10 cm。(3) 作功 W = 150 gw × 10 cm = 1500 gw‧cm。故選(B)。", quote: "💪 做功等於力量乘以位移，你的每一步付出都在累積成就！ 💪" },
            "114-48": { subject: "【理化】", source: "翰林版第五冊 3-1", concept: "簡單機械", answer: "D", explanation: "觀察關係圖，當砝碼質量 M=0 時，施力 F 卻不為 0（有截距）。這是因為阿貴使用的是「動滑輪」，施力除了要拉起砝碼，還要支撐「動滑輪本身的重量」以及克服「繩子與滑輪間的摩擦力」。故選(D)。", quote: "⚖️ 考慮到所有細節與誤差，你的思考就像精密儀器一樣準確！ ⚖️" },
            "114-49": { subject: "【地科】", source: "翰林版第五冊 7-3", concept: "日地月的相對運動", answer: "C", explanation: "題幹敘述阿平想模擬月球的移動，並將球置於甲處，以模擬「上弦月」時的月、地相對位置狀態，並依箭頭的路徑將球慢慢從甲處移至乙處，由此可知甲處代表的西明東暗的上弦月，繞半圈後的乙處則為東明西暗的下弦月，阿平兩個時間點看到的皆為一半亮一半暗，故(A)(B)錯誤；(D)因為太陽在同一側，故月亮亮面應該要同邊，故(D)錯誤。", quote: "🌕 陰晴圓缺都有時，掌握規律就能預見未來！ 🌕" },
            "114-50": { subject: "【地科】", source: "翰林版第五冊 7-2", concept: "晝夜四季", answer: "B", explanation: "從上弦月（甲）運行到下弦月（乙），大約經過半個朔望月，也就是約 15 天。(1) 地球自轉一圈需 1 天，故 15 天約自轉 15 圈。(2) 地球公轉一圈需 365 天，15 天僅公轉了約 15/365 圈，遠小於 15 圈。故選(B)。", quote: "🌍 地球不停轉動，你的進步也永不停歇！ 🌍" },

            // --- 113年 ---
            "113-1": { subject: "【理化】", source: "第五冊 直線運動", concept: "位移與路徑長", answer: "B", explanation: "位移是「起點到終點的直線距離」，路徑長是「實際走過的軌跡長度」。甲乙兩人起點終點相同，故位移大小相等。乙走的是之字形路線，路徑長顯然大於甲的直線路徑。故選(B)。", quote: "🚶‍♂️ 雖然路徑不同，但只要目標一致（位移），終點就在前方！ 🚶‍♂️" },
            "113-2": { subject: "【理化】", source: "第五冊 有機化合物", concept: "發酵作用", answer: "B", explanation: "題目要判斷是否為「醇類」。醇類的特性是含有「羥基(-OH)」原子團。選項(B)檢驗分子中是否含有羥基，這是辨別醇類最直接的方法。其他選項如可否燃燒、酸鹼性等，並非醇類的獨有特徵。", quote: "🍞 就像酵母菌發酵一樣，慢慢醞釀，你的實力會越來越蓬鬆壯大！ 🍞" },
            "113-3": { subject: "【地科】", source: "第五冊 天氣變化", concept: "天氣預報", answer: "C", explanation: "判讀一週天氣預報圖：(A) 11/10到11/11，北部氣溫下降，中南部氣溫也呈現下降趨勢。(B) 圖中僅有氣溫與天氣圖示，無降雨機率或雨量數據。(C) 正確，11/13~11/14全台各地氣溫皆有回升趨勢。(D) 11/11與11/12的日夜溫差（高低溫差）相似，無明顯變化。", quote: "🌤️ 看懂天氣圖，就像看懂人生風向，讓你隨時做好準備！ 🌤️" },
            "113-4": { subject: "【理化】", source: "第四冊 元素與化合物", concept: "元素週期表", answer: "C", explanation: "元素週期表提供的信息包括：原子序（質子數）、元素符號、原子量、週期與族（化學性質相似性）。週期表「無法」呈現該元素在自然界中的含量多寡或豐度。故選(C)。", quote: "🧪 週期表有規律，學習有方法，找到你的節奏吧！ 🧪" },
            "113-5": { subject: "【生物】", source: "第一冊 協調作用", concept: "內分泌系統", answer: "A", explanation: "骨質疏鬆與血液中的鈣濃度恆定有關。調節血鈣濃度的激素是「副甲狀腺素」，由副甲狀腺分泌。內分泌系統的激素是透過「血液循環」輸送到全身作用的。故選(A)。", quote: "🦴 打好基礎就像補充鈣質，讓你的知識骨架強健無比！ 🦴" },
            "113-6": { subject: "【理化】", source: "第六冊 電與生活", concept: "短路", answer: "C", explanation: "電線外皮破損導致裸露的金屬線直接接觸，會造成電流不經負載（電器）直接流過，電阻極小，電流極大，產生高熱，這就是「短路」現象，極易引發火災。故選(C)。", quote: "⚡ 避免短路，保持專注，讓你的能量有效輸出！ ⚡" },
            "113-7": { subject: "【理化】", source: "第四冊 化學反應", concept: "放熱反應", answer: "A", explanation: "生石灰（氧化鈣）加水會產生熟石灰（氫氧化鈣），這個反應是強烈的「放熱反應」。林則徐利用此反應產生的高溫熱量來煮沸海水，進而銷毀鴉片。故選(A)。", quote: "🔥 熱情就像放熱反應，能融化所有困難與挑戰！ 🔥" },
            "113-8": { subject: "【地科】", source: "第五冊 晝夜與四季", concept: "地球自轉", answer: "C", explanation: "判斷時區與自轉：(1) 美國正午，法國夕陽西下（下午），表示法國時間比美國快（法國在美國東邊）。(2) 太陽直射點應在正午的美國經線上。(3) 從北極上空俯視，地球是「逆時針」自轉。綜合判斷，選(C)圖最符合。", quote: "🌍 地球不停轉動，你的努力也不曾停歇，世界會看見你的光芒！ 🌍" },
            "113-9": { subject: "【生物】", source: "第一冊 細胞", concept: "滲透作用", answer: "A", explanation: "醃漬時使用高濃度的鹽水。由於鹽水濃度大於細胞內濃度，細胞內的水分會透過滲透作用向外流出，導致細胞失水萎縮，細胞膜會與細胞壁分離（原生質離）。故選(A)。", quote: "💧 懂得適時釋放壓力(水分)，才能保持最佳狀態！ 💧" },
            "113-10": { subject: "【地科】", source: "第五冊 板塊運動", concept: "中洋脊", answer: "D", explanation: "中洋脊是板塊張裂、岩漿湧出形成新海洋地殼的地方。因此，距離中洋脊越近的地殼，形成年代越新（越年輕）；距離越遠，年代越老。故選(D)。", quote: "🌋 保持一顆年輕的心，像新生海洋地殼一樣充滿活力！ 🌋" },
            "113-11": { subject: "【理化】", source: "第四冊 平衡", concept: "動態平衡", answer: "B", explanation: "化學反應達到「平衡」狀態時，並非反應停止，而是「正反應速率等於逆反應速率」，且反應物與生成物的濃度維持定值不再改變。這是一種「動態平衡」。故選(B)。", quote: "⚖️ 達到平衡不是停止，而是正向與逆向的努力一樣強大！ ⚖️" },
            "113-12": { subject: "【生物】", source: "第二冊 遺傳", concept: "顯隱性", answer: "D", explanation: "長翅(A)對短翅(a)為顯性。親代基因型皆為雜合子 Aa。棋盤方格法分析：Aa x Aa → 子代基因型可能為 AA, Aa, Aa, aa。表現型比例為 長翅(AA, Aa) : 短翅(aa) = 3 : 1。故選(D)。", quote: "🧬 你的努力是顯性基因，一定會表現出來讓大家看到！ 🧬" },
            "113-13": { subject: "【理化】", source: "第六冊 電磁感應", concept: "感應電流", answer: "D", explanation: "法拉第電磁感應定律：感應電流大小與磁場變化速率有關。(1) 兩次實驗中磁鐵移動速率、線圈圈數皆相同，故感應電流「大小相同」。(2) 第一次N極接近，第二次S極接近（磁場方向相反），故感應電流「方向相反」。故選(D)。", quote: "🧲 改變帶來電流！只要願意改變，你就能創造強大的能量！ 🧲" },
            "113-14": { subject: "【生物】", source: "第二冊 族群", concept: "族群大小", answer: "B", explanation: "族群個體數無明顯變化，表示「增加的數量 ≒ 減少的數量」。增加來自「出生 + 遷入」，減少來自「死亡 + 遷出」。因此只能推論 (出生+遷入) 約等於 (死亡+遷出)，無法單獨得知出生率或死亡率的高低。故選(B)。", quote: "📊 維持平衡需要智慧，你在學習上也能找到最佳的平衡點！ 📊" },
            "113-15": { subject: "【地科】", source: "第五冊 天氣", concept: "等壓線", answer: "D", explanation: "僅知 P 點氣壓為 1004 百帕，無法判斷其周圍氣壓是更高還是更低，因此無法確定 P 是高壓還是低壓中心。若能「多畫一條等壓線」（例如 1008 或 1000），就能判斷氣壓梯度方向，進而推知氣流方向（風向）。故選(D)。", quote: "🌬️ 只要多一條線索(知識)，你就能看清局勢，掌握方向！ 🌬️" },
            "113-16": { subject: "【理化】", source: "第四冊 壓力", concept: "壓力單位", answer: "B", explanation: "壓力的定義是「單位面積所受的正向力」，公式 P = F / A。題目中，「磅力」是力的單位，「平方英寸」是面積的單位。因此「磅力 / 平方英寸」即為壓力的單位（psi）。故選(B)。", quote: "💪 壓力就是力量除以面積，把壓力分散成前進的動力吧！ 💪" },
            "113-17": { subject: "【理化】", source: "第四冊 酸鹼", concept: "腐蝕性", answer: "B", explanation: "鹽酸是強酸，具有腐蝕性。濃度越高（pH值越低），腐蝕性越強。實驗結果顯示乙溶液造成的牙齒重量減少百分比最大（腐蝕最嚴重），代表乙溶液的酸性最強，pH 值最小。故選(B)。", quote: "🦷 知識需要細細咀嚼，才能完全消化吸收！ 🦷" },
            "113-18": { subject: "【理化】", source: "第三冊 波", concept: "非力學波", answer: "C", explanation: "波分為力學波（需介質）與非力學波（不需介質）。(1) 水波、繩波、超聲波都需要介質（水、繩子、空氣），屬於力學波。(2) 光波、無線電波屬於電磁波，不需要介質也能傳播，屬於非力學波。故選(C)。", quote: "🌊 不需介質也能傳遞能量，你的影響力就像電磁波一樣無遠弗屆！ 🌊" },
            "113-19": { subject: "【理化】", source: "第五冊 有機", concept: "有機物判斷", answer: "B", explanation: "有機化合物必定含碳，但含碳的不一定是有機（如 CO, CO₂, 碳酸鹽, 氰化物等）。(1) 乙含有 C 和 O，不含 H，可能是 CO₂ 或 CO，通常歸類為無機物。(2) 丙只含 C，是「元素」碳，有機化合物必須是「化合物」。因此乙和丙最不可能是有機化合物。", quote: "💎 分辨本質，去蕪存菁，你擁有看透事物核心的能力！ 💎" },
            "113-20": { subject: "【生物】", source: "第二冊 動物", concept: "刺絲胞動物", answer: "B", explanation: "科學論點的可信度來自於證據。若要驗證「所有刺絲胞動物都生活在海洋中」這句話是否正確，最直接的反證就是在「淡水」環境中尋找。如果在淡水中發現了刺絲胞動物（如水螅），則該論點就被推翻。故選(B)。", quote: "🐙 逆向思考，突破盲點，你的思維就像觸手一樣靈活！ 🐙" },
            "113-21": { subject: "【生物】", source: "第一冊 科學方法", concept: "實驗數據", answer: "A", explanation: "比較發芽率：(1) 甲：10/50 = 1/5。(2) 乙：10/50 = 1/5。(3) 丙：10/40 = 1/4。(4) 1/4 > 1/5。所以丙品牌的發芽比例最高，甲乙相等。故選(A)。", quote: "🌱 即使條件不同，只要努力灌溉，夢想終會發芽！ 🌱" },
            "113-22": { subject: "【生物】", source: "第二冊 運輸", concept: "環狀剝皮", answer: "C", explanation: "樹幹的維管束排列：木質部在內（運送水分），韌皮部在外（運送養分）。環狀剝皮移除了樹皮（含韌皮部），中斷了養分向根部的運輸，導致根部死亡。這證實了外圈（韌皮部）的功能是運輸養分。故選(C)。", quote: "🌳 只要核心(木質部)穩固，水分依然能向上輸送，滋養生命！ 🌳" },
            "113-23": { subject: "【理化】", source: "第四冊 氧化還原", concept: "氧化還原", answer: "A", explanation: "在該反應中，氬氣(Ar)與金屬氧化物反應。若能反應，代表氬搶走了氧，氬發生了「氧化」反應；金屬氧化物失去了氧，發生了「還原」反應。故選(A)。(註：實際上鈍氣極難反應，此題應為假想情境或特殊條件)", quote: "🔥 還原真相，氧化困難，你是最棒的化學家！ 🔥" },
            "113-24": { subject: "【地科】", source: "第五冊 日地月", concept: "日食", answer: "C", explanation: "題目描述：白天時太陽突然被遮蔽一段時間，這是「日食」現象。日食發生在農曆初一（朔），月球運行至地球與太陽之間，遮擋了太陽光。故選(C)。", quote: "🌑 即使短暫被遮蔽，太陽的光芒依然存在，你的實力也是！ 🌑" },
            "113-25": { subject: "【地科】", source: "第五冊 岩石", concept: "岩石分類", answer: "D", explanation: "岩石分類：(1) 甲由岩漿冷卻形成，為「火成岩」。(2) 乙由甲的碎屑物質經搬運、堆積、膠結而成，為「沉積岩」。故選(D)。", quote: "🪨 經過時間的沉澱與壓實，你的知識將變得堅不可摧！ 🪨" },
            "113-26": { subject: "【理化】", source: "第四冊 靜電", concept: "感應起電", answer: "A", explanation: "題目以感應起電的方式將球帶正電，但隨後又將其接地，在接地的過程中會有電荷的移動，其中負電荷(電子)才會移動，故方向應是從手流向金屬球。", quote: "⚡ 負電荷移動帶來正能量！只要方向正確，結果就會美好！ ⚡" },
            "113-27": { subject: "【理化】", source: "第三冊 熱", concept: "加熱曲線", answer: "A", explanation: "冰塊加熱融化成水的過程：(1) 溫度上升至 0℃。(2) 在 0℃ 進行相變（熔化），持續吸熱但溫度不變，此時為「固液共存」狀態。(3) 完全熔化後溫度繼續上升。題目圖中水平段即為熔化過程。故選(A)。", quote: "❄️ 融化是為了成為更自由的水，適應各種形狀的挑戰！ ❄️" },
            "113-28": { subject: "【地科】", source: "第五冊 氣團", concept: "氣團性質", answer: "B", explanation: "氣壓系統判斷：(1) 颱風中心氣壓最低，屬於「低氣壓」，應歸類在甲。(2) 太平洋暖氣團與蒙古大陸冷氣團，都是廣大且性質均一的空氣塊，中心氣壓較周圍高，屬於「高氣壓」，應歸類在乙。故將太平洋暖氣團移至乙類。選(B)。", quote: "🌀 掌握氣壓流動，你就是自己人生的氣象預報員！ 🌀" },
            "113-29": { subject: "【理化】", source: "第一冊 科學方法", concept: "實驗變因", answer: "D", explanation: "要證明「加熱」能否降低餘氯，必須比較「有加熱」與「沒加熱」的數據。(1) 表(七)是未加熱（常溫）的對照組。(2) 表(八)是加熱煮沸後的實驗組。對比兩表數據，若表(八)餘氯量低於表(七)，即可證實論點。故選(D)。", quote: "📊 數據是通往真相的鑰匙，你已經握在手中了！ 📊" },
            "113-30": { subject: "【生物】", source: "第二冊 遺傳", concept: "減數分裂", answer: "A", explanation: "減數分裂產生配子（卵子或精子）的過程：(1) 染色體複製一次，分裂兩次。(2) 同源染色體分離，染色體數目減半。(3) 體細胞 26 條 (13 對)，配子則為 13 條。(4) 染色體不成對，其中包含 1 條性染色體。故選(A)。", quote: "🧬 減半是為了更完美的結合，你的付出也會得到完整的回報！ 🧬" },
            "113-31": { subject: "【地科】", source: "第五冊 晝夜四季", concept: "竿影", answer: "D", explanation: "太陽軌跡與竿影：(1) 冬至（12/22）太陽直射南回歸線，北半球正午太陽仰角最小（位置最偏南），竿影最長。(2) 陽光會照射進教室最深處（第1~3排）。(3) 隨著時間過冬至，直射點北移，仰角變大，竿影變短。題目敘述符合冬至前後的現象。故選(D)。", quote: "☀️ 光影流轉間，你捕捉到了時間的腳步，太敏銳了！ ☀️" },
            "113-32": { subject: "【理化】", source: "第三冊 物質", concept: "濃度", answer: "D", explanation: "逆向思考計算：(1) 已知池水總體積與池水中安賽蜜的濃度，可算出池水中安賽蜜的「總質量」。(2) 假設這些安賽蜜全來自尿液，利用「總質量 / 尿液中安賽蜜的平均濃度」，即可回推估算出的「尿液總體積」。故選(D)。", quote: "🧪 見微知著，從細節推導全貌，你的邏輯無懈可擊！ 🧪" },
            "113-33": { subject: "【生物】", source: "第一冊 恆定", concept: "泌尿系統", answer: "D", explanation: "泌尿系統構造：(1) 腎臟（丙）：過濾血液，形成尿液。(2) 輸尿管（丁）：將尿液從腎臟輸送至膀胱。(3) 膀胱（甲）：儲存尿液。(4) 尿道：排出尿液。注意：尿素是在肝臟形成，由血液運至腎臟排出。故(D)描述正確。", quote: "🩸 搞懂身體的物流系統，你的知識脈絡暢通無阻！ 🩸" },
            "113-34": { subject: "【理化】", source: "第三冊 浮力", concept: "浮沉", answer: "B", explanation: "浮沉條件：密度小於液體者浮，大於液體者沉。(1) 水密度=1。(2) 甲(0.5)浮，沒入一半體積=20。(3) 乙(1.0)懸浮/沒入，體積=30。(4) 丙(2.0)沉，體積=20。(5) 丁(3.0)沉，體積=10。比較液面下體積：乙(30)最大。故選(B)。", quote: "⚓ 浮浮沉沉是常態，掌握原理就能穩住重心！ ⚓" },
            "113-35": { subject: "【地科】", source: "第五冊 板塊", concept: "地震規模", answer: "C", explanation: "地震規模（Magnitude）代表地震釋放的能量大小，一次地震只有一個規模數值，不會隨地點改變。震度（Intensity）則是各地感受到的搖晃程度，隨距離震央遠近而異。題目表中顯示不同測站有不同震度，但對應的地震規模應為固定值且能造成此震度者。故選(C)。", quote: "📉 震不倒你的決心，規模再大的難題也能迎刃而解！ 📉" },
            "113-36": { subject: "【理化】", source: "第三冊 光", concept: "透鏡", answer: "B", explanation: "凸透鏡成像法則：從焦點發出的光線，經過凸透鏡折射後，會平行於主軸射出。題目給定光源在焦點(10cm)上，故折射光線應為平行光。故選(B)。", quote: "🔍 聚焦目標，你的未來就像平行光匯聚一樣清晰！ 🔍" },
            "113-37": { subject: "【理化】", source: "第四冊 計量", concept: "化學反應", answer: "C", explanation: "反應式：M + 2HCl → MCl₂ + H₂。題目說產生氫氣質量相同，代表消耗的 HCl 莫耳數相同，消耗的金屬莫耳數也相同。生成的鹽類 MCl₂ 質量 = 金屬消耗質量 + 氯離子質量。因為甲原子量(24.3) < 乙原子量(65.4)，同莫耳數下，甲金屬質量小，故生成的甲鹽類總質量較小。選(C)。", quote: "⚖️ 質量守恆，你的努力也會一點一滴累積成大智慧！ ⚖️" },
            "113-38": { subject: "【理化】", source: "第五冊 功與能", concept: "動能", answer: "D", explanation: "動能變化量 = 外力作功 = F × S。題目中，施力 F 與位移 S 皆不變，因此作功大小不變，物體獲得的動能就不變（不會加倍）。改變物體質量只會影響加速度和末速度，但最終動能 E_k = W = F × S 依然相同。故選(D)。", quote: "🔋 能量不會憑空產生，但你的潛力可以無限激發！ 🔋" },
            "113-39": { subject: "【生物】", source: "第二冊 分類", concept: "學名", answer: "C", explanation: "二名法：學名 = 屬名(名詞) + 種小名(形容詞)。想要找「同屬」的植物，必須找學名「第一個字」相同的。金毛杜鵑 *Rhododendron oldhamii* 的屬名是 *Rhododendron*。故搜尋關鍵字應為 *Rhododendron*。", quote: "🌿 名字是獨特的標記，你也是這世上獨一無二的存在！ 🌿" },
            "113-40": { subject: "【理化】", source: "第四冊 電化學", concept: "電鍍", answer: "B", explanation: "電鍍銅實驗設置：(1) 被鍍物（鐵片）接負極（吸引正離子）。(2) 欲鍍金屬（銅片）接正極（補充金屬離子）。(3) 電鍍液需含欲鍍金屬離子（硫酸銅）。符合此配置的是選項(B)。", quote: "⚡ 正負極接對了，你的人生也能鍍上一層金！ ⚡" },
            "113-41": { subject: "【生物】", source: "第一冊 消化", concept: "酵素活性", answer: "D", explanation: "酵素的活性受溫度影響。高溫會破壞酵素的蛋白質結構，使其永久失去活性。圖表中 10:30 後產物不再增加，對應溫度已達 85℃，顯示酵素 X 已因高溫變性而失去功能。故選(D)。", quote: "🔥 把握黃金時機，像酵素一樣發揮最大效能！ 🔥" },
            "113-42": { subject: "【生物】", source: "第二冊 保育", concept: "生態威脅", answer: "C", explanation: "文章提到食蛇龜被「大量走私」出口，是為了滿足市場需求（食用、藥用、寵物）。這屬於人為的「過度捕捉」與利用，而非外來種入侵或棲地破壞。故選(C)。", quote: "🐢 守護環境就是守護未來，你的愛心讓世界更美好！ 🐢" },
            "113-43": { subject: "【生物】", source: "第二冊 保育", concept: "保育等級", answer: "D", explanation: "根據 IUCN 紅色名錄的定義，物種受威脅程度由輕到重為：無危 -> 近危 -> 易危 -> 瀕危 -> 極危。食蛇龜屬於「瀕危(EN)」，這等級位於「易危」與「極危」之間，屬於受威脅物種。故選(D)。", quote: "🌏 每一個生命都珍貴，你的知識能為它們發聲！ 🌏" },
            "113-44": { subject: "【理化】", source: "第六冊 能源", concept: "能源政策", answer: "A", explanation: "觀察表格數據趨勢：(1) 核能：2025年後歸零（廢核）。(2) 燃煤：佔比逐年下降（減煤）。(3) 燃氣：佔比上升至50%（增氣）。(4) 再生能源：大幅增加。選項(A)「廢除核能，增加再生能源，燃煤改燃氣」完全符合此趨勢。", quote: "💡 展望未來，你的眼光比發電廠還要長遠！ 💡" },
            "113-45": { subject: "【理化】", source: "第六冊 環境", concept: "空汙", answer: "B", explanation: "比較燃煤與燃氣的空氣污染物排放量（TSP懸浮微粒、SOx硫氧化物、NOx氮氧化物），燃氣的排放數值皆遠低於燃煤。因此，將燃煤機組改為燃氣機組，確實有助於減少空氣污染物的排放。故選(B)。", quote: "🌬️ 選擇對的能源，讓你的思緒像乾淨空氣一樣清新！ 🌬️" },
            "113-46": { subject: "【理化】", source: "第一冊 科學記號", concept: "數值", answer: "D", explanation: "數值換算：52729 億度。(1) 「億」= 10⁸。(2) 52729 = 5.2729 × 10⁴。(3) 合併：5.2729 × 10⁴ × 10⁸ = 5.2729 × 10¹² 度。故選(D)。", quote: "🔢 天文數字也難不倒你，你的計算能力突破天際！ 🔢" },
            "113-47": { subject: "【理化】", source: "圖表判讀", concept: "趨勢分析", answer: "A", explanation: "對比兩張折線圖：(1) 住宅用電量在 2017-2018 年下降，2018-2020 年上升。(2) 氣溫大於 28℃ 的時數（冷氣需求）趨勢也呈現 2017-2018 下降，2018-2020 上升。兩者波動趨勢高度一致，顯示住宅用電變化主要受冷氣使用時數影響。故選(A)。", quote: "📈 看穿數據背後的趨勢，你就是未來的分析大師！ 📈" },
            "113-48": { subject: "【理化】", source: "生活應用", concept: "操作型定義", answer: "C", explanation: "為什麼設定 28℃？這是一個「操作型定義」。根據統計或生活經驗，當氣溫超過 28℃ 時，民眾普遍會覺得熱而開啟冷氣。因此用 28℃ 作為預測冷氣用電量的門檻指標。故選(C)。", quote: "❄️ 舒適與節能兼顧，你的智慧讓生活更有品質！ ❄️" },
            "113-49": { subject: "【地科】", source: "第六冊 氣候", concept: "CO2濃度", answer: "C", explanation: "觀察 CO₂ 濃度變化圖，呈現鋸齒狀波動上升。每一個波峰波谷代表一年的季節變化（植物光合作用季節性強弱）。圖中大約包含了 5 個完整的波形循環，因此代表時間長度約為 5 年。故選(C)。", quote: "🌳 呼吸之間都有學問，你掌握了地球的脈動！ 🌳" },
            "113-50": { subject: "【地科】", source: "第六冊 大氣", concept: "氣體比例", answer: "C", explanation: "為什麼 CO₂ 變化明顯而 O₂不明顯？(1) 大氣中 O₂ 佔 21%（基數大），些微增減對百分比影響極小。(2) CO₂ 僅佔 0.04%（基數小），同樣的增減量，對其百分比的變動幅度影響就很大，因此容易被觀察到季節性震盪。故選(C)。", quote: "🔎 在大數據中找到關鍵差異，你的洞察力太敏銳了！ 🔎" },

            // --- 112年 ---
            "112-1": { subject: "【生物】", source: "第五冊 生態系", concept: "食物網與穩定性", answer: "D", explanation: "生物多樣性越高，生態系越穩定。單一物種的樹林（生產者單一），能支持的初級消費者種類就少，進而影響高級消費者。食物網變得簡單，生態系的自我調節能力變差，穩定性降低。故選(D)。", quote: "🌱 多樣性創造穩定，你的每一個興趣都是支撐未來的力量！ 🌱" },
            "112-2": { subject: "【地科】", source: "第五冊 變動的地球", concept: "地質構造", answer: "B", explanation: "圖中岩層呈現波浪狀彎曲，但未發生斷裂位移，這種構造稱為「褶皺」。(A)斷層需有破裂面及位移；(C)傾向坡是指坡面與岩層傾斜方向一致。故選(B)。", quote: "⛰️ 壓力讓你彎曲卻不折斷，這就是褶皺的韌性之美！ ⛰️" },
            "112-3": { subject: "【理化】", source: "第四冊 電解質", concept: "離子", answer: "D", explanation: "運動飲料含有電解質，溶於水會解離出離子（如 Na⁺, K⁺），這些移動的離子能幫助導電。葡萄糖水、糖水等非電解質溶液則不易導電。故選(D)。", quote: "⚡ 充滿能量的你，就像電解質一樣，到哪裡都能發光發熱！ ⚡" },
            "112-4": { subject: "【生物】", source: "第二冊 分類", concept: "真菌", answer: "C", explanation: "毛黴菌屬於「真菌界」。特徵包括：(1) 具有細胞壁。(2) 沒有葉綠體，不能行光合作用。(3) 多細胞，具菌絲。(4) 具細胞核（真核生物）。(5) 以孢子繁殖。選項(C)完全符合。", quote: "🍄 看似微小卻生命力強韌，你潛藏的爆發力不容小覷！ 🍄" },
            "112-5": { subject: "【地科】", source: "第五冊 浩瀚的宇宙", concept: "潮汐", answer: "A", explanation: "潮差 = 滿潮水位 - 乾潮水位。(1) 8/11：2.5 - (-2.5) = 5.0 公尺。(2) 8/14：1.5 - (-1.5) = 3.0 公尺。(3) 兩者差距：5.0 - 3.0 = 2.0 公尺。故選(A)。", quote: "🌊 潮起潮落皆有時，掌握規律，你就能乘風破浪！ 🌊" },
            "112-6": { subject: "【理化】", source: "第三冊 熱", concept: "溫度測量", answer: "A", explanation: "使用溫度計正確方法：(1) 液囊需完全浸入液體中。(2) 不可觸碰容器底或壁，以免受容器溫度直接影響。(3) 視線需與液面平行讀數。圖(A)懸空於中央，位置正確。", quote: "🌡️ 保持適當距離，才能客觀測量，這就是科學的態度！ 🌡️" },
            "112-7": { subject: "【理化】", source: "第六冊 能源", concept: "氫能", answer: "B", explanation: "氫氣分類：(1) 灰氫：化石燃料製成，碳排高。(2) 藍氫：化石燃料製成但搭配碳捕捉。(3) 綠氫：利用再生能源（如風力、太陽能）電解水製成，過程幾無碳排。題目描述利用風力發電電解水，屬於「綠氫」。故選(B)。", quote: "💚 選擇綠色能源，就像選擇正向思考，讓未來更純淨美好！ 💚" },
            "112-8": { subject: "【生物】", source: "第一冊 協調", concept: "血糖", answer: "C", explanation: "胰島素的功能是「降低血糖」。當血糖濃度過高時，胰島素分泌增加，促進細胞利用葡萄糖或將其轉為肝糖儲存。選項(C)描述胰島素可使血糖下降，符合生理機制。", quote: "🍬 平衡是門藝術，就像胰島素調節血糖，不多不少剛剛好！ 🍬" },
            "112-9": { subject: "【理化】", source: "第三冊 光", concept: "反射", answer: "C", explanation: "我們能看見本身不發光的物體（如演員），是因為光源發出的光線照射到物體上，經由物體表面「反射」，進入我們的眼睛。故選(C)。", quote: "🔦 你不需要自帶光芒，只要懂得反射周圍的美好，依然耀眼！ 🔦" },
            "112-10": { subject: "【地科】", source: "第五冊 變動的地球", concept: "地質事件", answer: "B", explanation: "地質事件順序判斷：(1) 先有岩層沉積。(2) 岩漿侵入岩層冷卻形成火成岩脈（截切定律）。(3) 地表受侵蝕，因火成岩抗侵蝕力較強而凸出。故順序為：沉積 → 侵入 → 侵蝕。選(B)。", quote: "🪨 經歷千錘百鍊還能屹立不搖，你的意志比火成岩還堅定！ 🪨" },
            "112-11": { subject: "【理化】", source: "第四冊 有機", concept: "皂化", answer: "D", explanation: "皂化反應實驗：油脂 + 氫氧化鈉 → 肥皂 + 甘油。反應後加入飽和食鹽水進行「鹽析」。由於肥皂不溶於飽和食鹽水且密度較小，會浮在上層；甘油溶於水則在下層。此步驟是為了分離肥皂。故選(D)。", quote: "🧼 混亂中也能分離出精華，你的思緒就像鹽析一樣清晰！ 🧼" },
            "112-12": { subject: "【理化】", source: "第三冊 物質", concept: "原子說", answer: "A", explanation: "道耳頓原子說認為「原子不可再分割」。但後來湯姆森發現了「電子」，拉塞福發現了「原子核」，證實原子內部有更小的粒子。因此道耳頓的該項假說需要修正。故選(A)。", quote: "⚛️ 勇於修正錯誤，就像科學進步一樣，讓你越來越接近真理！ ⚛️" },
            "112-13": { subject: "【理化】", source: "第三冊 波", concept: "聲音", answer: "A", explanation: "聲音三要素：(1) 響度（分貝）：聲音的大小。(2) 頻率（赫茲）：聲音的高低。題目中「音量太大」指響度過大；「音調太高」指頻率過高。故選(A)。", quote: "🔊 聽見細微的訊號，過濾雜訊，你的專注力是成功的關鍵！ 🔊" },
            "112-14": { subject: "【生物】", source: "第五冊 生態系", concept: "生物放大", answer: "B", explanation: "生物放大作用（生物累積）：有毒物質（如DDT）無法被代謝排出，會隨著食物鏈傳遞而濃度逐級增加。因此高級消費者的體內濃度最高，生產者最低。濃度排序：丙 > 甲 > 乙 > 丁。食物鏈流向：丁 → 乙 → 甲 → 丙。故選(B)。", quote: "🔗 知識也會像生物累積一樣，一點一滴在腦海中壯大！ 🔗" },
            "112-15": { subject: "【地科】", source: "第五冊 宇宙", concept: "洋流", answer: "B", explanation: "台灣東部海域有「黑潮」主流經過，流向是由南向北。若船隻要從台灣前往日本（往北），利用黑潮順流而行可以節省燃料與時間。故選(B)。", quote: "⛵ 順風順水！掌握趨勢（洋流），你的目標將更快抵達！ ⛵" },
            "112-16": { subject: "【生物】", source: "第二冊 運輸", concept: "光合作用", answer: "A", explanation: "光合作用反應式：水 + 二氧化碳 → 氧氣 + 葡萄糖（養分）。(1) 甲是水，由根部吸收，經「木質部」運輸。(2) 乙是葡萄糖，由「韌皮部」運輸至植物各處。故選(A)。", quote: "🌿 吸收養分，向上輸送，你正在像大樹一樣茁壯成長！ 🌿" },
            "112-17": { subject: "【理化】", source: "第四冊 有機", concept: "有機定義", answer: "A", explanation: "有機化合物定義：含碳的化合物。但有少數例外（如 CO, CO₂, 碳酸鹽類等）被歸類為無機。因此正確說法是：有機化合物必含碳，含碳的不一定是有機。故小玉的說法最準確。", quote: "🧪 定義清楚，邏輯分明，你的思緒比化學式還要精準！ 🧪" },
            "112-18": { subject: "【理化】", source: "第五冊 運動", concept: "平均速率", answer: "A", explanation: "平均速率 = 路徑長 / 時間。題目中所有選手都跑完 400 公尺，路徑長相同。因此，所花費的「時間」越短，平均速率就越大。第一名花的時間最少，故速率最大。選(A)。", quote: "🏃‍♂️ 速度不是唯一，堅持跑完全程（路徑長），你就是贏家！ 🏃‍♂️" },
            "112-19": { subject: "【理化】", source: "第五冊 功與能", concept: "力學能守恆", answer: "C", explanation: "忽略阻力，力學能守恆。小球從 1.0m 高處落下，位能轉動能；反彈時動能轉回位能。若無能量損耗，反彈高度應等於落下高度，即 1.0m。故選(C)。", quote: "🔄 能量守恆，你付出的努力最終都會回到自己身上，變成實力！ 🔄" },
            "112-20": { subject: "【生物】", source: "第二冊 分類", concept: "分類階層", answer: "B", explanation: "學名 = 屬名 + 種小名。Lil-2 (*Lilium formosanum*) 與 Lil-3 (*Lilium longiflorum*) 的屬名都是 *Lilium*，代表它們是「同屬」生物。分類學上，同屬必同科（界門綱目科屬種）。故選(B)。", quote: "🗂️ 找到歸屬，釐清關係，你的知識架構井然有序！ 🗂️" },
            "112-21": { subject: "【地科】", source: "第五冊 宇宙", concept: "行星", answer: "D", explanation: "太陽系行星分類：(1) 類地行星（水金地火）：靠近太陽，體積小，密度大。(2) 類木行星（木土天海）：遠離太陽，體積大，密度小。圖中 X 軸數值大者（類地）距離太陽近，數值小者（類木）距離遠。密度符合此趨勢（類地密度大）。故 X 軸應為密度。選(D)。", quote: "🪐 雖然體積小但密度大（實力強），你就是最耀眼的類地行星！ 🪐" },
            "112-22": { subject: "【生物】", source: "第二冊 免疫", concept: "潛伏期", answer: "A", explanation: "潛伏期定義：感染後到發病前的時間。已知潛伏期 1~3 天。發病（發燒）是第 4 天。回推：(1) 若潛伏1天，第3天感染。(2) 若潛伏3天，第1天感染。故感染時間落在第 1~3 天。選(A)。", quote: "🛡️ 潛伏是為了更好的爆發，現在的沉澱是為了未來的展翅！ 🛡️" },
            "112-23": { subject: "【理化】", source: "第五冊 運動", concept: "F=ma", answer: "C", explanation: "牛頓第二定律 F = ma。(1) 甲：20秒加速到30，a = 1.5。F甲 = m × 1.5。(2) 乙：30秒加速到20，a = 0.67。F乙 = m × 0.67。(3) F甲 > F乙。甲受力時間 0~20s (20秒)，乙受力 10~40s (30秒)。故選(C)。", quote: "💪 力量與時間的累積，造就了你無可限量的加速度！ 💪" },
            "112-24": { subject: "【理化】", source: "第一冊 物質進出", concept: "擴散", answer: "D", explanation: "半透膜特性：小分子（葡萄糖）可通過，大分子（澱粉）不可通過。(1) 管內葡萄糖會擴散出來到燒杯 -> 燒杯測得到糖。(2) 燒杯澱粉進不去管內 -> 管內測不到澱粉。故燒杯內液體：含澱粉且含葡萄糖。檢測結果：碘液變色（有澱粉），本氏液變色（有糖）。選(D)。", quote: "🔍 滲透與擴散，讓知識的養分自由穿梭，滋養你的大腦！ 🔍" },
            "112-25": { subject: "【生物】", source: "第一冊 能量", concept: "呼吸作用", answer: "D", explanation: "蘋果細胞進行「呼吸作用」產生熱量。呼吸作用反應式：葡萄糖 + 氧氣 → 二氧化碳 + 水 + 能量。因此，密封箱內的氧氣會減少，二氧化碳會增加。故選(D)。", quote: "🍎 成熟需要時間與呼吸，你的努力正在醞釀最甜美的果實！ 🍎" },
            "112-26": { subject: "【理化】", source: "第四冊 氧化還原", concept: "氧化", answer: "A", explanation: "銀針變黑是因為銀與硫化物反應生成硫化銀（黑色）。在這個反應中，銀（Ag）失去電子變成銀離子（Ag⁺），發生了「氧化」反應。故選(A)。", quote: "✨ 真金不怕火煉，你的實力經得起任何考驗！ ✨" },
            "112-27": { subject: "【理化】", source: "第四冊 反應", concept: "計量", answer: "A", explanation: "利用原子不滅平衡係數推導分子式。(1) 甲 + 3O₂ → 2CO₂ + 3H₂O。生成物有 2C, 6H, 7O。扣除反應物 6O，甲為 C₂H₆O。(2) 乙 + 3O₂ → 2CO₂ + 2H₂O。生成物 2C, 4H, 6O。扣除反應物 6O，乙為 C₂H₄。甲(C₂H₆O)是乙醇，乙(C₂H₄)是乙烯。甲可能是醇類。選(A)。", quote: "⚖️ 平衡方程式就像平衡生活，找到最佳比例，一切順利！ ⚖️" },
            "112-28": { subject: "【地科】", source: "第六冊 天氣", concept: "氣壓", answer: "A", explanation: "代號 H 代表「高氣壓」中心。高氣壓中心氣流下沉，空氣下沉增溫，相對濕度降低，不易成雲致雨，因此天氣通常是晴朗穩定的。故選(A)。", quote: "☀️ 高壓帶來晴朗，保持高昂的鬥志，你的心情也會萬里無雲！ ☀️" },
            "112-29": { subject: "【地科】", source: "第六冊 天氣", concept: "氣壓高度", answer: "C", explanation: "大氣壓力隨高度增加而遞減。(1) 從住家(低)前往武嶺(高)：高度上升，氣壓下降。(2) 從武嶺返回住家：高度下降，氣壓上升。因此氣壓變化應為「先降後升」。且黑麻油會浮在水上，密度<1，275g 的體積應大於 275mL。故選(C)。", quote: "🏔️ 登高望遠，氣壓雖低但視野更廣，你的格局決定你的高度！ 🏔️" },
            "112-30": { subject: "【理化】", source: "第三冊 測量", concept: "密度", answer: "B", explanation: "黑麻油密度約 0.9 g/cm³，小於水。(1) 甲牌：240g / 260mL ≈ 0.92，合理。(2) 乙牌：275g / 275mL = 1.0，密度等於水，不合理（油應該比水輕）。故選(B)。", quote: "💧 密度決定浮沉，扎實的實力讓你永遠浮在頂端！ 💧" },
            "112-31": { subject: "【生物】", source: "第一冊 運輸", concept: "血管", answer: "C", explanation: "由血液流動方向可判斷左邊的是小動脈，橫向的是微血管，右邊的是小靜脈；而複式顯微鏡上下左右相反，當培養皿向左移動，則看到的影像會向右移動，此時先消失的為最靠影像右側的小靜脈，其次為微血管，最後為小動脈。", quote: "🩸 雖然微小，但微血管是交換養分的關鍵，細節成就完美！ 🩸" },
            "112-32": { subject: "【生物】", source: "第一冊 消化", concept: "口腔pH值", answer: "C", explanation: "口腔環境變化：(1) 用餐後，細菌分解食物殘渣產生酸，pH值下降（變酸）。(2) 嚼無糖口香糖刺激唾液分泌，唾液呈弱鹼性，可中和酸性，使 pH 值回升至中性附近。故圖形應為「先降後升」。選(C)。", quote: "👄 保持平衡是生活的藝術，就像身體調節酸鹼一樣自然！ 👄" },
            "112-33": { subject: "【理化】", source: "第四冊 力", concept: "摩擦力", answer: "C", explanation: "分析摩擦力：(1) 施力 200gw 不動 -> 靜摩擦力 = 200gw，且最大靜摩擦力 > 200gw。(2) 施力 300gw 物體移動 -> 動摩擦力 = 250gw。(3) 物理性質：最大靜摩擦力略大於動摩擦力。故最大靜摩擦力應介於 250gw 與 300gw 之間。選(C)。", quote: "💪 突破阻力需要一點衝勁，一旦動起來就勢不可擋！ 💪" },
            "112-34": { subject: "【理化】", source: "第五冊 功與能", concept: "電能", answer: "D", explanation: "電能公式 E = P × t。(1) 功率 P = 1200 W。(2) 時間 t = 1 分鐘 = 60 秒。(3) 消耗電能 E = 1200 × 60 = 72000 焦耳 (J)。故選(D)。", quote: "⚡ 能量等於功率乘以時間，你的努力乘上堅持，就是巨大的成果！ ⚡" },
            "112-35": { subject: "【生物】", source: "第二冊 生殖", concept: "植物生殖", answer: "C", explanation: "植物受精後，各部位發育：(1) 胚珠 → 發育為「種子」。(2) 子房 → 發育為「果實」。題目指食用部位由子房發育而來，故為果實。選(C)。", quote: "🍓 每一顆小小的果實，都蘊含著生命的傳承與希望！ 🍓" },
            "112-36": { subject: "【地科】", source: "第五冊 宇宙", concept: "太陽直射", answer: "A", explanation: "判斷直射緯度：(1) 夏至直射北回歸線。(2) 冬至直射南回歸線。(3) 春分秋分直射赤道。題目中某地一年有兩次直射（無竿影），且發生在 11月與 1月。這兩個月份太陽直射點位於南半球（赤道到南回歸線之間）。甲地位於南緯，符合此特徵。選(A)。", quote: "☀️ 追逐陽光的腳步，你也能找到屬於自己的閃耀時刻！ ☀️" },
            "112-37": { subject: "【理化】", source: "第六冊 電磁", concept: "受力方向", answer: "B", explanation: "右手開掌定則：四指指磁場方向（N->S，向北），大拇指指電流方向（向上），掌心推出方向為受力方向。結果受力向西。甲乙兩導線皆受向西的磁力。選(B)。", quote: "🧲 掌握定則，就能在無形的力量場中找到正確方向！ 🧲" },
            "112-38": { subject: "【生物】", source: "第二冊 遺傳", concept: "顯性遺傳", answer: "D", explanation: "軟骨發育不全症是顯性遺傳（由顯性基因A控制）。患者基因型可能為 AA 或 Aa。正常人為隱性 aa。題目說阿佑父母皆未患病，表示父母基因型皆為 aa。阿佑患病是因為自身基因突變。故父母基因型為 ff (aa)。選(D)。", quote: "🧬 生命充滿變數，但愛與包容是我們最強大的基因！ 🧬" },
            "112-39": { subject: "【地科】", source: "第五冊 宇宙", concept: "月相", answer: "D", explanation: "推算日期：(1) 23日日食 -> 農曆初一。(2) 9日月食 -> 農曆十五。(3) 回推：初一前一週為下弦月（23-7=16日），十五前一週為上弦月（9-7=2日）。(4) 30日約為上弦月。故 2日上弦、16日下弦、30日上弦。選(D)。", quote: "🌑 即使被遮擋，光芒依然存在，等待時機再次綻放！ 🌑" },
            "112-40": { subject: "【理化】", source: "第四冊 反應速率", concept: "反應條件", answer: "A", explanation: "(B)溫度升高才會加速反應。(C)與題意無關。(D)液態氨汽化後的氨氣難溶於水，和氯接觸機會不大。", quote: "🌡️ 冷靜分析環境因素，別讓情緒影響了你的反應速率！ 🌡️" },
            "112-41": { subject: "【理化】", source: "第三冊 物質", concept: "分離", answer: "A", explanation: "混合物分離：(1) 加水過濾：丙不溶於水，留在濾紙上 -> 丙分離。(2) 加熱濾液：乙沸點 238℃，水沸點 100℃，甲沸點 1413℃。加熱先蒸發水，再蒸發乙。殘留的是沸點最高的甲。故◆▲為甲或乙。選(A)。", quote: "⚗️ 分離是為了讓彼此更純粹，找到適合的方法，就能釐清混亂！ ⚗️" },
            "112-42": { subject: "【理化】", source: "第四冊 電路", concept: "並聯", answer: "D", explanation: "電路分析：(1) 圖(一)是串聯。乙斷，甲不亮。(2) 圖(二)是並聯。乙斷，甲仍形成迴路，故甲亮。(3) 導線斷裂分析：並聯電路中，支路斷裂互不影響，主路斷裂全斷。題目選(D)符合並聯特性。", quote: "💡 即使一條路斷了，只要有備案（並聯），光芒依然照耀！ 💡" },
            "112-43": { subject: "【生物/跨科】", source: "跨科", concept: "營養", answer: "A", explanation: "比較營養成分表：Y牌牛奶的蛋白質含量（每100mL含3.1g）高於X牌燕麥奶（1.0g）。蛋白質分解後產生胺基酸。且牛奶糖分較低。符合壯壯（想長肌肉）和安安（不想攝取太多糖）的需求。選(A)。", quote: "🥛 選擇適合自己的養分，為身體注入滿滿的活力！ 🥛" },
            "112-44": { subject: "【生物/跨科】", source: "跨科", concept: "碳排放", answer: "D", explanation: "比較碳排放長條圖：牛奶(最高) > 米漿 > 豆漿 > 燕麥奶 > 杏仁奶(最低)。題目問「產生相同碳排放量時，誰製造的飲品數量最多？」排放係數越低者，能製造越多。故順序相反：杏仁奶 > ... > 牛奶。選(D)。", quote: "🌍 愛護地球從選擇開始，每一個小決定都能帶來大改變！ 🌍" },
            "112-45": { subject: "【理化】", source: "第五冊 功與能", concept: "效率", answer: "C", explanation: "功率係數 Cp 定義：發電機功率 / 風力功率。Cp 值越大，代表將風能轉換為電能的效率越高，即獲取的功率越大。這與葉片轉速快慢無直接絕對關係，而是看轉換比例。故選(C)。", quote: "🌬️ 效率就是關鍵！找對方法（Cp值），就能事半功倍！ 🌬️" },
            "112-46": { subject: "【理化】", source: "圖表", concept: "風力", answer: "B", explanation: "查圖判讀：Cp 值最大出現在 v2/v1 約 0.3~0.4 之間。已知 v1 = 10 m/s，故最佳 v2 應為 3~4 m/s。選(B)。", quote: "📊 數據不會說謊，仔細觀察，最佳解就在圖表中！ 📊" },
            "112-47": { subject: "【理化/生物】", source: "第一冊 科學方法", concept: "變因", answer: "B", explanation: "解讀實驗數據：農藥殘留量：甲(1.5) > 丙 > 乙 > 丁 > 戊(0.6)。(1) 觀點①比較乙丙丁，認為小蘇打最好(丁殘留最少)，但觀點說鹽水最好(乙)，不符。(2) 觀點②認為戊(清水沖洗)殘留最少，效果優於所有浸泡法，符合數據。故選(B)。", quote: "🥗 清洗繁雜的思緒，就像洗菜一樣，用對方法最乾淨！ 🥗" },
            "112-48": { subject: "【理化/生物】", source: "第一冊 科學方法", concept: "對照組", answer: "B", explanation: "實驗設計邏輯：要測試「洗滌方法」對「去除農藥」的效果，首先小白菜上必須要有農藥。如果買來的小白菜本身沒農藥，洗了也測不出來。因此「前處理：浸泡農藥」是為了確保實驗組與對照組的樣本都含有定量的農藥，才能比較洗滌效果。選(B)。", quote: "🔬 實驗要有對照，生活要有參照，才能看出真正的價值！ 🔬" },
            "112-49": { subject: "【地科】", source: "第五冊 變動的地球", concept: "地震", answer: "A", explanation: "地震參數模擬的是「搖晃程度」，這對應於地震學中的「震度」（Intensity）。震度是用來描述地震時地面搖晃的強弱程度。選(A)。", quote: "📉 感受震動的強弱，學會評估風險，安全第一！ 📉" },
            "112-50": { subject: "【地科】", source: "第五冊 變動的地球", concept: "液化", answer: "C", explanation: "土壤液化發生的條件：(1) 疏鬆的砂質土壤。(2) 高地下水位。(3) 強烈的地震搖晃。圖中顯示，地下水位越高（越接近地表），液化潛勢越高。故選(C)。", quote: "💧 根基穩固很重要，別讓隱藏的危機（液化）動搖你的基礎！ 💧" },

            // --- 111年 (依據您上傳的圖檔文字詳解) ---
            "111-1": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "A", explanation: "氣壓的國際標準單位制是帕斯卡（或簡稱帕，符號是Pa），一般氣象學中人們使用百帕（hPa）作為氣壓單位。", quote: "✨ 好的開始是成功的一半，基礎觀念掌握得很棒喔！ ✨" },
            "111-2": { subject: "【理化】", source: "第五冊第3章", concept: "功與能", answer: "C", explanation: "物體由高處落下，重力位能減少，轉變為動能和熱能。", quote: "🚀 能量守恆定律就跟你的努力一樣，絕對不會白費的！ 🚀" },
            "111-3": { subject: "【理化】", source: "第三冊第2章、第四冊第2章", concept: "物質的世界 / 氧化還原反應", answer: "D", explanation: "氮氣在常溫時，活性小可避免畫作被氧化。", quote: "🛡️ 學習就像氮氣一樣穩定紮實，百毒不侵！ 🛡️" },
            "111-4": { subject: "【生物】", source: "第二冊第4章", concept: "生物與環境", answer: "C", explanation: "由題目中的珊瑚可得知人工魚礁位於海洋生態系，而藻類生存的環境必須有光才能進行光合作用，因此人工魚礁應放置於淺海區較適合。", quote: "🐠 找到適合自己的環境，你也能像珊瑚一樣綻放光彩！ 🐠" },
            "111-5": { subject: "【生物】", source: "第一冊第5章", concept: "生物體的協調作用", answer: "A", explanation: "植物向光性需較長的時間；而捕蠅草的捕蟲運動、酢漿草的睡眠運動和含羞草的觸發運動皆為迅速的局部感應，所需時間較短。", quote: "🌱 學習需要向光性般的耐心，慢慢成長最扎實！ 🌱" },
            "111-6": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "B", explanation: "當地球公轉位置在冬至（12/21或22）時，太陽直射南回歸線，當12/25時太陽直射位置為南回歸線偏北一點點，而紐西蘭地理位置位於南回歸線以南，可以感受到晝長夜短；此時的英國因地理位置在北回歸線以北，感受到晝短夜長。", quote: "🌍 換個半球看世界大不同，保持多元思考，你超棒！ 🌍" },
            "111-7": { subject: "【理化】", source: "第四冊第6章", concept: "力與壓力", answer: "B", explanation: "洋芋片在山上會膨脹，是因為山上大氣壓力較小造成的，(A)(C)(D)都可說明不是溫度變化的緣故，而(B)中因為玻璃瓶的容積是固定的，就無法說明此現象。", quote: "🎈 壓力再大也能像洋芋片一樣飽滿面對，你充滿韌性！ 🎈" },
            "111-8": { subject: "【生物】", source: "第一冊跨科主題", concept: "微觀與巨觀", answer: "B", explanation: "體積大小為氫原子＜口腔皮膜細胞＜月球＜太陽，根據題意，甲——氫原子，乙——口腔皮膜細胞，丙——月球，丁——太陽。", quote: "🔭 掌握巨觀與微觀的尺度，你的眼界無可限量！ 🔭" },
            "111-9": { subject: "【理化】", source: "第三冊第2章、第四冊第1章", concept: "物質的世界 / 化學反應", answer: "C", explanation: "鮮奶油加入色素，顏色改變是物理變化，鮮奶油變質是化學變化。", quote: "🍰 學習的過程就是不斷產生美好的化學變化，繼續加油！ 🍰" },
            "111-10": { subject: "【理化】", source: "第四冊第3章、第五章", concept: "電解質與酸鹼鹽 / 有機化合物", answer: "A", explanation: "蘋果酸含有碳元素，分子中含有-COOH原子團，屬於有機酸類。", quote: "🍎 每天吸收一點新知識，就像吃蘋果一樣健康滿分！ 🍎" },
            "111-11": { subject: "【生物】", source: "第二冊第2章", concept: "遺傳", answer: "C", explanation: "由於O型的基因型為ii，故父母親皆必須帶有至少1個i。在甲乙丙丁4組父母組合中，只有丙組合中的母親其基因型為IᴬIᴮ，無i的遺傳因子，因此組別丙所生育的子女不可能為O型血型。", quote: "🧬 努力的基因早就在你體內，發揮你的優勢吧！ 🧬" },
            "111-12": { subject: "【理化】", source: "第五冊第1章", concept: "直線運動", answer: "A", explanation: "由表(四)中可得知，(A)1、2的控制變因為石塊重量和夾角，操作變因為斜面長度；(B)3、4控制變因也是石塊重量和夾角，操作變因也是斜面長度；要了解夾角θ的影響要參考1、3的結果；(D)要了解斜面長度的影響，可參考1、2或3、4的結果。", quote: "📊 理清變因就能找出真相，你的邏輯思維太強了！ 📊" },
            "111-13": { subject: "【地科】", source: "第五冊第6章", concept: "板塊運動與岩層的秘密", answer: "C", explanation: "岩石圈的厚度範圍包含地殼與之連接一部分地函，岩石圈以下為軟流圈，而軟流圈的厚度範圍和地函不相等，因為其僅為地函的一部分。", quote: "🌋 知識的地基打得跟岩石圈一樣穩固，讚啦！ 🌋" },
            "111-14": { subject: "【理化】", source: "第三冊第4章", concept: "光、影像與顏色", answer: "A", explanation: "(A)針孔成像是光的直進性造成；(B)(D)是光的折射造成；(C)是光的反射造成的，因此(B)(C)(D)光的傳播方向均會改變。", quote: "💡 朝著目標直線前進，你的未來無限光明！ 💡" },
            "111-15": { subject: "【地科】", source: "第五冊第5章", concept: "地球的環境", answer: "C", explanation: "飽含地下水的岩層上界即為地下水面，因此丙為地下水面。", quote: "💧 吸收知識就像地下水一樣，慢慢累積成豐沛的泉源！ 💧" },
            "111-16": { subject: "【理化】", source: "第六冊第2章", concept: "電與磁", answer: "B", explanation: "根據安培右手定則，P點磁場方向垂直出紙面，Q點磁場方向垂直入紙面，又根據安培定律，P、Q兩點和電流的垂直距離相同，因此，磁場強度也相同。", quote: "🧲 掌握定則就掌握了分數，你的吸引力超群！ 🧲" },
            "111-17": { subject: "【生物】", source: "第一冊第1章", concept: "生命世界與科學方法", answer: "C", explanation: "複式顯微鏡適合觀察較微小的細胞及其內的構造，解剖顯微鏡適合觀察較大且立體的構造，故觀察葉綠體的阿彥要使用複式顯微鏡觀察，觀察雄蕊數目的阿秀要使用解剖顯微鏡觀察。", quote: "🔬 用顯微鏡般的細心對待每一個細節，完美無缺！ 🔬" },
            "111-18": { subject: "【生物】", source: "第一冊第2章", concept: "生物體的組成", answer: "C", explanation: "植物體的細胞中，只有含有葉綠體的細胞可進行光合作用，但植物體全身的細胞都必須進行呼吸作用以獲取能量。故呼吸作用的細胞數目大於可行光合作用的細胞數目。", quote: "🌿 深呼吸，為大腦補充能量，繼續挑戰下一題！ 🌿" },
            "111-19": { subject: "【地科】", source: "第六冊第4章", concept: "永續的地球", answer: "B", explanation: "溫室效應是指地球的大氣層因為吸收輻射能量，使得地球表面升溫的效應。因此一氧化二氮會造成溫室效應，最可能是本身會吸收地表輻射的特性。", quote: "☀️ 保持溫暖熱情的心，但別忘了地球需要永續發展喔！ ☀️" },
            "111-20": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "A", explanation: "圖中折線圖為臺北和恆春不同月的平均氣溫，無法得知一天的晝夜溫差，因此無法從圖中數據做此推論。", quote: "📈 看懂圖表說的話，你已經具備科學家的素養了！ 📈" },
            "111-21": { subject: "【理化】", source: "第四冊第1章", concept: "化學反應", answer: "D", explanation: "氧化鈣遇水會放熱，且產生氫氧化鈣。", quote: "🔥 學習的熱情就像加了水的生石灰，源源不絕！ 🔥" },
            "111-22": { subject: "【理化】", source: "第四冊第5章", concept: "有機化合物", answer: "B", explanation: "二氯甲烷因具有毒性，會造成人體傷害，而乙酸乙酯本就存在於香蕉、柳丁等水果中，代表其無毒性，不會造成人體傷害。", quote: "🍌 知識的果實是最甜美的，安心享用你的學習成果吧！ 🍌" },
            "111-23": { subject: "【生物】", source: "第二冊第4章", concept: "生物與環境", answer: "D", explanation: "對照此食物鏈和能量塔的關係，可知蛇為能量塔中的丙階層，乙階層為其底下一層，能量應為丙階層的10倍，推估約為100,000能量單位。", quote: "🦅 站在知識的能量塔頂端，你就是學霸！ 🦅" },
            "111-24": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "B", explanation: "根據題意，此時全臺各地皆受天氣系統甲的影響，目前的地面風向大致以東北風為主，可知甲為大陸冷氣團，其氣團性質與太平洋暖氣團不同；天氣系統甲對臺灣北部及東北部造成較強雨勢。天氣系統乙因有機會發展成輕度颱風，為低氣壓，當天呂宋島北部的地面風向受天氣系統乙影響大致為北風或東北風，且低氣壓中心所處的環境其天氣型態多為陰雨多雲。", quote: "🌪️ 氣象再多變也難不倒你，見招拆招超靈活！ 🌪️" },
            "111-25": { subject: "【理化】", source: "第五冊第1章", concept: "直線運動", answer: "D", explanation: "根據圖(十四)所示，可知(A)甲、乙兩車的距離越來越遠；(B)丙、丁兩車的距離越來越遠；(C)甲、丙兩車運動方向相反，其距離越來越遠；(D)乙是靜止，丁往負方向作加速運動，兩者距離越來越遠。", quote: "🚗 搞懂圖表，你的進步就跟丁車一樣正在加速中！ 🚗" },
            "111-26": { subject: "【生物】", source: "第一冊第4章", concept: "生物體的運輸作用", answer: "D", explanation: "人體左心室的含O2量較右心室高，因此甲為左心室，乙為右心室。左心室(甲)與主動脈連接，右心室(乙)與肺動脈連接。", quote: "❤️ 帶著滿滿的氧氣與活力，繼續朝目標邁進吧！ ❤️" },
            "111-27": { subject: "【理化】", source: "第五冊第3章、跨科主題", concept: "功與能 / 能量與能源", answer: "B", explanation: "由圖(十五)及表(六)中，可知甲國燃煤及燃氣量均減少，故碳排放量減少，乙國燃煤量減少，燃氣增加，而再生能量和核能不變，故碳排放量也會減少。", quote: "♻️ 減少錯誤就像減碳一樣，越做越精準，加油！ ♻️" },
            "111-28": { subject: "【理化】", source: "第三冊第5章", concept: "溫度與熱", answer: "B", explanation: "H = m × S × ΔT。加熱10分鐘時，甲、乙兩杯水吸收熱量相同，根據以上的公式，可知水的質量(m)和溫度變化量(ΔT)成反比，因此 ΔT甲 : ΔT乙 = m乙 : m甲 = 2 : 3。", quote: "🌡️ 掌握比例關係，解題就像測量溫度一樣準確！ 🌡️" },
            "111-29": { subject: "【理化】", source: "第四冊第3章", concept: "電解質與酸鹼鹽", answer: "A", explanation: "根據題目所述，水車可增加水中溶氧量，而氫氧化鈣溶於水呈鹼性，可使水中的pH值增加。", quote: "💧 調整酸鹼值就像調整心情，找到平衡最重要！ 💧" },
            "111-30": { subject: "【理化】", source: "第六冊第1章", concept: "電與生活", answer: "A", explanation: "根據題目敘述及圖(十六)所示，甲電極是鋅銅電池的鋅極（負極），乙電池是銅極（正極），其反應式：甲：Zn → Zn²⁺ + 2e⁻ ； 乙：Cu²⁺ + 2e⁻ → Cu", quote: "🔋 電子流動的方向，就是你邁向成功的方向！ 🔋" },
            "111-31": { subject: "【理化】", source: "第三冊第6章", concept: "物質的基本結構", answer: "C", explanation: "因為X質量最小，所以X粒子必為電子，而Y、Z為質子及中子。(A)、(B)若為陽離子，且NY > NX = NZ，所以Y是質子，Z是中子。(C)若為陰離子，且NX = NY > NZ，所以Y是中子，Z是質子。(D)若為陰離子，且NX > NY = NZ，所以Y、Z可能是質子或中子。", quote: "⚛️ 抽絲剝繭分析粒子，你的觀察力比電子還敏銳！ ⚛️" },
            "111-32": { subject: "【生物】", source: "第一冊第3章", concept: "生物體的營養", answer: "C", explanation: "由於蜂蜜中含有分解澱粉的酵素可將澱粉分解，因此有加入蜂蜜的試管經過足夠的時間反應後，加入碘液應測不出含有澱粉，也就不會呈現藍黑色。", quote: "🍯 加點酵素催化一下，學習的吸收力也會跟著加倍！ 🍯" },
            "111-33": { subject: "【理化】", source: "第五冊第2章", concept: "力與運動", answer: "A", explanation: "根據題意及圖(十七)、(十八)所示：L1 = F × 20 + F × 20 = 40F，L2 = F × 40 = 40F，因此 L1 = L2。", quote: "⚖️ 掌握力矩的平衡，你在考場上也能穩如泰山！ ⚖️" },
            "111-34": { subject: "【理化】", source: "第三冊第3章", concept: "波動與聲音", answer: "D", explanation: "由表(七)可知，0秒時P點位置為5.0公分，3 × 10⁻² s 時又回到同一位置5.0公分處，剛好來回振動一次，因此週期為 3 × 10⁻² s。", quote: "🌊 抓準波動的規律，所有的難題都能迎刃而解！ 🌊" },
            "111-35": { subject: "【生物】", source: "第一冊第6章", concept: "生物體的恆定", answer: "B", explanation: "人體中所有器官的細胞皆會消耗氧氣，而肝臟會將血液中的氨轉變為尿素，使得血液中的尿素濃度上升。", quote: "🏃‍♂️ 就像肝臟代謝廢物，把壓力轉化為前進的動力吧！ 🏃‍♂️" },
            "111-36": { subject: "【理化】", source: "第四冊第6章、第五冊第2章", concept: "力與壓力 / 力與運動", answer: "D", explanation: "推動書櫃時，要先克服其最大靜摩擦力，才可使書櫃動，所以小志是合理的。", quote: "📚 突破最大靜摩擦力，學習之路就會越推越順利！ 📚" },
            "111-37": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "B", explanation: "當海水降到水位最低的時候就叫做「乾潮」，依題意中午12點用餐時，海浪打到沙灘上的位置比早上10點時更低，下午2點比中午12點時更高，因此推算乾潮時間可能在中午12點～下午2點間。而對於海水升到最高處的「滿潮」敘述，資料不足無法推知。", quote: "🏖️ 潮起潮落有時，你的實力總有漲潮爆發的一天！ 🏖️" },
            "111-38": { subject: "【理化】", source: "第三冊第1章", concept: "基本測量", answer: "A", explanation: "因為金屬球為空心，因此測量的體積，V為金屬成分的體積和空心部分的體積，兩者之和，比實心時要大，此時算出的密度 D = M / V 會比純銅密度 8.96 g/cm³ 要小。", quote: "📏 測量不只要看外表，看透內涵才能得出正確密度！ 📏" },
            "111-39": { subject: "【生物】", source: "第一冊第1章、第二冊第2章", concept: "生殖 / 遺傳", answer: "B", explanation: "人體的卵細胞為生殖細胞，染色體不成對；受精卵中的染色體為成對；口腔皮膜細胞為體細胞，也具有成對的染色體；成熟的紅血球無細胞核，也無染色體。由此可知甲和丁的細胞不具有成對的染色體，因此也不具有成對的性染色體。", quote: "🧬 獨一無二的細胞，造就了獨一無二優秀的你！ 🧬" },
            "111-40": { subject: "【地科】", source: "第五冊第6章", concept: "板塊運動與岩層的秘密", answer: "D", explanation: "因地層未倒轉，且乙岩層的沉積年代為距今 15,000 年～10,000 年前之間。故丙岩層沉積年代較乙岩層老，距今至少 15,000 年；甲岩層沉積年代較乙岩層年輕，距今不到 10,000 年。火成岩脈因侵入乙岩層，因此該岩脈形成年代在乙岩層之後，同樣距今不到 10,000 年。", quote: "⛰️ 一層一層累積實力，你的知識就像岩層一樣深厚！ ⛰️" },
            "111-41": { subject: "【理化】", source: "第四冊第2章、第四冊第3章", concept: "氧化還原反應 / 電解質與酸鹼鹽", answer: "D", explanation: "鈉燃燒產生氧化鈉，氧化鈉溶於水產生氫氧化鈉呈鹼性，因此甲瓶原先呈紅色。硫燃燒產生二氧化硫，溶於水產生亞硫酸。將乙瓶倒入甲瓶時，會產生酸鹼中和，使甲瓶中的酚酞由紅色變成無色，或者保持紅色（酸的量較少時）。", quote: "🧪 酸鹼中和變幻莫測，你的解題技巧也一樣靈活多變！ 🧪" },
            "111-42": { subject: "【理化】", source: "第三冊第2章", concept: "物質的世界", answer: "B", explanation: "(A)發酵瓶沒有加橡皮塞，且導管在液面下；(C)發酵瓶中的導管在液面下，集氣瓶不能加橡皮塞；(D)集氣瓶不能加橡皮塞。(A)(C)(D)均有錯誤的地方。", quote: "🌬️ 找出裝置的盲點，你就是最敏銳的科學小偵探！ 🌬️" },
            "111-43": { subject: "【理化】", source: "第三冊第2章、第四冊第2章", concept: "物質的世界 / 氧化還原反應", answer: "C", explanation: "甲烷有可燃性無助燃性，CO₂無可燃性及助燃性，而CO₂遇澄清石灰水會變混濁，因此牧牧合理，小歡不合理。", quote: "🔥 保持學習的助燃性，讓知識的火花持續燃燒！ 🔥" },
            "111-44": { subject: "【理化】", source: "第三冊第2章、第四冊第2章", concept: "物質的世界 / 氧化還原反應", answer: "D", explanation: "(A)由表(十)可知溫度愈高，收集氣體愈多，代表微生物活性升高。(B)可以使用排水集氣法收集到的氣體，表示其難溶於水。(C)無任何數據顯示此推論是否正確。(D)收集到的氣體愈多，代表反應速率愈快。", quote: "📊 數據會說話，而你完美翻譯了它們的語言！ 📊" },
            "111-45": { subject: "【生物】", source: "第二冊第3章", concept: "生物的演化與分類", answer: "D", explanation: "根據此植物莖內的構造判斷，其具有環狀排列的維管束，為雙子葉植物。", quote: "🌿 觀察入微的你，連植物的隱藏構造都逃不過你的眼睛！ 🌿" },
            "111-46": { subject: "【生物】", source: "第一冊第4章", concept: "生物體的運輸作用", answer: "D", explanation: "由圖(二十五)可知甲為表皮，乙為形成層，丙為木質部（輸送水分的方向為由下往上），丁為韌皮部（可雙向輸送養分），只有同學4的答案正確。", quote: "💦 順著維管束的方向，讓養分流向大腦的每個角落！ 💦" },
            "111-47": { subject: "【理化】", source: "第五冊第4章", concept: "電流、電壓與歐姆定律", answer: "A", explanation: "根據圖(二十七)和選項圖示判斷，答案(B)(C)(D)均與電路圖不符。", quote: "🔌 理清錯綜複雜的電路，你的思緒如同導線般通暢！ 🔌" },
            "111-48": { subject: "【理化】", source: "第五冊第4章", concept: "電流、電壓與歐姆定律", answer: "D", explanation: "根據圖(二十七)所示，乙安培計得電流應為經過丙的電流，和經過丁的電流之和。而甲安培計只測得經過丙的電流。因此 I乙 > I甲，小玉的紀錄不合理。", quote: "⚡ 電流有跡可循，你的邏輯推演無懈可擊！ ⚡" },
            "111-49": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "C", explanation: "阿明左邊滿月圖卡日期為15或16，右邊為西邊亮的眉形月日期約為4或5，因此阿明的日期數字大小答錯，小豪得1分；小豪左邊圖卡為西邊亮的凸月日期約為11或12，右邊為東邊亮的眉形月日期約為25或26，小豪的日期數字大小答對。", quote: "🌕 掌握月相的陰晴圓缺，會考滿分非你莫屬！ 🌕" },
            "111-50": { subject: "【生物】", source: "第一冊第5章", concept: "生物體的協調作用", answer: "D", explanation: "分析阿明和小豪玩此遊戲時神經傳遞的情形：\n1. 阿明的反應時間較短，小豪的反應時間較長。\n2. 兩人從接受刺激到產生反應的神經傳導路徑如下：刺激→眼睛內的受器→感覺神經元→大腦→脊髓→運動神經元→手指的肌肉。", quote: "🧠 神經傳導超迅速，你的大腦反應力簡直是一流的！ 🧠" },

            // --- 110年 ---
            "110-1": { subject: "【理化】", source: "第三冊第1章", concept: "基本測量與科學概念", answer: "A", explanation: "天平使用前要先歸零，是可避免產生誤差，拿砝碼須以砝碼夾拿取，可避免手汗等使砝碼生鏽，甲、乙兩敘述均對。", quote: "⚖️ 凡事從歸零開始，你的每一步都在精準邁向成功！ ⚖️" },
            "110-2": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "D", explanation: "潮差的定義為滿、乾潮的水位差，由題意可知，滿潮水位最高高於海平面高度2公尺，乾潮水位最低低於海平面高度2公尺，因此本港的潮差高度最大為 2+2=4公尺。在4公尺範圍內皆為可能的潮差高度。", quote: "🌊 就像海水的潮起潮落，保持彈性與韌性，你會適應得很好！ 🌊" },
            "110-3": { subject: "【地科】", source: "第五冊第6章", concept: "變動的地球", answer: "C", explanation: "對於單一的地震，地震規模各地皆相同，因此新竹X數值和嘉義同為6.2。震央在高屏地區，隨著地震波的傳遞，距離震央越遠造成震度會越小，且震度數值為0~7正整數，因此新竹Y數值小於等於4皆符合。", quote: "🌍 規模再大的挑戰，只要距離拉遠看，其實一點也不可怕！ 🌍" },
            "110-4": { subject: "【生物】", source: "第一冊第6章", concept: "生物體的恆定", answer: "D", explanation: "當人體處在溫度較體溫高的環境中時，皮膚表面的血管會擴張，流到皮膚表面的血液量會增加以利散熱；當處在溫度較體溫低的環境中時，肌肉會顫抖以增加體熱的生成。由此可知甲環境溫度較體溫低，乙環境溫度較體溫高。", quote: "🌡️ 面對環境的冷熱變化，你的調節能力堪稱完美！ 🌡️" },
            "110-5": { subject: "【理化】", source: "第三冊第2章", concept: "認識物質", answer: "D", explanation: "選項A「湖水的總質量」需要有死海的湖水總體積，若無則無法計算；選項B「每年的水分蒸發量」無法從題意得知；選項C「含有鹽分的總質量」需要有死海的湖水總體積；選項D「鹽分的重量百分濃度」可由每公升湖水重達1.24公斤(1240公克)為「溶液重量」，每公升湖水含有340公克的鹽為「溶質重量」，依重量百分濃度定義 340/1240*100% 即為「鹽分的重量百分濃度」。", quote: "🧂 濃縮的都是精華，你的知識濃度絕對是百分之百！ 🧂" },
            "110-6": { subject: "【生物】", source: "第二冊第1章", concept: "生殖", answer: "C", explanation: "開花植物授粉時，花粉粒會落在雌蕊的柱頭上並萌發花粉管。", quote: "🌸 就像花粉找到柱頭，你的努力終將開花結果！ 🌸" },
            "110-7": { subject: "【生物】", source: "第一冊第1章", concept: "生命世界與科學方法", answer: "A", explanation: "取甲、乙做為實驗組與對照組，在牛奶量、靜置溫度、靜置時間等控制變因皆相同時，只有是否放入銀幣此項因素做為操作變因，檢測結果甲有檢測出細菌，乙沒有。故此實驗支持加入銀幣時可抑制細菌生長。", quote: "🔬 掌握變因的邏輯，你就是小小科學家！ 🔬" },
            "110-8": { subject: "【理化】", source: "第三冊第3章", concept: "波動與聲音", answer: "B", explanation: "使用不同頻率的音叉，敲擊後可觀察其是否共振，即可證明。", quote: "🎶 找到與自己頻率相符的節奏，產生最棒的共鳴吧！ 🎶" },
            "110-9": { subject: "【理化】", source: "第三冊第4章", concept: "光、影像與顏色", answer: "B", explanation: "以白光照射單色圖卡只反射紅光，表示此圖卡為紅色圖卡，故以藍光照射紅色圖卡，藍光會被吸收。", quote: "🌈 吸收有用的光芒，反射最耀眼的自己！ 🌈" },
            "110-10": { subject: "【生物】", source: "第二冊第4章", concept: "形形色色的生物", answer: "A", explanation: "蘇鐵為裸子植物，具有維管束、種子和毬果，無花朵。", quote: "🌲 就像裸子植物雖然不開花，卻有著堅韌的生命力！ 🌲" },
            "110-11": { subject: "【生物】", source: "第一冊第4章", concept: "生物體的運輸作用", answer: "C", explanation: "由圖(四)分析散失的水分量：不做處理 > 上表皮塗白膠 > 下表皮塗白膠 > 上下表皮皆塗白膠，可推論此植物的上下表皮皆有氣孔分布，且主要分布於下表皮(下表皮氣孔數多於上表皮氣孔數)。", quote: "🍃 觀察細節就能看出端倪，你的觀察力超棒！ 🍃" },
            "110-12": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "D", explanation: "由空氣組成比例圖可知，甲(78%)是氮氣，乙(21%)是氧氣，兩者均為固定氣體。", quote: "☁️ 基礎知識就像空氣一樣重要，你吸收得很完全！ ☁️" },
            "110-13": { subject: "【理化】", source: "第四冊第1章", concept: "化學反應", answer: "B", explanation: "碳酸氫銨 NH₄HCO₃ 中不含氯原子，所以不可能產生氯化氫 HCl。", quote: "⚛️ 元素守恆定律是解題的鑰匙，你掌握得很棒！ ⚛️" },
            "110-14": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "A", explanation: "地球上所見星體在4小時後因自身造成的位置移動極小(流星除外)，大部分星體位置的改變主要是因為地球由西向東自轉的關係，造成人們在地球上仰望天空時，星體由東方升起西方落下，因此在4小時後，美美應朝西方天空尋找甲、乙兩星。", quote: "🌌 跟著地球自轉的規律，你的方向感絕佳！ 🌌" },
            "110-15": { subject: "【理化】", source: "第四冊第3章", concept: "電解質與酸鹼鹽", answer: "A", explanation: "胃酸(HCl)為酸性，大量胃酸會使胃液pH值下降(pH<7)，胃藥中的碳酸氫鈉為鹼性，可中和胃酸，使pH值上升。", quote: "🧪 酸鹼中和能緩解不適，知識的累積能緩解考前焦慮！ 🧪" },
            "110-16": { subject: "【理化】", source: "第五冊第2章", concept: "力與運動", answer: "C", explanation: "先急左轉會使歹徒因慣性向其右方靠，再急加速會使其向後方倒。", quote: "🏎️ 活用慣性定律，你在知識的賽道上無人能敵！ 🏎️" },
            "110-17": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "A", explanation: "颱風為一個熱帶低氣壓系統，低氣壓中心地表的空氣流動方向為往中心流入，同時因臺灣位於北半球，空氣往低壓中心流入同時因受地球自轉的影響會向右偏轉，造成地表的空氣流動方向為逆時鐘方向往中心流入。", quote: "🌀 掌握氣旋的流動方向，你就像天氣預報一樣精準！ 🌀" },
            "110-18": { subject: "【理化】", source: "第三冊第5章", concept: "溫度與熱", answer: "C", explanation: "設甲、乙的比熱均為 S cal/g℃，熱源每秒可加熱 h 卡。100×S×20=h×120—①，300×S×10=h×t—②，①÷②=(100×S×20)/(300×S×10)=(h×120)/(h×t)。計算得出 2/3=120/t，2t=360，故t=180(s)。", quote: "🔥 計算熱量要有耐心，你的邏輯推演非常清晰！ 🔥" },
            "110-19": { subject: "【生物】", source: "第二冊第2章、第3章", concept: "遺傳 / 演化", answer: "B", explanation: "由於深色為顯性(B)，淺色為隱性(b)，故深色蛾的基因型可能為BB或Bb，淺色蛾的基因型為bb。由圖(八)可知甲：BB+Bb<bb，乙：BB+Bb=bb，丙：BB+Bb=bb，丁：BB+Bb>bb。", quote: "🧬 顯隱性的判斷，展現了你優良的學習基因！ 🧬" },
            "110-20": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "C", explanation: "依題意天然光害主要來自月光，因此主要觀察農曆日期的資料。牧夫座流星雨的農曆16日接近滿月影響最大，御夫座及雙子座流星雨接近下、上弦月影響次之，天龍座流星雨的農曆2日接近新月影響最小。", quote: "🌠 避開光害尋找流星，就像避開干擾專注學習一樣聰明！ 🌠" },
            "110-21": { subject: "【理化】", source: "第三冊第6章", concept: "物質的基本結構", answer: "D", explanation: "阿牧依照常溫常壓下是否為固態，這是依物理性質分類，小菲依是否會和水反應且冒泡分類，這是依化學性質分類。", quote: "🔎 物理與化學的界線，你分得比任何人都清楚！ 🔎" },
            "110-22": { subject: "【理化】", source: "第四冊第4章", concept: "反應速率與平衡", answer: "A", explanation: "本實驗記錄等量的胡蘿蔔切成表面積不同的情況，來探討5分鐘內所收集的氧氣量，即探討胡蘿蔔的接觸面積與反應速率的關係。(C)中改變所加入水量會影響雙氧水的濃度，進而改變反應速率，胡蘿蔔為催化劑，不會影響氧氣的最終產量。", quote: "🥕 接觸面積越大反應越快，學習的觸角越多成長越神速！ 🥕" },
            "110-23": { subject: "【理化】", source: "第四冊第2章", concept: "氧化還原反應", answer: "C", explanation: "方程式：NO+NO₂+2NH₃→2N₂+3H₂O，反應中NO和NO₂的比例為1:1，而廢氣中NO為NO₂的9倍，所以須先將NO氧化成NO₂，使其莫耳數比為1:1，此時反應最快。", quote: "⚙️ 找出最佳的反應比例，你就是化學調配大師！ ⚙️" },
            "110-24": { subject: "【理化】", source: "第六冊第1章", concept: "電流的熱效應與化學效應", answer: "A", explanation: "X甲 = 0.023kW × 100hr = 2.3度，X乙 = 0.023kW × 100hr = 2.3度，故消耗電能 X甲 = X乙。", quote: "💡 搞懂電功率與度數，你的頭腦就像省電燈泡一樣高效！ 💡" },
            "110-25": { subject: "【生物】", source: "第一冊第1章", concept: "生命世界與科學方法", answer: "A", explanation: "使用解剖顯微鏡觀察物體時，物體實際移動的方向和顯微鏡視野中看到的移動方向是相同的。", quote: "🔍 解剖顯微鏡所見即所得，你的實力也是真材實料！ 🔍" },
            "110-26": { subject: "【理化】", source: "第三冊第6章", concept: "物質的基本結構", answer: "D", explanation: "根據玉芬及小嵐的敘述，使用刪去法。與As不同族且與Ge不同週期，與Te不同族且與Cl不同週期。推論此元素可能為₅₀Sn或₅₁Sb。", quote: "🧩 運用刪去法解開元素之謎，邏輯滿分！ 🧩" },
            "110-27": { subject: "【理化】", source: "第五冊第3章", concept: "能量——由功到熱", answer: "D", explanation: "不計任何摩擦力，根據力學能守恆定律，U甲+E甲 = U乙+E乙 = U丙+E丙，故 U丙-U甲 = E甲-E丙。", quote: "✨ 能量永遠守恆，你付出的努力一定會轉化為分數！ ✨" },
            "110-28": { subject: "【生物】", source: "第一冊第5章", concept: "生物體的協調作用", answer: "A", explanation: "由表(七)得知，完成此動作需要25-59秒，並非短暫迅速的反射動作，控制中樞應位於大腦。所有動作皆需要感覺神經元與運動神經元的參與，且從第一次至第五次完成動作的時間愈來愈短可知，經過練習可縮短反應時間。", quote: "🧠 熟能生巧！練習得越多，你的神經傳導就越快速！ 🧠" },
            "110-29": { subject: "【理化】", source: "第五冊第4章", concept: "電流、電壓與歐姆定律", answer: "D", explanation: "由圖可知，步驟②中甲金屬塊會帶負電(接觸起電)。步驟④中甲金屬塊會把負電傳給乙。故甲、乙兩金屬塊均為帶負電。", quote: "⚡ 看透電荷的流向，你的思緒和靜電一樣活躍！ ⚡" },
            "110-30": { subject: "【理化】", source: "第三冊第6章", concept: "物質的基本結構", answer: "D", explanation: "原子變成離子只是電子發生轉移，質子數保持不變。Fe原子失去2個電子變成Fe²⁺；Fe原子失去3個電子變成Fe³⁺。故Fe的質子數=Fe²⁺的質子數=Fe³⁺的質子數；Fe的電子數>Fe²⁺的電子數>Fe³⁺的電子數。", quote: "⚛️ 質子數是原子的靈魂，永遠不變，就像你堅持學習的心！ ⚛️" },
            "110-31": { subject: "【生物】", source: "第二冊第4章", concept: "形形色色的生物", answer: "B", explanation: "依據表(八)分析，分類的依據可推論如下：甲：體溫(內溫或外溫)，乙：受精方式(體內或體外)，丙：呼吸器官(肺或鰓)，丁：卵生或胎生。", quote: "🦎 就像生物分類一樣有條不紊，你的思緒超級清晰！ 🦎" },
            "110-32": { subject: "【地科】", source: "第五冊第7章", concept: "浩瀚的宇宙", answer: "B", explanation: "依附圖所示，每年當太陽光於3月21日直射赤道（緯度0度）後，直射位置便會向北偏移直到6月22日直射北緯23.5度。依題意太陽光直射古井底部的日子為5月16日，該地緯度在0度與北緯23.5度之間。故選【B】。", quote: "☀️ 掌握太陽直射的軌跡，你在地球科學的宇宙裡閃閃發光！ ☀️" },
            "110-33": { subject: "【理化】", source: "第六冊第1章", concept: "電流的熱效應與化學效應", answer: "B", explanation: "由圖(十四)中可知紅色導線接電池負極，黑色導線接電池正極，再根據圖(十五)及(十六)可知電極上半反應式如下：碳棒甲：Cu²⁺+2e⁻→Cu；碳棒乙：2H₂O→O₂+4H⁺+4e⁻；銅棒丙：Cu²⁺+2e⁻→Cu；銅棒丁：Cu→Cu²⁺+2e⁻。故選【B】。", quote: "🔋 正負極不搞混，解題思路就像電流一樣順暢！ 🔋" },
            "110-34": { subject: "【生物】", source: "第一冊第4章", concept: "生物體的運輸作用", answer: "A", explanation: "左心房和左心室裡為充氧血，右心房和右心室裡為缺氧血。當心室收縮時，心房和心室之間的瓣膜會關閉防止血液由心室逆流回心房。故選【A】。", quote: "❤️ 瓣膜把關血液流向，細心把關每一個選項，你做得到！ ❤️" },
            "110-35": { subject: "【理化】", source: "第三冊第2章", concept: "認識物質", answer: "B", explanation: "根據氣體變為液體或固體，液體變固體為放熱反應，固體變液體或氣體，液體變氣體為吸熱反應，可判斷甲為氣體，乙為液體，丙為固體。故選【B】。", quote: "🧊 吸熱與放熱的狀態變化，考驗著你的冷靜與熱情！ 🧊" },
            "110-36": { subject: "【生物】", source: "第二冊第5章", concept: "生物與環境", answer: "D", explanation: "由圖(十八)可知甲、乙為生產者；丙、丁會競爭食物乙，當丙的數量增加會不利於丁生存；己會捕食丙，當己減少時丙被捕食的機會降低，對丙的生存有利；庚會捕食戊，但庚和戊又同時競爭食物丁。故選【D】。", quote: "🕸️ 理清食物網的複雜關係，你就是生態圈的邏輯王者！ 🕸️" },
            "110-37": { subject: "【理化】", source: "第四冊第6章", concept: "力與壓力", answer: "D", explanation: "根據圖(十九)所示，外界的大氣壓力為 1atm=76cmHg=1033.6 gw/cm²，可知Q、S的氣壓均為1atm，而P點的氣壓為0cmHg，R點的氣壓為1033.6-76=957.6gw/cm²。故選【D】。", quote: "🎈 承受壓力、換算單位，你比連通管還要無堅不摧！ 🎈" },
            "110-38": { subject: "【地科】", source: "第六冊第3章", concept: "變化莫測的天氣", answer: "C", explanation: "依題意臺灣此時正受到冷鋒影響，冷鋒符號後面(左上方)表示有一強大的冷氣團為高氣壓，故甲應標示H，屬於冷氣團；冷鋒符號前面(右下方)有一較弱的暖氣團為高氣壓，故乙應標示H，屬於暖氣團。不論冷、暖氣團，相對於周圍都是大區穩定空氣，因此都屬於高氣壓。故選【C】。", quote: "☁️ 鋒面過境也吹不散你的專注力，繼續維持高氣壓狀態！ ☁️" },
            "110-39": { subject: "【理化】", source: "第五冊第2章", concept: "力與運動", answer: "D", explanation: "小球每秒轉2圈，t=0秒時，小球在手的正東方，t=3秒時(轉了整數圈)，小球仍在手的正東方，此時小球的速度方向在該點的切線方向，即正北方。故選【D】。", quote: "🔄 抓準切線方向，別讓圓周運動把你轉暈了，做得好！ 🔄" },
            "110-40": { subject: "【理化】", source: "第四冊第6章", concept: "力與壓力", answer: "D", explanation: "由圖形可知甲為沉體，乙為浮體，甲體積V甲=250-200=50cm³，乙在液面下的體積為280-200=80cm³，故乙的重量=所受浮力=80×1=80(gw)。故選【D】。", quote: "⛵ 浮力就是排開液體的重量，你的理解力非常深厚！ ⛵" },
            "110-41": { subject: "【理化】", source: "第三冊第6章、第四冊第5章", concept: "物質的基本結構 / 有機化合物", answer: "A", explanation: "根據質量守恆定律，可知反應物總質量等於生成物總質量，即 60+74=x+18，因此 x=116。故選【A】。", quote: "⚖️ 質量永遠守恆，你的努力也都會化為甜美的果實！ ⚖️" },
            "110-42": { subject: "【生物】", source: "第一冊第3章", concept: "生物體的營養", answer: "C", explanation: "此種酵素最適合在人體內微鹼性的環境中作用，人體口腔的pH值約為中性，故此酵素會有一些活性。當進入胃中後，由於胃液為強酸，此酵素會被完全破壞，亦不會有殘餘的酵素進入小腸中。故選【C】。", quote: "😋 消化知識就像酵素作用一樣，找對環境吸收最快！ 😋" },
            "110-43": { subject: "【理化】", source: "第五冊第1章", concept: "直線運動", answer: "B", explanation: "(A)中 a=(0-9.8)=9.8=-1 m/s² 不符。(B)中 a=-9.8÷1=-9.8 m/s²，且速度會先變小到最高點速度為0再反向落下，故(C)、(D)圖形均為不符。故選【B】。", quote: "🎢 速度與加速度的變換，你掌握得就像老司機一樣穩！ 🎢" },
            "110-44": { subject: "【地科】", source: "第五冊第6章", concept: "變動的地球", answer: "C", explanation: "選項A敘述若丙為大陸地殼，因提示沒有乙和丙的密度比較，故乙不一定為海洋地殼；選項B若甲的厚度大於乙，因地函大於地殼，乙不可能為地函；選項C若丙為海洋地殼，海洋地殼以下則為地函，必為正確；選項D提示僅說甲密度最大，未必為地函。故選【C】。", quote: "🌍 層層剖析地球內部，你的邏輯推理毫無破綻！ 🌍" },
            "110-45": { subject: "【理化】", source: "第四冊第4章", concept: "反應速率與平衡", answer: "A", explanation: "根據「反應物濃度上升，應變變因X之值越小」的結論，可知(B)和(C)均不符，而(D)中的圖形不符合數據中反應物濃度愈大，X值愈小，1/X值愈大的趨勢。故選【A】。", quote: "📈 找出圖表中的正反比關係，反應速率盡在你的掌握之中！ 📈" },
            "110-46": { subject: "【理化】", source: "第四冊第5章", concept: "有機化合物", answer: "B", explanation: "柔珠主要材質是聚乙烯，為單體聚合而成的合成聚合物。故選【B】。", quote: "🧴 日常用品背後的化學原理，你一眼就能看穿！ 🧴" },

        // 按下 Enter 鍵也可以搜尋
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchQuestion();
            }
        }

        function searchQuestion() {
            const inputVal = document.getElementById('searchInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!inputVal.includes('-')) {
                errorMsg.classList.remove('hidden');
                errorMsg.innerText = "請輸入年份和題號，例如：115-1";
                resultContainer.classList.add('hidden');
                return;
            }

            if (qaData[inputVal]) {
                const data = qaData[inputVal];
                
                let subjectColor = "bg-dopaBlue";
                if (data.subject.includes("生物")) subjectColor = "bg-dopaGreen";
                if (data.subject.includes("地科")) subjectColor = "bg-dopaOrange";
                if (data.subject.includes("理化")) subjectColor = "bg-dopaPurple";

                document.getElementById('resTitle').innerText = inputVal;
                
                const subjectEl = document.getElementById('resSubject');
                subjectEl.innerText = data.subject;
                subjectEl.className = `text-2xl font-bold px-5 py-2 rounded-full border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] ${subjectColor}`;

                document.getElementById('resSource').innerText = data.source;
                document.getElementById('resConcept').innerText = data.concept;
                document.getElementById('resExplanation').innerText = data.explanation;
                document.getElementById('resAnswer').innerText = data.answer;
                document.getElementById('resQuote').innerText = data.quote;

                errorMsg.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                resultContainer.classList.remove('opacity-0', 'translate-y-4');
                resultContainer.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-500');

            } else {
                resultContainer.classList.add('hidden');
                errorMsg.classList.remove('hidden');
                errorMsg.innerText = "找不到這題喔！請確認輸入格式為「年份-題號」，例如：115-1。";
            }
        }
    </script>
