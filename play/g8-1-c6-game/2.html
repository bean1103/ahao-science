<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原子結構配對大作戰</title>
    <style>
        :root {
            /* 原子專屬配色：科技藍與紫 */
            --primary: #4a69bd;
            --secondary: #6a89cc;
            --bg: #f1f2f6;
            --card-bg: #fff;
            --text: #2f3542;
            --accent: #f6b93b; /* 強調色 */
        }

        body {
            font-family: '微軟正黑體', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            /* 增加一點網格背景，更有理化感 */
            background-image: radial-gradient(#dfe4ea 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
            margin: 0;
            color: var(--text);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-align: center;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #57606f;
            font-weight: bold;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 遊戲區域容器 */
        .game-area {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 850px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 300px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            border: 2px solid #ced6e0; /* 淺灰邊框 */
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 4px 0px #ced6e0; /* 立體按鈕感 */
            user-select: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #ced6e0;
            border-color: var(--secondary);
        }

        .card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #ced6e0;
        }

        /* 選中狀態 */
        .card.selected {
            background-color: #eaf0ff;
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 4px 0px var(--primary);
            transform: translateY(-2px);
        }

        /* 配對成功 */
        .card.matched {
            background-color: #dff9fb;
            border-color: #22a6b3;
            color: #22a6b3;
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }

        /* 配對失敗 (震動) */
        .card.wrong {
            background-color: #ffdde1;
            border-color: #eb4d4b;
            color: #eb4d4b;
            box-shadow: 0 4px 0px #eb4d4b;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        .reset-btn {
            margin-top: 30px;
            padding: 12px 35px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(74, 105, 189, 0.3);
            display: none;
            transition: background 0.2s;
        }
        .reset-btn:hover { background-color: #3c56a0; }

        .instructions {
            background-color: rgba(255,255,255,0.8);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        
        /* 勝利訊息 */
        .victory-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border: 4px solid var(--primary);
            display: none;
            z-index: 100;
        }
        
        .atom-icon {
            font-size: 4rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <h1>⚛️ 原子結構連連看</h1>
    <div class="instructions">💡 請將「左邊的名詞」與「右邊的定義」配對消除</div>
    
    <div class="info-bar">
        <span>剩餘組數: <span id="pairs-left">6</span></span>
        <span>錯誤: <span id="mistakes" style="color:#eb4d4b">0</span></span>
    </div>

    <div class="game-area">
        <div class="column" id="col-terms"></div>
        <div class="column" id="col-defs"></div>
    </div>
    
    <div id="victory-screen" class="victory-msg">
        <div class="atom-icon">⚛️</div>
        <h2 style="color: var(--primary); margin:10px 0;">挑戰成功！</h2>
        <p style="font-size: 1.2rem; color:#555;">你的原子觀念非常清晰！</p>
        <button class="reset-btn" style="display:inline-block;" onclick="initGame()">再玩一次</button>
    </div>

<script>
    // --- 原子結構資料 (老師可修改此處) ---
    const data = [
        { id: 1, term: "質子 (Proton)", def: "位於原子核內，帶正電，決定元素種類" },
        { id: 2, term: "中子 (Neutron)", def: "位於原子核內，不帶電，影響質量數" },
        { id: 3, term: "電子 (Electron)", def: "位於原子核外，帶負電，質量極小" },
        { id: 4, term: "原子序 (Atomic Number)", def: "等於原子核內的質子數" },
        { id: 5, term: "質量數 (Mass Number)", def: "質子數 ＋ 中子數的總和" },
        { id: 6, term: "同位素 (Isotope)", def: "質子數相同，但中子數不同的原子" }
    ];

    let selectedTerm = null;
    let selectedDef = null;
    let pairsLeft = data.length;
    let mistakeCount = 0;

    const colTerms = document.getElementById('col-terms');
    const colDefs = document.getElementById('col-defs');
    const pairsDisplay = document.getElementById('pairs-left');
    const mistakesDisplay = document.getElementById('mistakes');
    const victoryScreen = document.getElementById('victory-screen');

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        pairsLeft = data.length;
        mistakeCount = 0;
        selectedTerm = null;
        selectedDef = null;
        
        pairsDisplay.innerText = pairsLeft;
        mistakesDisplay.innerText = 0;
        victoryScreen.style.display = 'none';
        colTerms.innerHTML = '';
        colDefs.innerHTML = '';

        let terms = data.map(item => ({ id: item.id, text: item.term, type: 'term' }));
        let defs = data.map(item => ({ id: item.id, text: item.def, type: 'def' }));

        terms = shuffle(terms);
        defs = shuffle(defs);

        terms.forEach(item => createCard(item, colTerms));
        defs.forEach(item => createCard(item, colDefs));
    }

    function createCard(item, container) {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = item.text;
        div.dataset.id = item.id;
        div.dataset.type = item.type;
        
        div.onclick = () => handleCardClick(div);
        container.appendChild(div);
    }

    function handleCardClick(card) {
        if (card.classList.contains('matched')) return;
        
        // 點擊音效 (可選，這裡僅用視覺回饋)
        
        if (card.dataset.type === 'term') {
            if (selectedTerm) selectedTerm.classList.remove('selected');
            selectedTerm = card;
            card.classList.add('selected');
        } else {
            if (selectedDef) selectedDef.classList.remove('selected');
            selectedDef = card;
            card.classList.add('selected');
        }

        if (selectedTerm && selectedDef) {
            checkMatch();
        }
    }

    function checkMatch() {
        const termId = selectedTerm.dataset.id;
        const defId = selectedDef.dataset.id;

        // 暫停點擊，避免快速亂點
        document.body.style.pointerEvents = "none";

        if (termId === defId) {
            // 配對成功
            setTimeout(() => {
                selectedTerm.classList.remove('selected');
                selectedDef.classList.remove('selected');
                selectedTerm.classList.add('matched');
                selectedDef.classList.add('matched');
                selectedTerm = null;
                selectedDef = null;
                pairsLeft--;
                pairsDisplay.innerText = pairsLeft;
                document.body.style.pointerEvents = "auto";

                if (pairsLeft === 0) {
                    setTimeout(() => victoryScreen.style.display = 'block', 500);
                }
            }, 200);
        } else {
            // 配對失敗
            mistakeCount++;
            mistakesDisplay.innerText = mistakeCount;
            selectedTerm.classList.add('wrong');
            selectedDef.classList.add('wrong');

            setTimeout(() => {
                if (selectedTerm) {
                    selectedTerm.classList.remove('selected', 'wrong');
                    selectedTerm = null;
                }
                if (selectedDef) {
                    selectedDef.classList.remove('selected', 'wrong');
                    selectedDef = null;
                }
                document.body.style.pointerEvents = "auto";
            }, 600);
        }
    }

    initGame();

</script>
