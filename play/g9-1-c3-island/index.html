<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="generator" content="IsleForge">
<meta name="description" content="國中自然「功與能」3D 學習島：功與功率、動能與位能、能量守恆定律與能源、簡單機械，並有跑酷挑戰。">
<meta name="theme-color" content="#16222e" id="meta-theme">
<title>阿豪自然的 G9_1_C3 · 跑酷挑戰島</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f7a6b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3EG9%3C/text%3E%3C/svg%3E">
<style>:root{--primary:#2f7a6b;--primary-d:#225a4f;--accent:#d9792f;--bg:#16222e;--ink:#eef3f6;--muted:#a9bac6;--panel:#1f3142;--panel2:#2a4259;--edge:#0f1822;--chip:#2f4a63;--shadow:0 4px 0 rgba(0,0,0,.35);--r:16px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif}
body.theme-morning{--bg:#f6f0e4;--ink:#262626;--muted:#5d5a52;--panel:#fffaf0;--panel2:#f0e6d0;--edge:#cdbf9f;--chip:#efe2c4;--shadow:0 4px 0 rgba(120,100,60,.35)}
body.theme-mist{--bg:#dcebee;--ink:#1f2d33;--muted:#4f6168;--panel:#f6fbfc;--panel2:#dbe9ec;--edge:#a9c2c8;--chip:#cfe2e6;--shadow:0 4px 0 rgba(60,90,100,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{transition:background .6s,color .6s}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.label-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:14px;white-space:nowrap}
.btn-pill{cursor:pointer}
/* 頂部 */
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;pointer-events:none;z-index:20}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);padding:6px 14px 6px 8px;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:16px;line-height:1.2}.brand p{margin:0;font-size:12px;color:var(--muted)}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;border-bottom:4px solid var(--primary-d);position:relative}
.logo::before{content:"";position:absolute;top:-5px;left:6px;width:8px;height:6px;border-radius:3px 3px 0 0;background:var(--primary);box-shadow:16px 0 0 var(--primary)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* 工具列 */
#tools{position:fixed;left:14px;top:74px;display:flex;flex-direction:column;gap:8px;z-index:20}
#tools button{display:flex;align-items:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px 0 10px;background:var(--panel);border:2px solid var(--edge);border-bottom-width:4px;border-radius:12px;font-weight:700;font-size:14px;text-align:left;transition:transform .12s,background .2s}
#tools button i{font-style:normal;font-size:18px;width:24px;text-align:center}
#tools button:hover{transform:translateX(3px);background:var(--panel2)}
#tools button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary-d)}
/* 面板 */
#panel{position:fixed;right:14px;top:74px;bottom:14px;width:min(420px,calc(100vw - 28px));background:var(--panel);border:2px solid var(--edge);border-bottom-width:6px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;overflow:auto;overscroll-behavior:contain;animation:slide .35s cubic-bezier(.2,.9,.3,1)}
#panel[hidden]{display:none}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.grab{display:none}
#panel-body{padding:18px 20px 24px}
.p-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.badge{flex:none;display:grid;place-items:center;min-width:52px;height:52px;padding:0 6px;border-radius:12px;color:#fff;font-weight:900;font-size:18px;border-bottom:5px solid rgba(0,0,0,.28);position:relative;background:var(--uc,var(--primary))}
.badge::before{content:"";position:absolute;top:-6px;left:8px;width:9px;height:7px;border-radius:3px 3px 0 0;background:inherit;box-shadow:22px 0 0 var(--uc,var(--primary))}
.p-head h2{margin:0;font-size:22px;line-height:1.25;flex:1;padding-top:2px}
.x{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--edge);background:var(--panel2);font-size:16px;font-weight:700}
.intro{font-size:16px;margin:8px 0 12px}
#panel h3,#bag h3{margin:18px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
#panel h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
#panel ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#panel li{background:var(--panel2);border-radius:12px;padding:10px 12px;border-left:5px solid var(--uc,var(--primary))}
#panel ul.rules li{border-left-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--edge);background:var(--chip);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--edge);border-bottom-width:4px;background:var(--panel2);font-weight:800}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary-d)}
.btn.accent{background:var(--accent);color:#1b1b1b;border-color:#a85a1b}
.btn.ghost{background:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* 練習 */
.mini{background:var(--panel2);border-radius:14px;padding:12px;margin-top:10px}
.mini p{margin:0 0 8px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--panel)}
.opt.ok{background:#2e8b57;color:#fff;border-color:#1e6b41}.opt.no{background:#b9473b;color:#fff;border-color:#8a3128}
.expl{margin:8px 0 0;font-size:14px;color:var(--muted)}
/* NPC */
.npc-say{background:var(--panel2);border-radius:16px;padding:14px;position:relative;margin:10px 0;font-size:17px}
.npc-say::after{content:"";position:absolute;left:24px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--panel2)}
.level-card{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border-radius:14px;padding:12px;margin-top:8px;border-left:6px solid var(--accent)}
.level-card h4{margin:0;font-size:17px}.level-card small{color:var(--muted);display:block}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--primary);color:#fff;margin-left:6px}
/* 島名標籤 */
.islabel{pointer-events:auto;transform:translateY(-8px);min-height:44px;padding:0 16px;border-radius:999px;border:3px solid #0f1822;border-bottom-width:5px;background:var(--uc,#2f7a6b);color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.3);white-space:nowrap}
.islabel.hq{background:#d9792f;color:#1b1b1b;text-shadow:none}
.islabel.done::after{content:" ✓"}
.islabel:hover{filter:brightness(1.1)}
/* 列表 */
#listview{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}
#listview[hidden]{display:none}
.list-inner{max-width:760px;margin:0 auto;padding:78px 16px 40px}
.list-head{display:flex;justify-content:space-between;align-items:center}.list-head h2{margin:0}
#list-cards{display:grid;gap:12px;margin-top:12px}
.lcard{text-align:left;width:100%;background:var(--panel);border:2px solid var(--edge);border-bottom-width:5px;border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px}
.lcard h3{margin:0 0 4px}.lcard p{margin:0;color:var(--muted)}
/* 導覽、近處 */
#tour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));background:var(--panel);border:2px solid var(--edge);border-bottom-width:6px;border-radius:18px;padding:14px 18px;z-index:35;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tour[hidden],#near[hidden],#walkpad[hidden],#skip[hidden]{display:none}
#tour h3{margin:2px 0}#tour p{margin:4px 0 0}.tour-step{font-size:12px;color:var(--accent);font-weight:800}
#near{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:8px 8px 8px 16px;z-index:35;font-weight:700}
#walkpad{position:fixed;left:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;z-index:35;grid-template-areas:". up ." "left down right"}
#walkpad button{border-radius:14px;border:2px solid var(--edge);border-bottom-width:4px;background:var(--panel);font-size:20px;touch-action:none}
#walkpad [data-d=up]{grid-area:up}#walkpad [data-d=left]{grid-area:left}#walkpad [data-d=down]{grid-area:down}#walkpad [data-d=right]{grid-area:right}
#skip{position:fixed;right:16px;bottom:20px;z-index:50}
/* 遊戲 */
#game{position:fixed;inset:0;z-index:45;pointer-events:auto;touch-action:pan-y;user-select:none}
#game[hidden]{display:none}
#g-hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;flex-wrap:wrap}
#g-lives{color:#ff6b6b;font-size:24px;letter-spacing:2px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;box-shadow:var(--shadow)}
#g-prog{position:absolute;left:14px;right:14px;top:62px;height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}
#g-bar{height:100%;width:0;background:var(--accent);transition:width .4s}
#g-q{position:absolute;left:50%;top:78px;transform:translateX(-50%);width:min(760px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--edge);border-bottom-width:5px;border-radius:18px;padding:10px 16px}
#g-q p{margin:0;font-size:clamp(16px,2.4vw,21px);font-weight:800}.lv{font-size:12px;font-weight:800;color:var(--accent)}
#g-opts{position:absolute;left:0;right:0;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px;max-width:900px;margin:0 auto}
.gopt{min-height:64px;border-radius:14px;border:3px solid rgba(0,0,0,.35);border-bottom-width:6px;background:var(--c);color:#fff;text-align:left;padding:6px 10px;display:grid;gap:2px;font-size:clamp(13px,1.9vw,16px);font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.gopt b{font-size:12px;opacity:.9}.gopt[aria-pressed="true"]{outline:4px solid #fff;outline-offset:-1px;transform:translateY(-3px)}
.gopt:disabled{opacity:1;cursor:default}
#g-hint{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;color:var(--muted);margin:0;display:none}
.g-fb{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));border-radius:16px;padding:12px 16px;display:grid;gap:4px;border:3px solid;font-size:15px;background:var(--panel)}
.g-fb[hidden]{display:none}.g-fb.ok{border-color:#3fbf6a}.g-fb.bad{border-color:#e5584a}.g-fb b{font-size:18px}
#g-pause,#g-result,#modal{position:fixed;inset:0;background:rgba(8,14,20,.66);display:grid;place-items:center;z-index:60;padding:14px;overflow:auto}
#g-pause[hidden],#g-result[hidden],#modal[hidden]{display:none}
.modal-box{background:var(--panel);border:2px solid var(--edge);border-bottom-width:7px;border-radius:22px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto;color:var(--ink)}
.modal-box h2{margin:0 0 6px}
.stars{font-size:38px;letter-spacing:4px}
.wrong{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}.wrong li{background:var(--panel2);padding:8px 10px;border-radius:10px}
/* toast / loading */
#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:calc(100vw - 28px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:var(--bg);z-index:100;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
.spin{width:44px;height:44px;border-radius:12px;background:var(--primary);animation:sp 1s infinite ease-in-out;border-bottom:6px solid var(--primary-d)}
@keyframes sp{50%{transform:translateY(-14px) rotate(12deg)}}
.bagitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.bagitems div{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}.bagitems i{font-style:normal;font-size:30px;display:block}
body.reduced *,body.reduced *::before,body.reduced *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* 平板與手機 */
@media (max-width:900px){
  .brand p{display:none}.brand h1{font-size:14px}
  #tools{left:0;right:0;top:62px;flex-direction:row;overflow-x:auto;padding:4px 12px;gap:6px;scrollbar-width:none}
  #tools::-webkit-scrollbar{display:none}
  #tools button{flex:none;padding:0 12px 0 8px}
  #tools button:hover{transform:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:54vh;border-radius:22px 22px 0 0;border-bottom-width:2px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .grab{display:block;position:sticky;top:0;height:18px;background:var(--panel);z-index:2}
  .grab::after{content:"";position:absolute;left:50%;top:7px;width:44px;height:5px;border-radius:9px;background:var(--edge);transform:translateX(-50%)}
  #panel-body{padding-top:2px}
  #tour{bottom:10px}#near{bottom:136px}
  #g-q{top:72px}#g-hint{display:block}
  #toast{top:112px}
}
@media (max-width:820px){
  #tools button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}#tools button{padding:0 10px;position:relative}
  #tools button#t-theme span{position:static;width:auto;height:auto;clip:auto;font-size:12px}
}
@media (max-width:560px){
  .brand h1{font-size:13px;white-space:nowrap}.brand{max-width:55vw}.stats{flex-wrap:nowrap;gap:6px}.stats .pill{min-height:40px;font-size:11px}
  .islabel{white-space:normal;max-width:118px;line-height:1.2;padding:4px 10px;font-size:13px;text-align:center}
  #tools{top:58px}
  .stats .pill{font-size:12px;padding:0 10px}#clock{display:none}
  #top{padding:8px 10px}.brand{padding:4px 10px 4px 6px}.logo{width:34px;height:34px}
  #walkpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
  .gopt{min-height:76px;padding:6px 8px;font-size:13px}
}

body.in-game #top{display:none}
body.in-game #toast{top:120px}

.btn.lack{opacity:.55}
</style>
</head>
<body class="theme-night">
<canvas id="gl" aria-label="3D 島嶼地圖，可用下方「列表」改用文字瀏覽" tabindex="-1"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">G9</span><div><h1>阿豪自然的 G9_1_C3</h1><p>跑酷挑戰島 · 功與能</p></div></div>
  <div class="stats">
    <span id="prog" class="pill" title="探索與通關進度">探索 0/5 · 通關 0/3</span>
    <button id="bag-btn" class="pill btn-pill" type="button" aria-label="打開背包">💎 <b id="crys">0</b></button>
    <span id="clock" class="pill" aria-label="目前時間">--:--</span>
  </div>
</header>

<nav id="tools" aria-label="功能列">
  <button id="t-home" type="button"><i aria-hidden="true">🏝️</i><span>全景</span></button>
  <button id="t-list" type="button" aria-pressed="false"><i aria-hidden="true">📋</i><span>列表</span></button>
  <button id="t-tour" type="button"><i aria-hidden="true">🧭</i><span>導覽</span></button>
  <button id="t-walk" type="button" aria-pressed="false"><i aria-hidden="true">🚶</i><span>走路</span></button>
  <button id="t-theme" type="button"><i aria-hidden="true">🌗</i><span>主題：自動</span></button>
  <button id="t-music" type="button" aria-pressed="false"><i aria-hidden="true">🎵</i><span>音樂</span></button>
  <button id="t-motion" type="button" aria-pressed="false"><i aria-hidden="true">🐢</i><span>減少動態</span></button>
  <button id="t-help" type="button"><i aria-hidden="true">❓</i><span>說明</span></button>
</nav>

<aside id="panel" role="dialog" aria-labelledby="panel-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div id="panel-body"></div>
</aside>

<section id="listview" hidden aria-label="單元列表">
  <div class="list-inner">
    <div class="list-head"><h2 id="list-title">單元列表</h2><button id="list-close" type="button" class="x" aria-label="關閉列表">✕</button></div>
    <p id="list-note" class="muted"></p>
    <div id="list-cards"></div>
  </div>
</section>

<div id="tour" hidden role="region" aria-label="導覽">
  <div class="tour-step" id="tour-step"></div><h3 id="tour-title"></h3><p id="tour-text"></p>
  <div class="row"><button id="tour-prev" type="button" class="btn">上一步</button><button id="tour-next" type="button" class="btn primary">下一步</button><button id="tour-end" type="button" class="btn ghost">結束導覽</button></div>
</div>

<div id="near" hidden><span id="near-text"></span><button id="near-btn" type="button" class="btn primary">互動（E）</button></div>
<div id="walkpad" hidden aria-label="移動按鈕">
  <button type="button" data-d="up" aria-label="向上走">▲</button>
  <button type="button" data-d="left" aria-label="向左走">◀</button>
  <button type="button" data-d="down" aria-label="向下走">▼</button>
  <button type="button" data-d="right" aria-label="向右走">▶</button>
</div>
<button id="skip" type="button" class="btn ghost" hidden>略過開場 ⏭</button>

<div id="game" hidden>
  <div id="g-hud"><span id="g-lives" aria-label="剩餘生命">♥♥♥</span><span class="pill">第 <b id="gq-num">1 / 10</b> 題</span><span class="pill">分數 <b id="g-score">0</b></span><button id="g-pausebtn" type="button" class="pill btn-pill">⏸ 暫停</button></div>
  <div id="g-prog"><div id="g-bar"></div></div>
  <div id="g-q" role="status" aria-live="polite"><span class="lv" id="g-lv"></span><p id="gq-text"></p></div>
  <div id="g-fb" class="g-fb" hidden></div>
  <div id="g-opts">
    <button class="gopt" type="button" style="--c:#d9792f" aria-pressed="false"><b>① 左</b><span class="t"></span></button>
    <button class="gopt" type="button" style="--c:#2f9a86" aria-pressed="true"><b>② 中</b><span class="t"></span></button>
    <button class="gopt" type="button" style="--c:#7b5cc4" aria-pressed="false"><b>③ 右</b><span class="t"></span></button>
