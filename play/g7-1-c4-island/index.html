const KEY = 'isleforge-g7c4-v1';

function read() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
const saved = read();

const state = Object.assign({
  visited: {},      // { islandId: true }
  best: {},         // { 'island-01:easy': 分數 }
  passed: {},       // { 'island-01:easy': true }

  cards: {},        // { cardId: true } 已收集
  theme: 'auto',    // auto | 夜海 | 晨光 | 海霧
  timeMode: 'auto', // day | dusk | night | auto | realtime
  reduced: false,
  guideSeen: false

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
}

// 簡易事件
const subs = {};
function on(name, fn) { (subs[name] = subs[name] || []).push(fn); }
function emit(name, data) { (subs[name] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function prefersReduced() {
  return state.reduced || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function key(islandId, levelId) { return islandId + ':' + levelId; }

// 跑酷結果記錄：最佳成績、通過難度、⭐、已看過
function recordResult(island, level, res) {
  const k = key(island.id, level.id);
  state.visited[island.id] = true;
  if (!state.best[k] || res.score > state.best[k]) state.best[k] = res.score;
  let bonus = 0;
  if (res.passed && !state.passed[k]) { state.passed[k] = true; bonus = 3; }
  const gained = res.correct + bonus;
  state.stars += gained;
  save();
  emit('progress');
  return { gained, bonus };
}

// 用 ⭐ 跟居民交換知識卡
function trade(cardId, cost) {
  if (state.cards[cardId]) return 'have';
  if (state.stars < cost) return 'poor';
  state.stars -= cost;
  state.cards[cardId] = true;
  save();
  emit('progress');
  return 'ok';
}

    const len = va.distanceTo(vb);

      for (let k = 0; k <= 5; k++) grp.add(box(0.07, 0.55, 0.07, M('#7b5a3a'), x, 0.28, -len / 2 + k * len / 5));

  const hosts = ['island-03', 'island-04', 'island-01', 'island-02', 'center'];

    else { host.group.add(sp); animalAgents.push({ sp, kind: an.where, R: host.R, ph: r() * 6.28, spd: 0.25 + r() * 0.2, a0: r() * 6.28, ar: 0.6 + r() * 0.8, cx: (r() - 0.5) * host.R * 0.8, cz: (r() - 0.5) * host.R * 0.8 }); }

  /* ---------- 天空與海：雲、鳥、帆船、鯨魚 ---------- */
  const cloudMat = new THREE.MeshStandardMaterial({ color: '#ffffff', flatShading: true, roughness: 1, transparent: true, opacity: 0.92 });
  const clouds = [];
  const cr = rng(7);
  for (let k = 0; k < 11; k++) {

    scene.add(g); clouds.push({ g, v: 0.8 + cr() * 1.2 });

    const pl = new THREE.Group(), pr = new THREE.Group(); pl.add(wl); pr.add(wr); g.add(pl, pr, sph(0.12, M('#f2f2f2'), 0, 0, 0.05, 6, 5));
    scene.add(g); birds.push({ g, pl, pr, rad: 16 + (k % 4) * 6, y: 11 + (k % 3) * 2.5, ph: k * 0.9, spd: 0.18 + (k % 3) * 0.05, dir: k % 2 ? 1 : -1 });
  }

    const sail = cone(1.0, 2.2, 3, M('#ffffff', { side: THREE.DoubleSide }), 0.1, 1.5, 0); sail.scale.z = 0.12; g.add(sail);

  /* ---------- 螢火蟲 ---------- */

    const P = PLACE[k % PLACE.length], a = Math.random() * 6.28, d = Math.random() * P.R;

  /* ---------- 島名標籤（HTML 疊在畫面上） ---------- */
  const labelHost = document.getElementById('labels');
  const labels = {};
  function makeLabel(id) {
    const el = document.createElement('div');
    el.className = 'lbl' + (id === 'center' ? ' center' : '');
    const isl = C.islands.find(i => i.id === id);
    if (isl) el.style.setProperty('--c', isl.color);

  function refreshLabels() {
    PLACE.forEach(P => {
      const info = hooks.labelInfo(P.id), L = labels[P.id];
      const narrow = innerWidth <= 700;
      L.el.innerHTML = `${narrow && info.short ? info.short : info.title}<small>${info.sub}</small>`;
      L.w = L.el.offsetWidth || 120; L.h = L.el.offsetHeight || 38;
    });
  }
  const tv = new THREE.Vector3();
  function placeLabels() {
    const w = container.clientWidth, h = container.clientHeight, items = [];
    PLACE.forEach(P => {
      const n = worldNodes[P.id], L = labels[P.id];
      tv.set(n.group.position.x, n.group.position.y + (P.id === 'center' ? 8.2 : 6.6), n.group.position.z).project(camera);
      if (tv.z > 1 || tv.z < -1) { L.el.style.visibility = 'hidden'; return; }
      L.el.style.visibility = 'visible';
      items.push({ L, x: (tv.x * 0.5 + 0.5) * w, y: (-tv.y * 0.5 + 0.5) * h, z: tv.z });
    });
    // 避免互相重疊：由上往下排，重疊就往下推
    items.sort((a, b) => a.y - b.y);
    for (let i = 0; i < items.length; i++) for (let j = 0; j < i; j++) {
      const A = items[j], B = items[i];
      if (Math.abs(A.x - B.x) < (A.L.w + B.L.w) / 2 + 4 && Math.abs(A.y - B.y) < (A.L.h + B.L.h) / 2 + 2) B.y = A.y + (A.L.h + B.L.h) / 2 + 4;
    }
    items.forEach(o => { o.L.el.style.transform = `translate(${Math.round(o.x - o.L.w / 2)}px, ${Math.round(o.y - o.L.h)}px)`; o.L.el.style.zIndex = String(Math.round((1 - o.z) * 1000)); });
  }

  /* ---------- 日夜 ---------- */
  let curHour = 12, curN = 0;
  const cSky = new THREE.Color(), cTmp = new THREE.Color();
  let bgHex = '#16222e';
  function setHour(h) {
    curHour = h;
    const n = nightFactor(h), w = warmFactor(h);
    curN = n;
    sun.intensity = lerp(1.25, 0.32, n);
    cTmp.set('#ffffff'); sun.color.copy(cTmp).lerp(new THREE.Color('#ff9a5a'), w).lerp(new THREE.Color('#8fa8ff'), n);
    hemi.intensity = lerp(0.85, 0.38, n);
    hemi.color.set('#bfe3ff').lerp(new THREE.Color('#ffc99a'), w * 0.6).lerp(new THREE.Color('#5a6aa8'), n);
    const ang = clamp((h - 6) / 12, 0, 1) * Math.PI;
    const sp = new THREE.Vector3(Math.cos(ang) * -48, Math.sin(ang) * 40 + 8, 18);
    const hn = h < 6 ? h + 24 : h;
    const ang2 = clamp((hn - 18) / 12, 0, 1) * Math.PI;
    const mp = new THREE.Vector3(Math.cos(ang2) * -48, Math.sin(ang2) * 40 + 8, 18);
    if (n > 0.5) sun.position.copy(mp); else sun.position.copy(sp);
    sunBall.position.copy(sp).multiplyScalar(2.2); moonBall.position.copy(mp).multiplyScalar(2.2);
    sunBall.visible = n < 0.8 && h >= 5.5 && h <= 19; moonBall.visible = n > 0.3;
    cloudMat.color.set('#ffffff').lerp(new THREE.Color('#ffc9a0'), w * 0.6).lerp(new THREE.Color('#6a7694'), n);
    sea.material.color.set('#2b86b0').lerp(new THREE.Color('#e08a6a'), w * 0.25).lerp(new THREE.Color('#12324a'), n);
    glowMats.forEach(o => { o.m.emissiveIntensity = o.max * n; });
    pointLights.forEach(p => { p.intensity = 1.6 * n; });
    ffMat.opacity = clamp((n - 0.4) * 1.6, 0, 0.95);
  }
  function setBackground(hex) {
    bgHex = hex;
    scene.background.set(hex); scene.fog.color.set(hex);
  }

  /* ---------- 相機：總覽、飛近、開場運鏡 ---------- */
  let camAnim = null, cinema = null;
  function overview() {
    const aspect = container.clientWidth / Math.max(1, container.clientHeight);
    const D = Math.max(50, 27 / (0.466 * aspect));
    controls.maxDistance = Math.max(90, D * 1.3);
    return { pos: new THREE.Vector3(0, D * 0.5, D * 0.86), target: new THREE.Vector3(0, 1, 0) };
  }
  function startAnim(toPos, toTarget, dur, arc, done) {
    controls.enabled = false;
    camAnim = { t: 0, dur: motion ? dur : 0.01, fp: camera.position.clone(), ft: controls.target.clone(), tp: toPos, tt: toTarget, arc: motion ? arc : 0, done };
  }
  function stepAnim(dt) {
    const a = camAnim; a.t += dt;
    const k = clamp(a.t / a.dur, 0, 1), e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(a.fp, a.tp, e); camera.position.y += Math.sin(Math.PI * e) * a.arc;
    controls.target.lerpVectors(a.ft, a.tt, e);
    camera.lookAt(controls.target);
    if (k >= 1) { camAnim = null; controls.enabled = true; controls.update(); if (a.done) a.done(); }
  }
  function focus(id) {
    const n = worldNodes[id]; if (!n) return;
    const p = n.group.position;
    const dir = new THREE.Vector3(p.x, 0, p.z); if (dir.lengthSq() < 0.01) dir.set(0, 0, 1); dir.normalize();
    const dist = id === 'center' ? 19 : 14.5, up = id === 'center' ? 10 : 8;
    const toPos = new THREE.Vector3(p.x + dir.x * dist, p.y + up, p.z + dir.z * dist);
    const toTarget = new THREE.Vector3(p.x, p.y + 1.6, p.z);
    if (innerWidth <= 700) toTarget.y -= 4.2;                       // 手機：底部抽屜會擋住下半部，把島頂到上方
    else toTarget.add(new THREE.Vector3(dir.z, 0, -dir.x).multiplyScalar(3.4));   // 桌機：面板在右邊，把島推到左邊
    startAnim(toPos, toTarget, 2.0, 7);
  }
  function home() { const o = overview(); startAnim(o.pos, o.target, 1.6, 4); }

  function startCinema(onEnd) {
    controls.enabled = false;
    cinema = { t: 0, dur: motion ? 5.4 : 0.01, onEnd };
  }
  function stepCinema(dt) {
    const c = cinema; c.t += dt;
    const k = clamp(c.t / c.dur, 0, 1), e = k * k * (3 - 2 * k);
    const o = overview();
    const finalR = Math.hypot(o.pos.x, o.pos.z), finalH = o.pos.y;
    const dive = k < 0.62 ? lerp(1.9, 0.6, k / 0.62) : lerp(0.6, 1, (k - 0.62) / 0.38);   // 俯衝拉近再拉遠
    const R = finalR * dive;
    const H = lerp(finalH * 2.2, finalH * 0.9, e) * (k > 0.62 ? 1 : 1);
    const th = -Math.PI * (1 - e);                                                         // 環繞群島半圈
    camera.position.set(Math.sin(th) * R, H, Math.cos(th) * R);
    controls.target.set(0, 1 + (1 - e) * 4, 0);
    camera.lookAt(controls.target);
    if (k >= 1) { cinema = null; camera.position.copy(o.pos); controls.target.copy(o.target); controls.enabled = true; controls.update(); if (c.onEnd) c.onEnd(); }
  }
  function skipCinema() { if (cinema) cinema.t = cinema.dur; }
  function skipAnim() { if (camAnim) camAnim.t = camAnim.dur; }

  /* ---------- 點擊：居民優先，其次島 ---------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let down = null, talking = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; if (camAnim) skipAnim(); });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
    if (moved > 7 || dt > 600 || cinema) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    let hit = ray.intersectObjects(peopleGroups, true)[0];
    if (hit) {
      let o = hit.object; while (o && !(o.userData && o.userData.res)) o = o.parent;
      if (o) { talkTo(o); return; }
    }
    hit = ray.intersectObjects(pickIslands, true)[0];
    if (hit) {
      let o = hit.object; while (o && !(o.userData && o.userData.islandId)) o = o.parent;
      if (o) hooks.onPickIsland(o.userData.islandId);
    }
  });
  function talkTo(p) {
    const w = walkers.find(x => x.p === p); if (!w) return;
    if (talking) talking.talk = 0;
    talking = w; w.talk = 1;
    const wp = new THREE.Vector3(); p.getWorldPosition(wp); wp.y += 2.0;
    wp.project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    hooks.onPickResident(p.userData.res, p.userData.islandId, rect.left + (wp.x * 0.5 + 0.5) * rect.width, rect.top + (-wp.y * 0.5 + 0.5) * rect.height);
  }
  function endTalk() { if (talking) { talking.talk = 0; talking = null; } }

  /* ---------- 主迴圈 ---------- */
