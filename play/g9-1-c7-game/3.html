<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-3 日月地相對運動互動教學</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS 用於樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .stars-bg {
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        /* 動畫 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .wave-move {
            animation: waveMove 2s linear infinite;
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-20px); }
        }
        /* 字體縮放動畫 */
        .scale-pulse {
            animation: scalePulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes scalePulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white m-0 p-0 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 視圖 1: 月相變化 (修正地球光影 + 強化字體) ---
        function MoonPhaseView() {
            const [angle, setAngle] = useState(0); 
            const [day, setDay] = useState(1);

            useEffect(() => {
                let d = Math.round((angle / 360) * 30) + 1;
                if (d > 30) d = 1;
                setDay(d);
            }, [angle]);

            const getPhaseName = (ang) => {
                const normAng = ang % 360;
                // 朔: 345-15
                if (normAng > 345 || normAng < 15) return "朔 (新月)";
                // 眉月
                if (normAng >= 15 && normAng < 75) return "眉月";
                // 上弦: 75-105
                if (normAng >= 75 && normAng < 105) return "上弦月";
                // 盈凸月
                if (normAng >= 105 && normAng < 165) return "盈凸月";
                // 望: 165-195
                if (normAng >= 165 && normAng < 195) return "望 (滿月)";
                // 虧凸月
                if (normAng >= 195 && normAng < 255) return "虧凸月";
                // 下弦: 255-285
                if (normAng >= 255 && normAng < 285) return "下弦月";
                // 殘月
                return "殘月";
            };

            const phaseName = getPhaseName(angle).split(' ')[0];
            // 判斷是否為四大關鍵月相
            const isMajorPhase = ["朔", "上弦月", "望", "下弦月"].includes(phaseName);

            const orbitRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);

            const handleInteract = (e) => {
                if (!orbitRef.current) return;
                const rect = orbitRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const x = clientX - rect.left - centerX;
                const y = centerY - (clientY - rect.top);
                let rad = Math.atan2(-y, x); 
                let deg = rad * (180 / Math.PI);
                if (deg < 0) deg += 360;
                setAngle(deg);
            };

            const startDrag = (e) => { setIsDragging(true); handleInteract(e); };
            const onDrag = (e) => { if (isDragging) handleInteract(e); };
            const endDrag = () => { setIsDragging(false); };

            const renderMoonVisual = () => {
                const r = 40;
                const rad = angle * Math.PI / 180;
                const rx = r * Math.cos(rad);
                let moonColor = "#fbbf24"; 
                let shadowColor = "#1e293b";
                let baseRight = (angle > 0 && angle < 180) ? moonColor : shadowColor;
                let baseLeft = (angle > 180 && angle < 360) ? moonColor : shadowColor;
                let ellipseColor;
                if (angle >= 0 && angle < 90) ellipseColor = shadowColor;
                else if (angle >= 90 && angle < 270) ellipseColor = moonColor;
                else ellipseColor = shadowColor;

                return (
                    <g>
                        <path d={`M 50 10 A 40 40 0 0 0 50 90 Z`} fill={baseLeft} />
                        <path d={`M 50 10 A 40 40 0 0 1 50 90 Z`} fill={baseRight} />
                        <ellipse cx="50" cy="50" rx={Math.abs(rx)} ry="40" fill={ellipseColor} />
                    </g>
                );
            };

            const moonX = 150 + 100 * Math.cos(angle * Math.PI / 180);
            const moonY = 150 - 100 * Math.sin(angle * Math.PI / 180);

            return (
                <div className="flex flex-col items-center py-4 w-full max-w-6xl mx-auto fade-in"
                     onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                     onTouchMove={onDrag} onTouchEnd={endDrag}
                >
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-bold text-yellow-300">月相變化模擬器</h2>
                        <p className="text-slate-400 text-sm">農曆 <span className="font-bold text-white text-lg">初{day}</span></p>
                    </div>

                    <div className="flex flex-col md:flex-row items-center justify-around gap-8 w-full px-4">
                        <div className="flex flex-col items-center">
                            <div className="text-sm text-slate-400 mb-2 font-bold bg-slate-800 px-3 py-1 rounded-full border border-slate-600">
                                1. 太空俯視圖 (拖動月球)
                            </div>
                            <div className="relative select-none">
                                <svg 
                                    ref={orbitRef}
                                    width="320" height="320" viewBox="0 0 300 300" 
                                    className="cursor-pointer border border-slate-700 rounded-full bg-slate-800/50 shadow-2xl"
                                    onMouseDown={startDrag}
                                    onTouchStart={startDrag}
                                >
                                    <defs>
                                        <linearGradient id="sunLight" x1="1" y1="0" x2="0" y2="0">
                                            <stop offset="0%" stopColor="rgba(253, 224, 71, 0.4)" />
                                            <stop offset="100%" stopColor="transparent" />
                                        </linearGradient>
                                    </defs>
                                    <rect x="150" y="0" width="150" height="300" fill="url(#sunLight)" opacity="0.3" />
                                    <circle cx="150" cy="150" r="100" fill="none" stroke="#475569" strokeDasharray="4,4" />
                                    
                                    {/* 地球修正：右邊亮，左邊暗 */}
                                    {/* 本體(亮部) */}
                                    <circle cx="150" cy="150" r="20" fill="#2563eb" />
                                    {/* 陰影(暗部) - 使用 arc 畫出左半邊覆蓋黑色半透明 */}
                                    {/* M 150 130 (頂) -> A 20 20 0 0 0 150 170 (底, 逆時針畫左弧) */}
                                    <path d="M 150 130 A 20 20 0 0 0 150 170 Z" fill="black" fillOpacity="0.6" />
                                    
                                    <text x="150" y="154" fontSize="10" fill="white" textAnchor="middle" pointerEvents="none">地球</text>
                                    
                                    <g transform={`translate(${moonX}, ${moonY})`}>
                                        <circle r="10" fill="#94a3b8" />
                                        <path d="M 0 -10 A 10 10 0 0 0 0 10" fill="black" fillOpacity="0.8" />
                                        <path d="M 0 -10 A 10 10 0 0 1 0 10" fill="#fcd34d" />
                                        <text x="0" y="-15" fontSize="10" fill="#fcd34d" textAnchor="middle">月</text>
                                    </g>
                                    <text x="280" y="150" fontSize="24" fill="yellow" textAnchor="middle" dominantBaseline="middle">☀</text>
                                </svg>
                            </div>
                        </div>

                        <div className="flex flex-col items-center">
                            <div className="text-sm text-slate-400 mb-2 font-bold bg-slate-800 px-3 py-1 rounded-full border border-slate-600">
                                2. 地球觀察視角
                            </div>
                            <div className="flex flex-col items-center justify-center p-8 bg-slate-800 rounded-3xl border border-slate-600 w-64 h-64 shadow-2xl relative overflow-hidden">
                                <div className="absolute inset-0 stars-bg opacity-30"></div>
                                <svg width="120" height="120" viewBox="0 0 100 100" className="z-10 filter drop-shadow-[0_0_15px_rgba(251,191,36,0.3)]">
                                    {renderMoonVisual()}
                                </svg>
                                
                                {/* 月相名稱顯示 (加強版) */}
                                <div className="mt-4 text-center z-10 h-16 flex flex-col justify-center">
                                    <div className={`transition-all duration-300 ${
                                        isMajorPhase 
                                        ? "text-4xl font-extrabold text-red-400 scale-pulse drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" 
                                        : "text-2xl font-bold text-yellow-300"
                                    }`}>
                                        {phaseName}
                                    </div>
                                    <div className="text-xs text-slate-400 mt-1">
                                        {angle > 0 && angle < 180 ? "右亮 (西邊亮)" : angle > 180 ? "左亮 (東邊亮)" : "看不見 / 全亮"}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-8 w-full max-w-2xl px-4">
                        <input 
                            type="range" min="0" max="360" value={angle} 
                            onChange={(e) => setAngle(Number(e.target.value))}
                            className="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-400"
                        />
                    </div>
                </div>
            );
        }

        // --- 視圖 2: 日食與月食 ---
        function EclipseView() {
            const [mode, setMode] = useState('solar'); 

            return (
                <div className="flex flex-col items-center py-4 w-full max-w-6xl mx-auto fade-in">
                    <h2 className="text-2xl font-bold text-orange-300 mb-6">日食與月食原理</h2>
                    
                    <div className="flex gap-4 mb-6">
                        <button onClick={() => setMode('solar')} className={`px-6 py-2 rounded-full font-bold transition-all shadow-lg ${mode === 'solar' ? 'bg-yellow-500 text-slate-900 scale-105' : 'bg-slate-700 text-slate-400'}`}>日食 (Solar)</button>
                        <button onClick={() => setMode('lunar')} className={`px-6 py-2 rounded-full font-bold transition-all shadow-lg ${mode === 'lunar' ? 'bg-blue-600 text-white scale-105' : 'bg-slate-700 text-slate-400'}`}>月食 (Lunar)</button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full px-4">
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 p-1 overflow-hidden relative shadow-xl h-[400px]">
                            <div className="absolute top-3 left-4 z-10 bg-black/50 px-3 py-1 rounded text-xs text-yellow-300 font-bold border border-yellow-500/30">
                                動態模擬區
                            </div>
                            <div className="relative w-full h-full flex items-center justify-center overflow-hidden">
                                <div className="stars-bg absolute inset-0"></div>
                                <div className="absolute left-[-60px] w-40 h-40 bg-yellow-500 rounded-full blur-2xl opacity-40"></div>
                                <div className="absolute left-[-30px] w-24 h-24 bg-yellow-400 rounded-full shadow-lg z-10 flex items-center justify-center">
                                    <span className="text-yellow-900 font-bold ml-6">太陽</span>
                                </div>

                                <div className="relative flex items-center w-full h-full justify-center transform translate-x-8 scale-90">
                                    <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                                        {mode === 'solar' ? (
                                            <>
                                                <polygon points="120,200 600,170 600,230" fill="black" opacity="0.3" /> 
                                                <line x1="120" y1="200" x2="350" y2="200" stroke="black" strokeWidth="8" opacity="0.6" />
                                            </>
                                        ) : (
                                            <>
                                                <polygon points="200,200 600,140 600,260" fill="black" opacity="0.3" />
                                                <line x1="200" y1="200" x2="600" y2="200" stroke="black" strokeWidth="35" opacity="0.6" />
                                            </>
                                        )}
                                    </svg>

                                    {mode === 'solar' ? (
                                        <>
                                            <div className="absolute left-[100px] w-10 h-10 bg-slate-400 rounded-full z-20 shadow-lg flex flex-col items-center border border-slate-500">
                                                <div className="w-full h-full rounded-full bg-gradient-to-r from-yellow-100 to-black"></div>
                                                <span className="text-xs mt-1 text-slate-300 font-bold">月(朔)</span>
                                            </div>
                                            <div className="absolute left-[350px] w-20 h-20 bg-blue-600 rounded-full z-10 shadow-lg flex flex-col items-center">
                                                <div className="w-full h-full rounded-full bg-gradient-to-r from-blue-400 to-black overflow-hidden relative">
                                                    <div className="absolute top-1/2 left-0 w-2 h-2 bg-black rounded-full -translate-y-1/2 shadow-[0_0_5px_black]"></div>
                                                </div>
                                                <span className="text-xs mt-1 text-blue-200 font-bold">地球</span>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="absolute left-[180px] w-20 h-20 bg-blue-600 rounded-full z-20 shadow-lg flex flex-col items-center">
                                                <div className="w-full h-full rounded-full bg-gradient-to-r from-blue-400 to-black"></div>
                                                <span className="text-xs mt-1 text-blue-200 font-bold">地球</span>
                                            </div>
                                            <div className="absolute left-[450px] w-10 h-10 bg-red-800 rounded-full z-10 shadow-lg flex flex-col items-center border border-red-900">
                                                <div className="w-full h-full rounded-full bg-gradient-to-r from-black to-red-600"></div>
                                                <span className="text-xs mt-1 text-red-300 font-bold">月(望)</span>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-300 p-6 shadow-xl h-[400px] flex flex-col items-center justify-center text-slate-800">
                            <div className="text-lg font-bold mb-4 text-slate-700 w-full text-center border-b pb-2">
                                {mode === 'solar' ? '日食成因示意圖' : '月食成因示意圖'}
                            </div>
                            
                            <svg viewBox="0 0 400 250" className="w-full h-full">
                                <defs>
                                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                                        <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
                                    </marker>
                                </defs>

                                <circle cx="40" cy="125" r="30" fill="#fbbf24" stroke="#f59e0b" strokeWidth="2"/>
                                <text x="40" y="125" textAnchor="middle" dy="5" fontSize="12" fontWeight="bold" fill="#78350f">太陽</text>

                                {mode === 'solar' ? (
                                    <>
                                        <circle cx="180" cy="125" r="10" fill="#94a3b8" stroke="#475569"/>
                                        <text x="180" y="110" textAnchor="middle" fontSize="10" fill="#475569">月球</text>
                                        <circle cx="320" cy="125" r="20" fill="#3b82f6" stroke="#1d4ed8"/>
                                        <text x="320" y="160" textAnchor="middle" fontSize="10" fill="#1e3a8a">地球</text>
                                        <path d="M 40 95 L 180 115 L 300 125 L 180 135 L 40 155 Z" fill="none" stroke="transparent"/>
                                        <polygon points="180,115 300,125 180,135" fill="#1f2937" opacity="0.8"/>
                                        <path d="M 40 95 L 180 135 L 360 180 L 360 70 L 180 115 Z" fill="#9ca3af" opacity="0.2"/>
                                        <line x1="40" y1="95" x2="360" y2="180" stroke="#f59e0b" strokeWidth="1" strokeDasharray="4,2"/>
                                        <line x1="40" y1="155" x2="360" y2="70" stroke="#f59e0b" strokeWidth="1" strokeDasharray="4,2"/>
                                        <text x="260" y="128" fontSize="10" fill="black" fontWeight="bold">本影區(全食)</text>
                                        <text x="340" y="80" fontSize="10" fill="gray">半影區(偏食)</text>
                                    </>
                                ) : (
                                    <>
                                        <circle cx="200" cy="125" r="20" fill="#3b82f6" stroke="#1d4ed8"/>
                                        <text x="200" y="100" textAnchor="middle" fontSize="10" fill="#1e3a8a">地球</text>
                                        <circle cx="350" cy="125" r="10" fill="#b91c1c" stroke="#7f1d1d"/>
                                        <text x="350" y="110" textAnchor="middle" fontSize="10" fill="#7f1d1d">月球</text>
                                        <polygon points="200,105 380,115 380,135 200,145" fill="#1f2937" opacity="0.6"/>
                                        <path d="M 40 95 L 200 145 L 380 200 L 380 50 L 200 105 Z" fill="#9ca3af" opacity="0.2"/>
                                        <line x1="40" y1="95" x2="380" y2="200" stroke="#f59e0b" strokeWidth="1" strokeDasharray="4,2"/>
                                        <line x1="40" y1="155" x2="380" y2="50" stroke="#f59e0b" strokeWidth="1" strokeDasharray="4,2"/>
                                        <text x="280" y="128" fontSize="10" fill="white" fontWeight="bold">地球本影</text>
                                    </>
                                )}
                            </svg>
                            <p className="text-xs text-slate-500 mt-2 bg-slate-100 p-2 rounded w-full">
                                {mode === 'solar' 
                                    ? "當月球運行至日地之間，月球本影落在地球表面，該區可見日全食。" 
                                    : "當月球進入地球本影區，陽光被遮擋，但大氣折射紅光使月球呈暗紅色。"}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 視圖 3: 潮汐 (名詞互動 + 海岸實景圖解 + 格狀選單) ---
        function TideView() {
            const [selectedTerm, setSelectedTerm] = useState('full');

            const termData = {
                'full': { 
                    title: "滿潮 (High Tide)", 
                    desc: "海水水位上升到最高點的時刻，海灘被淹沒。",
                    waterLevel: 100
                },
                'dry': { 
                    title: "乾潮 (Low Tide)", 
                    desc: "海水水位下降到最低點的時刻，露出大片海灘。",
                    waterLevel: 0
                },
                'flood': { 
                    title: "漲潮 (Flood)", 
                    desc: "海水水位正在上升的過程，海浪湧向陸地。",
                    waterLevel: 50,
                    flow: 'in'
                },
                'ebb': { 
                    title: "退潮 (Ebb)", 
                    desc: "海水水位正在下降的過程，海水退向海洋。",
                    waterLevel: 50,
                    flow: 'out'
                },
                'range': { 
                    title: "潮差 (Tidal Range)", 
                    desc: "滿潮線與乾潮線之間的高度差。",
                    waterLevel: 100,
                    showRange: true
                },
                'zone': { 
                    title: "潮間帶 (Intertidal Zone)", 
                    desc: "介於滿潮線與乾潮線之間的區域，孕育豐富生態。",
                    waterLevel: 50,
                    showZone: true
                }
            };

            const currentData = termData[selectedTerm];

            // 繪製右側海岸實景示意圖
            const renderExplanationGraphic = () => {
                const isHigh = currentData.waterLevel === 100;
                const isLow = currentData.waterLevel === 0;
                const isMid = currentData.waterLevel === 50;
                
                let seaHeight = 100; 
                if (isHigh) seaHeight = 60; 
                if (isLow) seaHeight = 160; 

                return (
                    <svg viewBox="0 0 250 180" className="w-full h-full rounded-xl overflow-hidden">
                        <defs>
                            <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#bae6fd" />
                                <stop offset="100%" stopColor="#f0f9ff" />
                            </linearGradient>
                            <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#3b82f6" />
                                <stop offset="100%" stopColor="#1d4ed8" />
                            </linearGradient>
                             <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8" />
                            </marker>
                             <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
                            </marker>
                        </defs>
                        
                        <rect x="0" y="0" width="250" height="180" fill="url(#skyGradient)" />
                        <circle cx="200" cy="30" r="15" fill="#fbbf24" opacity="0.8" />
                        
                        <path d="M 0 100 L 50 80 L 100 95 L 150 70 L 250 90 L 250 180 L 0 180 Z" fill="#64748b" opacity="0.5" />

                        <path d="M 0 180 L 250 180 L 250 100 Q 150 120 0 140 Z" fill="#d6d3d1" /> 
                        <path d="M 0 180 L 120 180 L 120 120 L 0 130 Z" fill="#78716c" /> 
                        
                        {currentData.showZone && (
                            <path d="M 120 130 Q 180 145 250 135 L 250 165 Q 180 175 120 165 Z" fill="#facc15" opacity="0.5" className="animate-pulse" />
                        )}

                        <rect x="100" y="80" width="15" height="100" fill="#78350f" />
                        <line x1="100" y1="110" x2="115" y2="110" stroke="#fbbf24" strokeWidth="2" opacity="0.7" /> 
                        <line x1="100" y1="160" x2="115" y2="160" stroke="#fbbf24" strokeWidth="2" opacity="0.7" /> 

                        <path d={`M 0 180 L 250 180 L 250 ${seaHeight} Q 125 ${seaHeight+10} 0 ${seaHeight} Z`} fill="url(#seaGradient)" opacity="0.8" className="transition-all duration-1000" />
                        
                        <path d={`M 0 ${seaHeight+5} Q 20 ${seaHeight} 40 ${seaHeight+5} T 80 ${seaHeight+5} T 120 ${seaHeight+5} T 160 ${seaHeight+5} T 200 ${seaHeight+5} T 240 ${seaHeight+5}`} stroke="white" fill="none" opacity="0.3" className={isMid ? "wave-move" : ""}/>

                        {isHigh && (
                            <text x="180" y="50" className="text-sm font-bold" fill="#1e40af">滿潮 (淹沒)</text>
                        )}
                        {isLow && (
                             <g>
                                <text x="180" y="50" className="text-sm font-bold" fill="#1e40af">乾潮 (露出)</text>
                                <text x="150" y="155" fontSize="14">🦀</text>
                                <text x="200" y="145" fontSize="14">🐚</text>
                                <text x="130" y="170" fontSize="14">⭐</text>
                            </g>
                        )}
                        {currentData.flow === 'in' && (
                            <g>
                                <line x1="180" y1="140" x2="80" y2="120" stroke="#1d4ed8" strokeWidth="4" markerEnd="url(#arrowBlue)" />
                                <text x="130" y="110" className="text-sm font-bold" fill="#1d4ed8">漲潮 (湧入)</text>
                            </g>
                        )}
                        {currentData.flow === 'out' && (
                            <g>
                                <line x1="80" y1="120" x2="180" y2="140" stroke="#1d4ed8" strokeWidth="4" markerEnd="url(#arrowBlue)" />
                                <text x="130" y="110" className="text-sm font-bold" fill="#1d4ed8">退潮 (退去)</text>
                            </g>
                        )}
                        {currentData.showRange && (
                             <g>
                                <line x1="85" y1="110" x2="85" y2="160" stroke="#ef4444" strokeWidth="3" markerEnd="url(#arrowRed)" markerStart="url(#arrowRed)"/>
                                <text x="75" y="135" textAnchor="end" className="text-sm font-bold" fill="#ef4444" dominantBaseline="middle">潮差</text>
                                <line x1="90" y1="110" x2="120" y2="110" stroke="#ef4444" strokeDasharray="2,2" opacity="0.5"/>
                                <line x1="90" y1="160" x2="120" y2="160" stroke="#ef4444" strokeDasharray="2,2" opacity="0.5"/>
                            </g>
                        )}
                         {currentData.showZone && (
                            <text x="180" y="150" className="text-sm font-bold" fill="#854d0e" textAnchor="middle">潮間帶區域</text>
                        )}

                    </svg>
                );
            };

            return (
                <div className="flex flex-col items-center py-4 w-full max-w-5xl mx-auto fade-in">
                    <h2 className="text-2xl font-bold text-blue-300 mb-6">潮汐名詞互動圖解</h2>

                    <div className="flex flex-col md:flex-row gap-6 w-full">
                        <div className="w-full md:w-1/2">
                            <div className="text-xs text-slate-400 font-bold uppercase mb-2">請選擇潮汐名詞</div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                {Object.keys(termData).map(key => (
                                    <button
                                        key={key}
                                        onClick={() => setSelectedTerm(key)}
                                        className={`p-4 rounded-xl text-center font-bold transition-all border shadow-md flex flex-col items-center justify-center gap-1 ${
                                            selectedTerm === key 
                                            ? 'bg-blue-600 border-blue-400 text-white scale-105 ring-2 ring-blue-400/50' 
                                            : 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-slate-500'
                                        }`}
                                    >
                                        <span className="text-lg">{termData[key].title.split(' ')[0]}</span>
                                        <span className="text-[10px] opacity-70 font-normal">{termData[key].title.split('(')[1].replace(')', '')}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="w-full md:w-1/2 bg-slate-800 p-5 rounded-2xl border border-slate-600 flex gap-4">
                            <div className="w-1/2 bg-slate-900/50 rounded-xl overflow-hidden border border-slate-700/50 relative min-h-[160px]">
                                {renderExplanationGraphic()}
                            </div>
                            
                            <div className="w-1/2 flex flex-col justify-center">
                                <h3 className="text-xl font-bold text-blue-300 mb-2">{currentData.title}</h3>
                                <p className="text-sm text-white leading-relaxed">{currentData.desc}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 主程式 ---
        function App() {
            const [activeTab, setActiveTab] = useState('phases');

            return (
                <div className="min-h-screen bg-slate-900 pb-12 overflow-x-hidden font-sans">
                    <nav className="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-lg tracking-wider text-white">
                                <span className="text-yellow-400 text-2xl">🌑</span> 7-3 日月地相對運動
                            </div>
                            <div className="flex gap-1 bg-slate-900/50 p-1 rounded-lg">
                                <button onClick={() => setActiveTab('phases')} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'phases' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>月相變化</button>
                                <button onClick={() => setActiveTab('eclipse')} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'eclipse' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>日食月食</button>
                                <button onClick={() => setActiveTab('tides')} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'tides' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>潮汐現象</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        {activeTab === 'phases' && <MoonPhaseView />}
                        {activeTab === 'eclipse' && <EclipseView />}
                        {activeTab === 'tides' && <TideView />}
                    </main>

                    <footer className="text-center text-slate-600 text-xs mt-8 pb-8">
                        113學年度 國三地科 | 配合 7-3 課程內容
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
