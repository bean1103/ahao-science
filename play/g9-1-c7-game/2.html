<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-2 晝夜與四季互動教學</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS 用於樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .stars-bg {
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
        }
        /* 隱藏捲軸 */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        /* 閃爍動畫 */
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white m-0 p-0 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示組件 ---
        const SunIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <circle cx="12" cy="12" r="6" className="text-yellow-400" />
                <path stroke="currentColor" strokeWidth="2" strokeLinecap="round" d="M12 2v2m0 16v2m4.93-17.07l-1.41 1.41m-9.9 9.9l-1.41 1.41m17.66-10.61l-1.41-1.41m-9.9 9.9l-1.41-1.41M2 12h2m16 0h2m-17.07 4.93l1.41-1.41m9.9-9.9l1.41-1.41" className="text-yellow-500"/>
            </svg>
        );

        // --- 視圖 1: 晝夜與自轉 ---
        function RotationView() {
            return (
                <div className="flex flex-col items-center justify-center min-h-[60vh] relative p-4 animate-in fade-in duration-700">
                    <div className="text-center mb-8">
                        <h2 className="text-2xl md:text-3xl font-bold text-yellow-300 mb-2">地球自轉與晝夜</h2>
                        <p className="text-slate-400">地球由<span className="text-white font-bold">西向東</span>自轉，產生晝夜交替</p>
                    </div>

                    <div className="flex flex-col md:flex-row items-center justify-center gap-12 w-full max-w-4xl">
                        {/* 太陽 */}
                        <div className="flex flex-col items-center">
                            <div className="w-24 h-24 bg-yellow-500 rounded-full shadow-[0_0_50px_rgba(253,224,71,0.6)] flex items-center justify-center animate-pulse">
                                <span className="text-yellow-900 font-bold text-xl">太陽</span>
                            </div>
                            <div className="mt-4 flex gap-1">
                                {[...Array(3)].map((_, i) => (
                                    <div key={i} className="w-16 h-1 bg-yellow-400/50 rounded-full animate-pulse" style={{animationDelay: i*0.2+'s'}}></div>
                                ))}
                            </div>
                            <span className="text-yellow-400 text-sm mt-1">陽光直射</span>
                        </div>

                        {/* 地球 */}
                        <div className="relative w-64 h-64 rounded-full overflow-hidden shadow-2xl border-2 border-slate-700">
                            {/* 地球貼圖模擬 */}
                            <div className="absolute inset-0 bg-blue-600 rounded-full" 
                                 style={{
                                     background: 'conic-gradient(from 0deg, #1d4ed8, #15803d, #1d4ed8, #0ea5e9, #15803d, #1d4ed8)',
                                     filter: 'blur(1px)'
                                 }}>
                            </div>
                             {/* 自轉軸 */}
                             <div className="absolute top-[-20px] left-[50%] w-1 h-[300px] bg-slate-400 -translate-x-1/2 rotate-[23.5deg] z-20 opacity-50"></div>
                             
                             {/* 陰影遮罩 */}
                             <div className="absolute inset-0 bg-gradient-to-l from-black/90 via-black/50 to-transparent z-10 pointer-events-none"></div>

                             <div className="absolute left-8 top-1/2 -translate-y-1/2 z-20 font-bold text-white drop-shadow-md">晝 (Day)</div>
                             <div className="absolute right-8 top-1/2 -translate-y-1/2 z-20 font-bold text-slate-400 drop-shadow-md">夜 (Night)</div>

                             <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-48 h-12 border-t-4 border-white/30 rounded-[50%] rotate-[10deg] z-10"></div>
                             <div className="absolute top-[28%] right-[20%] text-white/50 text-xs">西 ➞ 東</div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 視圖 2: 四季與公轉 ---
        function RevolutionView() {
            const [angle, setAngle] = useState(180); // 預設在左邊 (夏至)
            const [isDragging, setIsDragging] = useState(false);
            const orbitRef = useRef(null);

            const getSeasonInfo = (ang) => {
                let normalizedAngle = ang % 360;
                if (normalizedAngle < 0) normalizedAngle += 360;

                if (normalizedAngle >= 150 && normalizedAngle <= 210) {
                    return { 
                        name: "夏至", 
                        date: "6/22 前後", 
                        direct: "北回歸線 (23.5°N)", 
                        desc: "北半球晝最長，太陽直射北回歸線。",
                        type: "summer"
                    };
                } else if (normalizedAngle >= 330 || normalizedAngle <= 30) {
                    return { 
                        name: "冬至", 
                        date: "12/22 前後", 
                        direct: "南回歸線 (23.5°S)", 
                        desc: "北半球晝最短，太陽直射南回歸線。",
                        type: "winter"
                    };
                } else if (normalizedAngle >= 60 && normalizedAngle <= 120) {
                     return { 
                        name: "春分", 
                        date: "3/21 前後", 
                        direct: "赤道 (0°)", 
                        desc: "全球晝夜等長，太陽直射赤道。",
                        type: "spring"
                    };
                } else if (normalizedAngle >= 240 && normalizedAngle <= 300) {
                     return { 
                        name: "秋分", 
                        date: "9/23 前後", 
                        direct: "赤道 (0°)", 
                        desc: "全球晝夜等長，太陽直射赤道。",
                        type: "autumn"
                    };
                } else {
                    return { 
                        name: "季節轉換中", 
                        date: "--", 
                        direct: "移動中...", 
                        desc: "拖動地球到四個頂點(上、下、左、右)觀察特定節氣。",
                        type: "transition"
                    };
                }
            };

            const seasonInfo = getSeasonInfo(angle);

            const handleInteract = (e) => {
                if (!orbitRef.current) return;
                const rect = orbitRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const x = clientX - rect.left - centerX;
                const y = centerY - (clientY - rect.top); 
                let rad = Math.atan2(y, x); 
                let deg = rad * (180 / Math.PI);
                if (deg < 0) deg += 360;
                setAngle(deg);
            };

            const startDrag = (e) => { setIsDragging(true); handleInteract(e); };
            const onDrag = (e) => { if (isDragging) handleInteract(e); };
            const endDrag = () => { setIsDragging(false); };

            const orbitRadius = 120;
            const earthX = 150 + orbitRadius * Math.cos(angle * Math.PI / 180);
            const earthY = 150 - orbitRadius * Math.sin(angle * Math.PI / 180);

            return (
                <div className="flex flex-col items-center py-6 w-full max-w-4xl mx-auto"
                     onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                     onTouchMove={onDrag} onTouchEnd={endDrag}
                >
                    <h2 className="text-2xl font-bold text-orange-300 mb-2">四季與公轉模擬器</h2>
                    <p className="text-slate-400 mb-6 text-sm text-center">
                        <span className="inline-block border border-slate-500 rounded px-2 py-1 mx-1 bg-slate-800">
                            ✋ 拖動地球
                        </span>
                        觀察<span className="text-yellow-300">直射光</span>照射在回歸線的變化
                    </p>

                    <div className="flex flex-col md:flex-row items-center justify-center gap-8 w-full">
                        <div className="relative select-none">
                            <svg 
                                ref={orbitRef}
                                width="300" height="300" viewBox="0 0 300 300" 
                                className="cursor-pointer"
                                onMouseDown={startDrag}
                                onTouchStart={startDrag}
                            >
                                {/* 軌道背景 */}
                                <circle cx="150" cy="150" r="120" fill="none" stroke="#475569" strokeWidth="2" strokeDasharray="5,5" />
                                
                                {/* 四季標記 (強化字體與背景) */}
                                <g transform="translate(280, 155)">
                                    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="#1e293b" opacity="0.8" />
                                    <text fill="#60a5fa" fontSize="16" fontWeight="900" textAnchor="middle" dy="5">冬至</text>
                                </g>
                                <g transform="translate(20, 155)">
                                    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="#1e293b" opacity="0.8" />
                                    <text fill="#f87171" fontSize="16" fontWeight="900" textAnchor="middle" dy="5">夏至</text>
                                </g>
                                <text x="150" y="20" fill="#94a3b8" fontSize="12" textAnchor="middle">春分</text>
                                <text x="150" y="290" fill="#94a3b8" fontSize="12" textAnchor="middle">秋分</text>

                                {/* 太陽 */}
                                <circle cx="150" cy="150" r="20" fill="#fbbf24" className="filter drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]" />
                                <text x="150" y="154" fill="#78350f" fontSize="10" fontWeight="bold" textAnchor="middle" alignmentBaseline="middle">太陽</text>

                                {/* 直射光束 */}
                                <line 
                                    x1="150" y1="150" 
                                    x2={earthX} y2={earthY} 
                                    stroke="#facc15" 
                                    strokeWidth="3" 
                                    strokeOpacity="0.8"
                                    strokeDasharray="2,2"
                                />

                                {/* 地球群組 */}
                                <g transform={`translate(${earthX}, ${earthY})`}>
                                    {/* 傾斜群組 (地軸、回歸線) */}
                                    <g transform="rotate(23.5)">
                                        {/* 地球本體 */}
                                        <circle r="15" fill="#2563eb" stroke="white" strokeWidth="1" />
                                        
                                        {/* 地軸 N-S */}
                                        <line x1="0" y1="-22" x2="0" y2="22" stroke="#cbd5e1" strokeWidth="2" />
                                        <text x="-2" y="-24" fontSize="8" fill="white" className="select-none">N</text>
                                        
                                        {/* 赤道 (白色虛線) */}
                                        <line x1="-15" y1="0" x2="15" y2="0" stroke="white" strokeWidth="1" strokeOpacity="0.8" strokeDasharray="2,1" />
                                        
                                        {/* 北回歸線 (紅色實線，約 y=-6) */}
                                        <line x1="-13.7" y1="-6" x2="13.7" y2="-6" stroke="#f87171" strokeWidth="1" strokeOpacity="0.9" />
                                        
                                        {/* 南迴歸線 (紅色實線，約 y=+6) */}
                                        <line x1="-13.7" y1="6" x2="13.7" y2="6" stroke="#f87171" strokeWidth="1" strokeOpacity="0.9" />
                                    </g>

                                    {/* 陰影 (保持背光) */}
                                    <g transform={`rotate(${180 - angle})`}>
                                        <path d="M0,-15 A15,15 0 0,1 0,15" fill="black" fillOpacity="0.6" />
                                    </g>
                                </g>

                                {/* 互動提示圈 */}
                                {isDragging && (
                                    <circle cx="150" cy="150" r={orbitRadius} fill="none" stroke="white" strokeOpacity="0.2" strokeWidth="20" />
                                )}
                            </svg>
                        </div>

                        {/* 資訊卡 */}
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-600 w-full max-w-sm shadow-xl relative overflow-hidden min-h-[200px]">
                            <div className={`absolute top-0 right-0 w-24 h-24 rounded-bl-full opacity-20 transition-colors duration-500 
                                ${seasonInfo.type === 'summer' ? 'bg-red-500' : 
                                  seasonInfo.type === 'winter' ? 'bg-blue-500' : 
                                  seasonInfo.type === 'transition' ? 'bg-slate-500' : 'bg-green-500'}`}>
                            </div>

                            <div className="relative z-10">
                                <div className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Current Season</div>
                                <h3 className={`text-3xl font-bold mb-4 ${
                                    seasonInfo.type === 'summer' ? 'text-red-400' : 
                                    seasonInfo.type === 'winter' ? 'text-blue-300' : 
                                    seasonInfo.type === 'transition' ? 'text-slate-300' : 'text-green-400'
                                }`}>
                                    {seasonInfo.name}
                                </h3>
                                
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-slate-700 p-2 rounded text-yellow-400">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
                                        </div>
                                        <div>
                                            <div className="text-xs text-slate-400">太陽直射點</div>
                                            <div className="font-bold">{seasonInfo.direct}</div>
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-slate-700 text-sm text-slate-300 leading-relaxed">
                                        {seasonInfo.desc}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 視圖 3: 影子與太陽高度角 (修正版) ---
        function ShadowView() {
            const [sliderVal, setSliderVal] = useState(50); 
            
            // 計算太陽仰角
            // 北回歸線(23.5N): 夏至直射(90度), 冬至直射23.5S (差47度 -> 43度)
            const angle = 43 + (sliderVal / 100) * 47; 
            
            // 計算影子長度 (90度時 tan 為無限大，長度為 0)
            let shadowLength = 0;
            if (angle < 89.5) {
                shadowLength = 100 / Math.tan(angle * Math.PI / 180);
            }
            
            const getSeasonText = () => {
                if (sliderVal > 90) return "夏至 (Summer)";
                if (sliderVal < 10) return "冬至 (Winter)";
                return "季節變化中...";
            };

            return (
                <div className="flex flex-col items-center justify-center py-6 animate-in fade-in duration-700">
                    <h2 className="text-2xl font-bold text-yellow-300 mb-2">竿影與太陽高度角</h2>
                    <p className="text-slate-400 mb-2 text-sm text-center">
                        <span className="bg-indigo-900 px-2 py-1 rounded text-blue-200 border border-indigo-500 mr-2">觀測地點</span>
                        <span className="font-bold text-white">北回歸線 (嘉義/花蓮)</span>
                    </p>
                    <p className="text-slate-500 mb-8 text-xs text-center">每天正午，夏至太陽在正頭頂 (90度)</p>

                    {/* 視覺化區域 */}
                    <div className="relative w-full max-w-lg h-64 bg-slate-800 rounded-t-3xl border-b-4 border-green-600 overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-blue-900 to-blue-500/30"></div>
                        <div className="absolute bottom-0 left-1/2 w-[300px] h-[300px] border-t-2 border-l-2 border-yellow-500/20 rounded-full -translate-x-1/2 pointer-events-none border-dashed"></div>

                        {/* 太陽 */}
                        {/* 修正：90度時在正上方(rotate -90)，0度時在右方(rotate 0) */}
                        <div 
                            className="absolute w-12 h-12 bg-yellow-400 rounded-full shadow-[0_0_30px_rgba(250,204,21,0.8)] flex items-center justify-center transition-all duration-300"
                            style={{
                                bottom: '10px',
                                left: '50%',
                                transform: `rotate(${-angle}deg) translateX(140px) rotate(${angle}deg)`
                            }}
                        >
                            <SunIcon className="w-8 h-8 text-yellow-800" />
                        </div>

                        {/* 人/竿子 */}
                        <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-2 h-24 bg-slate-300 rounded-t-lg z-10"></div>
                        
                        {/* 影子 */}
                        {/* 修正：影子長度在 90 度時為 0 */}
                        <div 
                            className="absolute bottom-0 left-1/2 bg-black/50 h-2 origin-left rounded-r-full transition-all duration-300"
                            style={{ 
                                width: `${shadowLength * 2}px`, 
                                transform: 'scaleX(-1)' // 向左投射(北方)
                            }} 
                        ></div>

                        <div className="absolute bottom-2 left-4 text-xs text-slate-400">北方 (North)</div>
                        <div className="absolute bottom-2 right-4 text-xs text-slate-400">南方 (South)</div>
                    </div>

                    <div className="w-full max-w-lg bg-slate-700 p-4 rounded-b-2xl mb-8 flex justify-between items-center text-sm">
                        <div>
                            <span className="text-slate-400">正午太陽仰角：</span>
                            <span className="text-yellow-300 font-bold text-lg">{angle.toFixed(1)}°</span>
                        </div>
                        <div>
                            <span className="text-slate-400">影子長度：</span>
                            <span className="text-white font-bold text-lg">
                                {angle > 89 ? "無影子 (No Shadow)" : sliderVal < 5 ? "最長 (Longest)" : "變化中"}
                            </span>
                        </div>
                    </div>

                    <div className="w-full max-w-md px-4">
                        <div className="flex justify-between text-xs text-blue-300 mb-2 font-bold">
                            <span>冬至 (12/22)</span>
                            <span>春秋分</span>
                            <span>夏至 (6/22)</span>
                        </div>
                        <input 
                            type="range" 
                            min="0" 
                            max="100" 
                            value={sliderVal} 
                            onChange={(e) => setSliderVal(Number(e.target.value))}
                            className="w-full h-3 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-yellow-400"
                        />
                        <div className="text-center mt-4 text-xl font-bold text-white">
                            目前季節：{getSeasonText()}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('rotation');

            return (
                <div className="min-h-screen bg-slate-900 pb-12 overflow-x-hidden">
                    {/* 導航列 */}
                    <nav className="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-lg tracking-wider text-white">
                                <span className="text-yellow-400 text-2xl">🌍</span> 7-2 晝夜與四季
                            </div>
                            <div className="flex gap-1 bg-slate-900/50 p-1 rounded-lg">
                                <button onClick={() => setActiveTab('rotation')} className={`px-2 py-1.5 md:px-3 rounded-md text-xs md:text-sm font-medium transition-all ${activeTab === 'rotation' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>地球自轉</button>
                                <button onClick={() => setActiveTab('revolution')} className={`px-2 py-1.5 md:px-3 rounded-md text-xs md:text-sm font-medium transition-all ${activeTab === 'revolution' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>四季公轉</button>
                                <button onClick={() => setActiveTab('shadow')} className={`px-2 py-1.5 md:px-3 rounded-md text-xs md:text-sm font-medium transition-all ${activeTab === 'shadow' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>竿影變化</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 animate-in fade-in duration-500">
                        {activeTab === 'rotation' && <RotationView />}
                        {activeTab === 'revolution' && <RevolutionView />}
                        {activeTab === 'shadow' && <ShadowView />}
                    </main>

                    <footer className="text-center text-slate-600 text-xs mt-8">
                        113學年度 國三地科 | 配合 7-2 課程內容
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
