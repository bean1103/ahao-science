<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心智圖魔法放大鏡</title>
<style>
  body { margin: 0; padding: 0; background: #f0f4f8; overflow: hidden; font-family: 'Microsoft JhengHei', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
  
  #game-area {
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 100vh; /* 使用視窗高度 */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: none; /* 隱藏預設滑鼠 */
  }

  #bg-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
  }

  /* 隱藏的答案 */
  .hidden-answer {
    position: absolute;
    transform: translate(-50%, -50%);
    color: #d63031;
    font-weight: 900;
    font-size: 1.2rem;
    white-space: nowrap;
    opacity: 0; /* 預設完全透明 */
    transition: opacity 0.2s ease;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.8);
    padding: 2px 8px;
    border-radius: 10px;
    z-index: 50;
    text-shadow: 1px 1px 0 #fff;
  }

  /* 放大鏡 (跟隨滑鼠) */
  #magnifier {
    position: fixed;
    width: 120px;
    height: 120px;
    border: 4px solid #0984e3;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 15px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.5);
    pointer-events: none; /* 讓點擊穿透 */
    transform: translate(-50%, -50%);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: brightness(1.1) contrast(1.1); /* 讓鏡片內稍微亮一點 */
  }
  
  /* 放大鏡的手柄裝飾 (選用) */
  #magnifier::after {
    content: '';
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 40px;
    height: 10px;
    background: #2d3436;
    transform: rotate(45deg);
    border-radius: 5px;
  }
  
  /* 手機版提示 */
  .mobile-hint {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: white;
    padding: 5px 15px; border-radius: 20px;
    font-size: 0.9rem; pointer-events: none; z-index: 200;
  }

</style>
</head>

<script>
  // 資料來源
  const answers = [{"text":"水","left":"14.91%","top":"31.5%"},{"text":"改變","left":"17.14%","top":"44.22%"},{"text":"輕","left":"94.42%","top":"32.09%"},{"text":"二氧化碳","left":"89.97%","top":"39.13%"},{"text":"水","left":"90.48%","top":"48.13%"},{"text":"吸收","left":"87.4%","top":"57.13%"},{"text":"上升","left":"82.77%","top":"71.8%"},{"text":"氣體","left":"17.48%","top":"62.61%"}];
  const gameArea = document.getElementById('game-area');
  const magnifier = document.getElementById('magnifier');

  // 1. 建立答案元素
  answers.forEach(item => {
    const el = document.createElement('div');
    el.className = 'hidden-answer';
    el.textContent = item.text;
    el.style.left = item.left;
    el.style.top = item.top;
    gameArea.appendChild(el);
    item.element = el; // 儲存 DOM 參照
  });

  // 2. 放大鏡邏輯
  function updateMagnifier(x, y) {
    magnifier.style.left = x + 'px';
    magnifier.style.top = y + 'px';
    
    // 檢查碰撞 (Reveal Logic)
    const lensRadius = 60; // 放大鏡半徑
    const lensRect = magnifier.getBoundingClientRect();
    const lensCx = lensRect.left + lensRect.width/2;
    const lensCy = lensRect.top + lensRect.height/2;

    answers.forEach(item => {
      const elRect = item.element.getBoundingClientRect();
      const elCx = elRect.left + elRect.width/2;
      const elCy = elRect.top + elRect.height/2;

      // 計算距離
      const dist = Math.hypot(lensCx - elCx, lensCy - elCy);

      // 如果距離小於範圍，顯示答案
      if (dist < lensRadius + 20) { // +20 讓範圍稍微寬鬆一點
        item.element.style.opacity = 1;
        item.element.style.transform = 'translate(-50%, -50%) scale(1.1)';
      } else {
        item.element.style.opacity = 0;
        item.element.style.transform = 'translate(-50%, -50%) scale(1)';
      }
    });
  }

  // 3. 事件監聽 (滑鼠 + 觸控)
  document.addEventListener('mousemove', (e) => {
    updateMagnifier(e.clientX, e.clientY);
  });

  document.addEventListener('touchmove', (e) => {
    e.preventDefault(); // 防止捲動
    const touch = e.touches[0];
    // 手機上稍微往上移一點，手指才不會擋住鏡片
    updateMagnifier(touch.clientX, touch.clientY - 50); 
  }, { passive: false });

  // 點擊也可移動 (針對某些平板)
  document.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    updateMagnifier(touch.clientX, touch.clientY - 50);
  });

</script>
