            24: { ans: "C", source: "翰林 B4 第 2 章 氧化與還原", topic: "金屬活性大小", exp: "(A)鎂的活性比銅大，故鎂會與氧化銅反應，所以甲應為○；(B)鎂與未知金屬氧化物會反應，而鈉的活性比鎂大，則鈉也會與此氧化物反應，所以乙應為○；(C)(D)鎂的活性大於銅和未知金屬，但無法得知銅與未知金屬間的活性大小，所以丙有可能為╳或○。故選(C)。" },

        // --- 初始化快速連結按鈕 (1-50) ---
        function initQuickLinks() {
            const container = document.getElementById('quick-links');
            const keys = Array.from({length: 50}, (_, i) => i + 1);
            
            container.innerHTML = keys.map(num => 
                `<button onclick="searchQuestion(${num})" 
                         class="w-full aspect-square flex items-center justify-center bg-slate-50 border border-slate-200 rounded-xl text-lg font-medium text-slate-600 hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition shadow-sm">
                    ${num}
                 </button>`
            ).join('');
        }

        // --- 搜尋邏輯 (切換畫面) ---
        function searchQuestion(num) {
            let qNum = num;
            if (!qNum) {
                const input = document.getElementById('q-input');
                qNum = parseInt(input.value.trim());
            }

            if (!qNum) return;

            const data = examData[qNum];

            if (data) {
                // 填入資料
                document.getElementById('q-num-display').innerText = qNum;
                document.getElementById('ans-display').innerText = data.ans;
                document.getElementById('topic-display').innerText = data.topic;
                document.getElementById('source-display').innerText = data.source;
                document.getElementById('explanation-display').innerText = data.exp;

                // 切換畫面
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('result-screen').classList.add('flex');
                
                // 捲動到頂部
                document.getElementById('result-content').scrollTop = 0;
            } else {
                alert(`查無第 ${qNum} 題的資料。\n(目前已收錄 1-50 題)`);
            }
        }

        // --- 返回首頁 ---
        function goBack() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('flex');
            document.getElementById('home-screen').classList.remove('hidden');
            
            // 清空輸入框並聚焦
            const input = document.getElementById('q-input');
            input.value = '';
            input.focus();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                searchQuestion();
            }
        }

        // 啟動
        initQuickLinks();

    </script>
