                { id: 22, ans: "C", source: "理化：溶液酸鹼", keyPoint: "物質溶解對 pH 值的影響", detail: "短時間浸泡茶多酚(酸性)溶出，[H⁺]增加 pH值減少；長時間茶鹼類溶出，[OH⁻]增加 pH值增加。", quote: "化學反應隨時間淬鍊，本質終會展現。" },

                { id: 29, ans: "C", source: "理化：電流定律", keyPoint: "節點電流定律", detail: "並聯電路通過兩相同燈泡電流相等。總電流為分路電流之和，所以 IP = IQ = I甲 + I乙。", quote: "支流匯聚，終成強大的洪流。" },

                { id: 34, ans: "C", source: "生物：生態永續", keyPoint: "碳匯與環境策略分析", detail: "(A)砍伐森林會減少光合作用，會減少碳匯；(B)植樹造林能增加光合作用，是促進碳中和的策略；(C)改善能源使用效率可以減少二氧化碳的排放量；(D)海洋面積減少，固碳效果變小，會增強溫室效應、削弱碳匯。", quote: "每一分碳的節省，都是對未來的守護。" },
                { id: 35, ans: "C", source: "理化：濃度計算", keyPoint: "ppm 定義與應用", detail: "1ppm = 1mg / 1L。0.5L 中含鎂離子 20mg，相當於 1L 中含 40mg，即為 40ppm。", quote: "精準計量，微小之中見乾坤。" },
