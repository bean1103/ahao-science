<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <style>

            color: #94a3b8;
            overflow-x: hidden;

        }

            background: linear-gradient(135deg, #ff0000 0%, #7e22ce 50%, #eab308 100%);

            -webkit-text-fill-color: transparent;
        }
        .neon-border {
            position: relative;
        }
        .neon-border::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #dc2626, #7e22ce, #eab308, #10b981);
            z-index: -1;
            filter: blur(10px);
            opacity: 0.3;
            border-radius: inherit;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const App = () => {
            const [searchTerm, setSearchTerm] = useState('');
            const [displayId, setDisplayId] = useState(null);
            const resultRef = useRef(null);
            const topRef = useRef(null);

            const examData = [
                { id: 1, ans: "A", source: "114 自然 3 上 — 7-1 宇宙與太陽系", keyPoint: "衛星的定義與天體層級", detail: "繞行行星運行的天體稱為「衛星」。(A)衛星；(B)恆星；(C)(D)行星。", quote: "星光不問趕路人，你的堅持終將閃耀。" },
                { id: 2, ans: "C", source: "113 自然 2 下 — 3-1 電解質", keyPoint: "解離與導電原理", detail: "食醋與食鹽皆為電解質，溶於水後解離成離子導電，使 LED 燈發亮。", quote: "成功與電解質一樣，都需要徹底的解離與投入。" },

                { id: 5, ans: "C", source: "113 自然 2 下 — 6-1 力與平衡", keyPoint: "同一直線合力計算", detail: "合力：反向相減 4-3=1 (kgw)，方向與大者相同。", quote: "找對施力點，世界都會為你轉動。" },

                { id: 7, ans: "D", source: "113 自然 2 上 — 4-4 透鏡成像", keyPoint: "凸透鏡放大鏡原理", detail: "凸透鏡可形成放大像，用於放大鏡。", quote: "放大你的優點，讓劣勢在專注中縮小。" },
                { id: 8, ans: "C", source: "114 自然 3 上 — 7-2 晝夜與四季", keyPoint: "公轉與四季變化", detail: "6月太陽直射北半球，高緯度白晝比黑夜長。", quote: "追逐光芒的人，終會迎來最燦爛的白晝。" },
                { id: 9, ans: "A", source: "113 自然 2 上 — 3-4 聲波傳播", keyPoint: "聲波反射與指向性", detail: "手掌圈住嘴巴利用反射將聲波集中，減少發散。", quote: "喊出你的野心，讓世界聽見你的聲音。" },
                { id: 10, ans: "A", source: "114 自然 3 上 — 5-2 地表平衡", keyPoint: "河流侵蝕與搬運特徵", detail: "上游多巨大礫石；中下游多圓潤鵝卵石。", quote: "磨礪去稜角，是成長最必經的苦痛與美麗。" },
                { id: 11, ans: "D", source: "113 自然 2 上 — 6-1 元素與化合物", keyPoint: "混合物與金屬性質", detail: "合金為混合物；24K金純度最高，質地最軟。", quote: "純粹的實力，是最具韌性的防禦。" },
                { id: 12, ans: "B", source: "112 自然 1 上 — 5-2 神經系統", keyPoint: "大腦功能：智力與學習", detail: "學習與智力由大腦負責，屬於中樞神經核心。", quote: "智慧是最好的武器，思考是最高的防線。" },
                { id: 13, ans: "B", source: "114 自然 3 上 — 7-3 日地月運動", keyPoint: "藍月現象定義", detail: "一個月內出現第二次滿月，並非指月亮變藍色。", quote: "即使是稀有的幸運，也會在不經意間降臨。" },
                { id: 14, ans: "D", source: "113 自然 2 下 — 4-2 可逆反應", keyPoint: "勒沙特列原理：酸鹼影響", detail: "加鹼消耗 H+ 使平衡向左移動，溶液由橙色變黃色。", quote: "在劇烈的化學反應中，找回最平靜的自己。" },
                { id: 15, ans: "D", source: "112 自然 1 下 — 4-3 生態系", keyPoint: "能量階層與傳遞", detail: "丁為生產者；乙為高階消費者，能量傳遞最少。", quote: "處於頂端的代價，是承擔更重的能量負荷。" },

                { id: 17, ans: "C", source: "112 自然 1 上 — 4-1 植物運輸", keyPoint: "木質部構造功能", detail: "木質部具支撐與運輸水分之功能。", quote: "向下紮根、向上生長，成就最挺拔的人生。" },
                { id: 18, ans: "A", source: "114 自然 3 上 — 5-2 地表改變", keyPoint: "海蝕地形：海拱成因", detail: "海拱是海岸受波浪長期侵蝕與風化形成的景觀。", quote: "再堅硬的巨石，也擋不住時間與海浪的堅持。" },
                { id: 19, ans: "B", source: "114 自然 3 上 — 5-1 地球水資源", keyPoint: "冰川地形：U形谷", detail: "U形谷為冰川侵蝕。冰川屬固態淡水(乙)。", quote: "冷靜的思考如冰川，能推動最巨大的障礙。" },
                { id: 20, ans: "C", source: "114 自然 3 上 — 1-3 加速度", keyPoint: "加速度計算", detail: "a = (0-12)/1 = -12 m/s²。負號代表減速。", quote: "在快速的節奏中，學會精準的煞車與起步。" },
                { id: 21, ans: "D", source: "113 自然 2 下 — 3-2 酸和鹼", keyPoint: "水溶液電中性", detail: "溶液呈電中性：陽陰離子總電量相等。", quote: "保持靈魂的電中性，不偏不倚地前行。" },
                { id: 22, ans: "B", source: "113 自然 2 下 — 1-3 化學計量", keyPoint: "莫耳數比計算", detail: "係數比 2:1。2莫耳Cu原子最多反應生1莫耳產物。", quote: "計量人生，每一分微小的累積都是勝負關鍵。" },
                { id: 23, ans: "B", source: "112 自然 1 上 — 2-2 細胞構造", keyPoint: "原核生物與病毒", detail: "病毒無細胞構造；藍綠菌無核，但有葉綠素。", quote: "微小卻強大，這就是生命的奧祕。" },

                { id: 31, ans: "A", source: "112 自然 1 上 — 1-1 顯微鏡", keyPoint: "複式顯微鏡成像", detail: "成上下左右顛倒像。移動方向與實物相反。", quote: "微觀世界，才能擁有宏觀的視野。" },
                { id: 32, ans: "C", source: "114 自然 3 上 — 6-1 板塊運動", keyPoint: "造山運動斷層", detail: "玉山高度增加代表板塊推擠，產生逆斷層。", quote: "足夠的推擠與壓力，方能成就壯闊的高峰。" },
                { id: 33, ans: "C", source: "114 自然 3 上 — 1-1 直線運動", keyPoint: "x-t 圖分析", detail: "5~10分斜直線為等速；12分後趨向零點。", quote: "選定方向，然後以最穩定的步伐邁進。" },
                { id: 34, ans: "B", source: "114 自然 3 上 — 2-3 反作用力", keyPoint: "作用力與反作用力", detail: "踢力與紙箱反饋力大小相等、方向相反。", quote: "你的每一分付出，世界都會給你同等的回響。" },
                { id: 35, ans: "A", source: "114 自然 3 下 — 3-2 地震定義", keyPoint: "震央與震源定義", detail: "震源在地下；震央為對應地表點。", quote: "堅定的內心，是抵禦任何震盪的根基。" },
                { id: 36, ans: "D", source: "114 自然 3 下 — 1-2 電與生活", keyPoint: "額定電壓功率", detail: "電壓未達需求，無法正常發亮(P=V²/R)。", quote: "能量不足時，沉潛是為了下一次的閃耀。" },
                { id: 37, ans: "A", source: "113 自然 2 上 — 5-1 熱量計算", keyPoint: "熱量與質量關係", detail: "H=msΔT。質量大者上升溫度較小。", quote: "厚積而薄發，沉穩的人走得更遠。" },
                { id: 38, ans: "C", source: "113 自然 2 下 — 6-2 壓力計算", keyPoint: "液體壓力與重量", detail: "P=h×d。總重包含水重 400g 與瓶重 160g。", quote: "學會釋放壓力，人生才能輕裝上陣。" },
                { id: 39, ans: "C", source: "114 自然 3 上 — 3-1 功與能", keyPoint: "功的計算", detail: "W=F×S。力 30N × 位移 5M = 150 焦耳。", quote: "功不唐捐，你的每一分功都在累積動能。" },
                { id: 40, ans: "B", source: "112 自然 1 下 — 2-3 遺傳疾病", keyPoint: "隱性遺傳分析", detail: "正常父母生患病子，雙親皆為帶因者(Aa)。", quote: "解開基因的密碼，主宰自己的命運。" },
                { id: 41, ans: "C", source: "114 自然 3 上 — 4-4 電阻特性", keyPoint: "電阻與長度截面", detail: "電阻與長度成正比、截面積成反比。", quote: "減少阻力，你的前進速度將無人及。" },
                { id: 42, ans: "D", source: "112 自然 1 上 — 3-2 消化作用", keyPoint: "酵素 pH 值影響", detail: "胃酸性助消化蛋白(甲)；唾液中性助澱粉(乙)。", quote: "適應環境，是強者的第一課。" },
                { id: 43, ans: "D", source: "112 自然 1 上 — 3-2 實驗設計", keyPoint: "操縱變因控制變因", detail: "探討溫度影響，溫度為操縱變因。", quote: "掌控關鍵變因，你就能掌控全局。" },
                { id: 44, ans: "A", source: "112 自然 1 下 — 3-5 動物分類", keyPoint: "軟體動物辨識", detail: "菊石、文蛤屬軟體動物，身體柔軟、不分節。", quote: "生命的延續，是宇宙最美的奇蹟。" },

                { id: 47, ans: "B", source: "113 自然 2 下 — 4-1 反應速率", keyPoint: "濃度溫度影響", detail: "分析數據，觀察環境變因如何加速反應。", quote: "加速你的前進，別讓夢想在等待中冷卻。" },
                { id: 48, ans: "C", source: "113 自然 2 下 — 6-4 浮力應用", keyPoint: "阿基米德原理", detail: "浮力 = 排開液體重。浮體 B=W；沉體 B<W。", quote: "即使在逆境，也要學會優雅地浮出水面。" },
                { id: 49, ans: "B", source: "114 自然 3 上 — 2-1 慣性定律", keyPoint: "牛頓第一運動定律", detail: "啟動球向南滾動；煞車人向原方向(東南)前移。", quote: "保持慣性，堅持朝著目標前進。" },
                { id: 50, ans: "C", source: "114 自然 3 上 — 1-1 位移路徑", keyPoint: "路徑長與位移區別", detail: "非直線運動時，路徑長大於位移大小。", quote: "雖然彎路更長，但每一步路徑都是成長。" }
            ];

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    const num = parseInt(searchTerm);
                    if (num >= 1 && num <= 50) {
                        setDisplayId(num);
                    }
                }
            };

            const resetSearch = () => {
                setDisplayId(null);
                setSearchTerm('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            useEffect(() => {
                if (displayId && resultRef.current) {
                    const yOffset = -50; 
                    const y = resultRef.current.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            }, [displayId]);

            const result = useMemo(() => {
                return examData.find(d => d.id === displayId);
            }, [displayId]);

            return (
                <div className="min-h-screen px-4 py-8 md:py-12" ref={topRef}>
                    <div className="max-w-4xl mx-auto">
                        
                        {/* Header Section */}
                        <div className="text-center mb-8 md:mb-14 animate__animated animate__fadeInDown">
                            <div className="inline-flex items-center space-x-2 px-4 py-1 bg-white/5 rounded-full border border-white/10 mb-4">
                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_15px_rgba(220,38,38,1)]"></div>
                                <span className="text-[11px] font-black tracking-[0.2em] text-gray-500 uppercase">阿豪自然模擬考詳解</span>
                            </div>
                            
                            <h1 className="text-[32px] sm:text-[48px] md:text-[64px] font-black text-white tracking-tighter italic leading-[1.1] mb-2">
                                <span className="inline-block">阿豪自然的</span> <span className="hormone-gradient inline-block">第三次複習考</span> <span className="inline-block">詳解</span>
                            </h1>
                            <p className="text-3xl sm:text-4xl md:text-6xl font-black text-gray-800 uppercase tracking-[0.1em] mt-[-5px]">
                                康軒版本 ． 戰術核心數據
                            </p>
                        </div>

                        {/* Search Bar */}
                        <div className="max-w-3xl mx-auto relative mb-16 animate__animated animate__fadeInUp">
                            <div className="relative group neon-border rounded-2xl">
                                <div className="relative flex items-center bg-[#0d0d0f] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
                                    <div className="pl-6 text-red-600">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                    </div>
                                    <input 
                                        type="number" 
                                        placeholder="輸入題號 (1 - 50) 並按 Enter" 
                                        className="w-full bg-transparent border-none py-6 md:py-10 px-4 text-xl md:text-3xl font-black text-white focus:outline-none placeholder-gray-900"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                    />
                                    {searchTerm && (
                                        <button onClick={resetSearch} className="pr-8 text-red-600 hover:text-white transition-colors font-black uppercase text-xs tracking-widest">CLEAR</button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Result Display Area */}
                        <div className="min-h-[650px]">
                            {result ? (
                                <div 
                                    ref={resultRef}
                                    className="bg-[#0d0d0f] rounded-[2rem] md:rounded-[3rem] border border-white/5 shadow-[0_45px_100px_-20px_rgba(0,0,0,1)] overflow-hidden animate__animated animate__zoomIn animate__faster"
                                >
                                    
                                    {/* Card Header */}

                                            <button
