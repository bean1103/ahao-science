<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反應速率模擬實驗</title>
    <!-- 引入 Tailwind CSS 進行樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 定義動畫 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.8); } to { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // 解構 React Hooks
        const { useState, useEffect, useRef } = React;

        // --- 內建圖示組件 ---
        const FlaskIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-700">
                <path d="M10 2v7.31"/><path d="M14 2v7.31"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/>
            </svg>
        );

        const TimerIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-700">
                <line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>
            </svg>
        );

        const ThermometerIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500">
                <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
            </svg>
        );

        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
        );

        const PauseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
        );

        const ResetIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
        );

        const InfoIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
        );

        // --- 主程式 ---
        const App = () => {
            // 狀態管理
            const [temperature, setTemperature] = useState(25); // 攝氏溫度
            const [isRunning, setIsRunning] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const [elapsedTime, setElapsedTime] = useState(0); // 毫秒
            const [opacity, setOpacity] = useState(0); // 混濁度 0-1
            
            const requestRef = useRef();
            const startTimeRef = useRef();
            const previousTimeRef = useRef(0);

            // 根據溫度計算反應所需的總時間 (模擬數據)
            // 假設：每升高 10 度，反應速率約增加 2 倍 (時間減半)
            // 基準：20度時約需 60秒
            const calculateDuration = (temp) => {
                const baseTime = 60000; // 20度時 60000ms
                const factor = Math.pow(0.5, (temp - 20) / 10);
                return baseTime * factor;
            };

            const targetDuration = calculateDuration(temperature);

            // 動畫循環
            const animate = (time) => {
                if (!startTimeRef.current) startTimeRef.current = time;
                
                // 計算經過的時間 + 之前累積的時間 (暫停後繼續)
                const currentTime = time - startTimeRef.current + previousTimeRef.current;
                
                setElapsedTime(currentTime);

                // 計算混濁度 (線性增加直到 1)
                const currentOpacity = Math.min(currentTime / targetDuration, 1);
                setOpacity(currentOpacity);

                if (currentTime < targetDuration) {
                requestRef.current = requestAnimationFrame(animate);
                } else {
                setIsFinished(true);
                setIsRunning(false);
                setElapsedTime(targetDuration); // 確保顯示最終時間
                previousTimeRef.current = targetDuration; // 更新累積時間
                }
            };

            useEffect(() => {
                if (isRunning) {
                startTimeRef.current = null; // 重置本次動畫的起始時間
                requestRef.current = requestAnimationFrame(animate);
                } else {
                // 暫停時，保存當前已經過的時間
                if (!isFinished) {
                    previousTimeRef.current = elapsedTime;
                }
                cancelAnimationFrame(requestRef.current);
                }
                return () => cancelAnimationFrame(requestRef.current);
            }, [isRunning]);

            // 重置功能
            const handleReset = () => {
                setIsRunning(false);
                setIsFinished(false);
                setElapsedTime(0);
                setOpacity(0);
                startTimeRef.current = null;
                previousTimeRef.current = 0;
            };

            // 格式化時間 mm:ss.ms
            const formatTime = (ms) => {
                if (ms < 0) ms = 0;
                const minutes = Math.floor(ms / 60000);
                const seconds = Math.floor((ms % 60000) / 1000);
                const milliseconds = Math.floor((ms % 1000) / 10);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(2, '0')}`;
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
                <div className="max-w-4xl mx-auto space-y-6">
                    
                    {/* 標題與方程式區域 */}
                    <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="p-2 bg-blue-50 rounded-lg">
                        <FlaskIcon />
                        </div>
                        <h1 className="text-2xl md:text-3xl font-bold text-blue-800">
                        反應速率實驗：溫度對硫沉澱生成的影響
                        </h1>
                    </div>
                    
                    <div className="bg-slate-100 p-4 rounded-xl overflow-x-auto border border-slate-200">
                        <h3 className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">化學反應方程式</h3>
                        <div className="text-lg md:text-xl font-serif leading-relaxed whitespace-nowrap">
                        <span className="text-blue-600 font-bold">Na₂S₂O₃</span>
                        <span className="text-slate-400 mx-1 text-sm">(aq)</span>
                        + 
                        <span className="text-red-600 font-bold mx-2">2HCl</span>
                        <span className="text-slate-400 text-sm">(aq)</span>
                        <span className="mx-3 text-slate-400">→</span>
                        <span>2NaCl</span>
                        <span className="text-slate-400 mx-1 text-sm">(aq)</span>
                        + 
                        <span className="text-yellow-600 font-bold mx-2 bg-yellow-50 px-1 rounded border border-yellow-200">S↓</span>
                        <span className="text-slate-500 text-sm italic mr-2">(固體沉澱)</span>
                        + 
                        <span>SO₂</span>
                        <span className="text-slate-400 mx-1 text-sm">(g)</span>
                        + 
                        <span>H₂O</span>
                        <span className="text-slate-400 mx-1 text-sm">(l)</span>
                        </div>
                        <p className="text-sm text-slate-500 mt-3 pt-2 border-t border-slate-200">
                        硫代硫酸鈉 + 鹽酸 → 氯化鈉 + 硫(黃色沉澱) + 二氧化硫 + 水
                        </p>
                    </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    {/* 控制面板 */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 flex flex-col justify-between">
                        <div>
                        <div className="flex items-center gap-2 text-xl font-bold text-slate-700 mb-6 pb-4 border-b border-slate-100">
                            <TimerIcon />
                            實驗控制
                        </div>

                        {/* 溫度滑桿 */}
                        <div className="space-y-4 mb-8">
                            <div className="flex justify-between items-end">
                            <label className="flex items-center gap-2 font-medium text-slate-600">
                                <ThermometerIcon />
                                反應溫度
                            </label>
                            <span className="text-3xl font-bold text-red-500 tabular-nums">{temperature}°C</span>
                            </div>
                            
                            <input 
                            type="range" 
                            min="20" 
                            max="70" 
                            step="5" 
                            value={temperature}
                            onChange={(e) => {
                                if(!isRunning && elapsedTime === 0) setTemperature(Number(e.target.value));
                            }}
                            disabled={isRunning || (elapsedTime > 0 && !isFinished)}
                            className="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-500 disabled:opacity-40 disabled:cursor-not-allowed"
                            />
                            <div className="flex justify-between text-xs text-slate-400 font-medium">
                            <span>20°C (低溫)</span>
                            <span>70°C (高溫)</span>
                            </div>
                            
                            {(elapsedTime > 0 && !isFinished && !isRunning) && (
                            <div className="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded">實驗進行中無法調整溫度，請先重置。</div>
                            )}
                        </div>

                        {/* 秒錶顯示 */}
                        <div className="bg-slate-900 text-green-400 font-mono text-5xl text-center py-8 rounded-xl shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] border-4 border-slate-700 tracking-wider mb-6 relative overflow-hidden">
                            <span className="relative z-10">{formatTime(elapsedTime)}</span>
                            {/* 掃描線效果 */}
                            {isRunning && <div className="absolute top-0 left-0 w-full h-1 bg-green-500/20 animate-pulse"></div>}
                        </div>
                        </div>

                        {/* 操作按鈕 */}
                        <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <button
                            onClick={() => setIsRunning(!isRunning)}
                            disabled={isFinished}
                            className={`flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-white transition-all transform active:scale-95 shadow-lg ${
                                isFinished 
                                ? 'bg-slate-400 cursor-not-allowed shadow-none' 
                                : isRunning 
                                    ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-200 border-b-4 border-amber-700' 
                                    : 'bg-green-600 hover:bg-green-700 shadow-green-200 border-b-4 border-green-800'
                            }`}
                            >
                            {isRunning ? (
                                <span className="flex items-center gap-2"><PauseIcon /> 暫停</span>
                            ) : (
                                <span className="flex items-center gap-2"><PlayIcon /> {elapsedTime > 0 ? '繼續' : '開始反應'}</span>
                            )}
                            </button>
                            
                            <button
                            onClick={handleReset}
                            className="flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 border-b-4 transition-all active:scale-95"
                            >
                            <ResetIcon />
                            重置
                            </button>
                        </div>
                        
                        <div className="bg-blue-50 p-3 rounded-lg text-sm text-blue-800 flex gap-2 items-start border border-blue-100">
                            <div className="mt-0.5 shrink-0"><InfoIcon /></div>
                            <p>
                            當黃色硫沉澱完全遮住十字時，反應結束。溫度每上升10°C，反應速率約增加一倍。
                            </p>
                        </div>
                        </div>
                    </div>

                    {/* 視覺模擬區域 */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[400px] relative overflow-hidden">
                        <h3 className="absolute top-4 left-6 font-bold text-slate-400 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                        俯視圖模擬
                        </h3>
                        
                        {/* 燒杯容器 */}
                        <div className="relative w-72 h-72 rounded-full border-[10px] border-slate-200 shadow-xl bg-white flex items-center justify-center overflow-hidden ring-1 ring-slate-300">
                        
                        {/* 底部的黑色十字 */}
                        <div className="absolute text-slate-900 font-sans font-black text-[140px] select-none transform opacity-80 leading-none pb-4">
                            +
                        </div>

                        {/* 溶液層 (產生硫沉澱) */}
                        <div 
                            className="absolute inset-0 w-full h-full bg-yellow-100 transition-all duration-100 ease-linear"
                            style={{ 
                            opacity: opacity,
                            backdropFilter: `blur(${opacity * 10}px)` 
                            }}
                        >
                            {/* 增加一點顆粒感 */}
                            <div className="w-full h-full opacity-50 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNjY2MiLz4KPC9zdmc+')]"></div>
                        </div>
                        
                        {/* 反應完成標示 */}
                        {isFinished && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-20 animate-[fadeIn_0.3s_ease-out]">
                            <div className="bg-white px-8 py-4 rounded-2xl font-bold text-green-700 shadow-2xl border-4 border-green-500 text-xl transform animate-[scaleIn_0.3s_ease-out]">
                                反應完成！
                            </div>
                            </div>
                        )}
                        </div>

                        {/* 實驗狀態描述 */}
                        <div className="mt-10 w-full px-8">
                        <div className="flex justify-between text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">
                            <span>清澈 (Clear)</span>
                            <span>完全混濁 (Opaque)</span>
                        </div>
                        <div className="h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                            <div 
                            className="h-full bg-yellow-400 transition-all duration-100 ease-linear"
                            style={{ width: `${opacity * 100}%` }}
                            />
                        </div>
                        <p className="text-center mt-3 text-slate-500 font-mono text-sm">
                            沉澱進度: {Math.round(opacity * 100)}%
                        </p>
                        </div>

                    </div>
                    </div>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<a id="ahao-back" href="./index.html#" onclick="if(document.referrer.indexOf(location.host)>-1&&history.length>1){history.back();return false}" style="position:fixed;left:10px;bottom:10px;z-index:2147483647;background:#1b1f4a;color:#ffd84d;border:2px solid #ffd84d;border-radius:999px;padding:8px 14px;font:700 14px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.4)">← 阿豪自然</a><style>.sync-indicator{display:none!important}html,body{overflow-x:hidden}</style></body>
</html>
