                setAnswers({...answers, [questionsData[currentQ].id]: optId});
            };

            const finishQuiz = () => {
                let s = 0;
                let correct = 0;
                questionsData.forEach(q => {
                    if (answers[q.id] === q.correct) {
                        s += 10;
                        correct++;
                    }
                });
                if (correct === questionsData.length) s += 10; // 滿分獎勵
                setScore(s);
                setScreen('result');
            };

            const downloadCSV = () => {
                const csv = "\uFEFF座號,姓名,總分,題目,作答,正解\n" + 
                    questionsData.map(q => `${user.seat},${user.name},${score},${q.id},${answers[q.id]||""},${q.correct}`).join("\n");
                const link = document.createElement("a");
                link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
                link.download = "測驗結果.csv";
                link.click();
            };

            return (
                <div className="min-h-screen pb-10 flex flex-col items-center">
                    
                    {/* 歡迎頁面 */}
                    {screen === 'welcome' && (
                        <div className="mt-20 bg-white p-8 rounded-3xl shadow-lg border-4 border-dopamine-yellow w-full max-w-md text-center pop-in">
                            <h1 className="text-3xl font-black text-gray-800 mb-2">自然基會試煉 G8-1-C6</h1>
                            <div className="mb-6 space-y-4 text-left">
                                <input type="text" className="w-full p-3 border-2 rounded-xl" placeholder="座號" value={user.seat} onChange={e => setUser({...user, seat: e.target.value})} />
                                <input type="text" className="w-full p-3 border-2 rounded-xl" placeholder="姓名" value={user.name} onChange={e => setUser({...user, name: e.target.value})} />
                            </div>
                            <p className="bg-dopamine-cream p-4 rounded-xl mb-6 text-gray-600 italic text-sm border border-dopamine-yellow">
                                <IconStar /> {quote}
                            </p>
                            <button onClick={startQuiz} className="w-full py-4 bg-dopamine-pink text-white font-black text-xl rounded-2xl shadow-lg hover:opacity-90">開始挑戰</button>
                        </div>
                    )}

                    {/* 測驗頁面 */}
                    {screen === 'quiz' && (
                        <div className="w-full max-w-2xl px-4 mt-10 pop-in">
                            <div className="flex justify-between items-center mb-4">
                                <span className="font-bold text-gray-600">考生: {user.seat} {user.name}</span>
                                <span className="bg-dopamine-cream text-dopamine-pink px-3 py-1 rounded-full font-bold">第 {currentQ + 1} / {questionsData.length} 題</span>
                            </div>
                            
                            <div className="bg-white p-6 rounded-3xl border-4 border-gray-100 shadow-lg min-h-[300px]">
                                <span className="text-xs font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded mb-2 inline-block">{questionsData[currentQ].source}</span>
                                <h3 className="text-xl font-bold text-gray-800 mb-4">{questionsData[currentQ].text}</h3>
                                
                                {/* 圖片顯示區 */}
                                {questionsData[currentQ].image && (
                                    <div className="mb-4 flex justify-center">
                                        <img src={questionsData[currentQ].image} className="max-h-60 rounded border" onError={(e) => e.target.style.display='none'} />
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {questionsData[currentQ].options.map(opt => (
                                        <button key={opt.id} onClick={() => selectOption(opt.id)} 
                                            className={`w-full text-left p-4 rounded-xl border-2 font-medium transition-all ${answers[questionsData[currentQ].id] === opt.id ? 'border-dopamine-blue bg-blue-50 text-dopamine-blue' : 'border-gray-100 hover:bg-gray-50'}`}>
                                            <span className={`inline-block w-6 h-6 text-center rounded-full mr-3 text-sm ${answers[questionsData[currentQ].id] === opt.id ? 'bg-dopamine-blue text-white' : 'bg-gray-200'}`}>{opt.id}</span>
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex justify-between mt-6">
                                <button onClick={() => setCurrentQ(Math.max(0, currentQ - 1))} disabled={currentQ === 0} className="px-6 py-3 rounded-xl font-bold text-gray-500 bg-white border border-gray-200 disabled:opacity-50">上一題</button>
                                {currentQ < questionsData.length - 1 ? (
                                    <button onClick={() => setCurrentQ(currentQ + 1)} className="px-6 py-3 bg-dopamine-blue text-white font-bold rounded-xl shadow-md">下一題</button>
                                ) : (
                                    <button onClick={finishQuiz} className="px-8 py-3 bg-dopamine-green text-white font-bold rounded-xl shadow-md animate-bounce">確定繳交</button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 結果頁面 */}
                    {screen === 'result' && (
                        <div className="w-full max-w-4xl px-4 mt-10 pop-in">
                            <div className="bg-white p-8 rounded-3xl border-4 border-dopamine-yellow text-center shadow-xl mb-8">
                                <h2 className="text-4xl font-black text-dopamine-pink mb-2">{score} 分</h2>
                                <p className="text-gray-500 mb-6">{score > 100 ? "太神啦！完美全對！" : "做得好！繼續加油！"}</p>
                                <div className="flex justify-center gap-4 no-print">
                                    <button onClick={downloadCSV} className="px-4 py-2 bg-dopamine-green text-white rounded-lg font-bold">下載 CSV</button>
                                    <button onClick={() => window.print()} className="px-4 py-2 bg-dopamine-blue text-white rounded-lg font-bold">列印 / PDF</button>
                                </div>
                            </div>

                            <div className="space-y-6">
                                {questionsData.map((q, idx) => {
                                    const isCorrect = answers[q.id] === q.correct;
                                    return (
                                        <div key={q.id} className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm break-inside-avoid">
                                            <div className="flex gap-3 mb-2">
                                                <div className={`mt-1 ${isCorrect ? 'text-dopamine-green' : 'text-dopamine-pink'}`}>{isCorrect ? <IconCheck /> : <IconX />}</div>
                                                <div className="flex-1">
                                                    <div className="flex justify-between">
                                                        <h4 className="font-bold text-gray-800">第 {idx + 1} 題</h4>
                                                        <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">{q.source}</span>
                                                    </div>
                                                    {q.image && <img src={q.image} className="max-h-32 my-2 rounded border" />}
                                                    <p className="text-gray-700 mb-2">{q.text}</p>
                                                    <div className="text-sm bg-gray-50 p-2 rounded">
                                                        <span className="font-bold text-gray-500">你的答案: {answers[q.id] || "未作答"}</span>
                                                        <span className="font-bold text-dopamine-blue ml-4">正解: {q.correct}</span>
                                                    </div>
                                                    <div className="mt-2 text-sm text-gray-600 bg-dopamine-cream p-3 rounded border border-dopamine-yellow">
                                                        <span className="font-bold text-dopamine-yellow">解析：</span>{q.explanation}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
