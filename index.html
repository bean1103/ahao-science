<style>
/* Layout: night adventure map. Phone = one winding trail of islands; desktop = two semester trails side by side + mascot in the corner */
:root{
  color-scheme:dark;
  --sky:#0b1030; --sky2:#151b4a; --panel:#1b2258; --panel2:#232c6e; --line:#36407f;
  --ink:#eef1ff; --muted:#a8b0e0; --glow:#ffd84a; --glow-ink:#2b2100; --sea:#38d3c4; --sea-ink:#04211e; --rose:#ff7aa8; --lock:#4a5390;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --pixel:"Press Start 2P",ui-monospace,monospace;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--sky)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;min-height:100vh;
  background:radial-gradient(1200px 600px at 80% -10%,var(--sky2),transparent 60%),var(--sky)}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.pixel{font-family:var(--pixel);font-size:10px;letter-spacing:.04em}

.note{position:relative;z-index:1;background:var(--glow);color:var(--glow-ink);font-size:13px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{position:relative;z-index:1;margin:0 auto;max-width:1120px;padding-block:0 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root[data-layout="m"] .app{max-width:440px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-name{font-family:var(--display);font-size:22px;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted)}
.switch{display:flex;border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:3px}
.switch button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}

h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.3}
h2{font-size:21px}

/* mascot + speech */
.guide{display:flex;align-items:flex-end;gap:12px}
.mascot{width:112px;height:auto;flex:none;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.mascot.lg{width:140px}
.mbtn{position:relative;overflow:hidden}
.mbtn .pic{position:absolute;right:-6px;bottom:-4px;width:84px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.mbtn b,.mbtn span{position:relative;max-width:62%}
.boss-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:6px}
.boss-head{height:36px}.boss-head img{width:56px;height:auto;margin-top:-28px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.win{display:flex;align-items:center;gap:12px;margin-top:12px;background:linear-gradient(90deg,rgba(255,216,74,.18),transparent);border:2px solid var(--glow);border-radius:14px;padding:8px 12px}
.win img{width:84px;height:auto}
.win b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--glow);display:block}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}}
.bubble{position:relative;background:var(--ink);color:var(--sky);border-radius:var(--r);padding:12px 16px;min-width:0;flex:1;margin-bottom:24px}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble b{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.3}
.bubble span{font-size:14px;color:#3a4070}

/* player card */
.hud{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.xp{height:14px;border-radius:7px;background:var(--sky);border:2px solid var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--glow));width:0}
@media (prefers-reduced-motion:no-preference){.xp i{transition:width .6s ease}}
.lv{color:var(--glow)}

.menu{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}
:root[data-layout="d"] .menu{grid-template-columns:repeat(4,minmax(0,1fr))}
.mbtn{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--panel2);border:2px solid var(--line);
  border-bottom-width:5px;border-radius:14px;padding:14px;min-height:104px}
.mbtn:hover{border-color:var(--sea)}
.mbtn:active{transform:translateY(2px);border-bottom-width:3px}
.mbtn .ico{font-size:26px;line-height:1}
.mbtn b{font-size:17px;font-weight:700}
.mbtn span{font-size:13px;color:var(--muted)}

section.block{margin-top:32px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 16px;cursor:pointer;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--glow);color:var(--glow-ink);border-color:var(--glow)}

/* the map */
.worlds{display:grid;gap:16px}
:root[data-layout="d"] .worlds{grid-template-columns:repeat(2,minmax(0,1fr))}
.world{background:linear-gradient(180deg,rgba(56,211,196,.08),transparent 40%),var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px}
.world-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.world{background:radial-gradient(420px 260px at 85% 0%,rgba(255,240,180,.10),transparent 60%),linear-gradient(180deg,#14306a 0%,#0e2152 55%,#0b1a40 100%);border:2px solid var(--line);border-radius:20px;padding:16px;overflow:hidden}
.moon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffe58a 60%,#f2c94c);box-shadow:0 0 30px rgba(255,229,138,.6)}
.trail{position:relative;display:grid;gap:4px;padding-block:8px}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.isle{position:relative;display:flex;align-items:center;gap:6px;text-decoration:none;width:84%}
.isle:nth-child(odd of .isle){justify-self:start}
.isle:nth-child(even of .isle){justify-self:end;flex-direction:row-reverse;text-align:right}
.art{width:128px;height:100px;flex:none;position:relative}
.art svg{width:100%;height:100%;overflow:visible}
@media (prefers-reduced-motion:no-preference){
  .art .wave{animation:wave 3s ease-in-out infinite}
  .art .flag{animation:flag 1.6s ease-in-out infinite;transform-origin:0 50%}
  .isle:hover .art svg{transform:translateY(-3px)} .art svg{transition:transform .2s}
  @keyframes wave{50%{transform:translateX(3px)}} @keyframes flag{50%{transform:skewY(-8deg) scaleX(.9)}}}
.isle .info{min-width:0;background:rgba(11,16,48,.92);backdrop-filter:blur(2px);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.isle.clear .info{border-color:var(--glow)}
.isle.visited .info{border-color:var(--sea)}
.isle:hover .info{border-color:var(--ink)}
.isle .info b{display:block;font-size:15px}
.isle .info small{color:var(--muted);font-size:12px}
.isle .num{color:var(--glow)}
.orb{position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5b67b8,var(--lock));border:3px solid var(--line);font-size:26px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

.vids{display:grid;gap:8px}
.vid{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.vid:hover{border-color:var(--sea)}
.play{width:36px;height:36px;flex:none;border-radius:10px;background:var(--rose);color:var(--sky);display:grid;place-items:center;font-size:13px}
.vid .t{min-width:0;flex:1}
.vid small{display:block;color:var(--muted);font-size:12px}
.new{color:var(--glow)}
.links{display:grid;gap:8px}
:root[data-layout="d"] .links{grid-template-columns:repeat(3,minmax(0,1fr))}
.lk{display:block;text-decoration:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.lk:hover{border-color:var(--sea)}
.lk small{display:block;color:var(--muted);font-size:12px}

/* level page */
.crumb{font-size:14px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--sea)}
.stage{background:radial-gradient(500px 200px at 20% 0%,rgba(255,216,74,.15),transparent),var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.stage-top{display:flex;gap:14px;align-items:center}
.stage .orb{width:72px;height:72px;font-size:30px}
.cgrid{display:grid;gap:20px;margin-top:20px}
:root[data-layout="d"] .cgrid{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.quest{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.quest.done{border-color:var(--sea)}
.quest a{flex:1;min-width:0;text-decoration:none;display:flex;gap:10px;align-items:center}
.quest small{display:block;color:var(--muted);font-size:12px}
.chk{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--sky);cursor:pointer;display:grid;place-items:center;font-size:16px}
.quest.done .chk{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.boss{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:14px;padding:14px 16px;min-height:60px;border:2px solid transparent;border-bottom-width:5px}
.boss.game{background:var(--sea);color:var(--sea-ink);border-color:#1fa597}
.boss.quiz{background:var(--glow);color:var(--glow-ink);border-color:#d1a80f}
.boss.isl{background:var(--rose);color:#2d0617;border-color:#d4567f}
.boss.off{background:var(--panel);color:var(--muted);border-color:var(--line)}
.boss small{display:block;font-size:12px;opacity:.85}
.boss .ico{font-size:24px}
.clearbtn{width:100%;margin-top:12px;border:2px solid var(--glow);border-bottom-width:5px;background:transparent;color:var(--glow);border-radius:14px;padding:12px;font-size:16px;cursor:pointer}
.clearbtn[aria-pressed="true"]{background:var(--glow);color:var(--glow-ink)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.pager a{text-decoration:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:14px;min-width:0}
.pager a:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.foot{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

function applyLayout(){

function islandArt(c,st){
  // deterministic little variations per chapter
  let h=0;for(const ch of c.id)h=(h*31+ch.charCodeAt(0))%997;
  const g=st==="clear"?["#5fd38f","#2f9e6a"]:st==="visited"?["#4fc08a","#2b8a60"]:["#5a6699","#414b80"];
  const sand=st?"#f2d391":"#8c8fb5", water=st==="clear"?"rgba(255,216,74,.35)":"rgba(56,211,196,.28)";
  const flip=h%2?-1:1, px=flip>0?92:36;
  const palm=`<path d="M${px} 58 q${3*flip} -14 ${-2*flip} -30" stroke="#7a5230" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="${st?"#3fbf7a":"#59628f"}"><path d="M${px-2*flip} 28 q${-14*flip} -6 ${-22*flip} 6 q${12*flip} -10 ${22*flip} -6z"/><path d="M${px-2*flip} 28 q${14*flip} -8 ${22*flip} 4 q${-12*flip} -8 ${-22*flip} -4z"/>
    <path d="M${px-2*flip} 28 q${-6*flip} -14 ${2*flip} -20 q${-2*flip} 10 ${-2*flip} 20z"/><path d="M${px-2*flip} 28 q${8*flip} -12 ${18*flip} -12 q${-10*flip} 4 ${-18*flip} 12z"/></g>`;
  const flag=st==="clear"?`<g><path d="M${128-px} 46 v-30" stroke="#eef1ff" stroke-width="2"/><path class="flag" d="M${128-px} 16 h16 l-4 6 l4 6 h-16z" fill="#ffd84a"/></g>`:"";
  const glow=st==="clear"?`<ellipse cx="64" cy="62" rx="62" ry="30" fill="url(#gl)"/>`:"";
  const fog=st?"":`<ellipse cx="64" cy="54" rx="54" ry="26" fill="#0b1030" opacity=".35"/>`;
  return `<svg viewBox="0 0 128 100" aria-hidden="true"><defs><radialGradient id="gl"><stop offset="0" stop-color="#ffd84a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient></defs>
    ${glow}<ellipse cx="64" cy="76" rx="58" ry="17" fill="${water}"/>
    <g class="wave" stroke="rgba(238,241,255,.45)" stroke-width="2" fill="none" stroke-linecap="round"><path d="M10 86 q6 -4 12 0"/><path d="M104 88 q6 -4 12 0"/></g>
    <path d="M18 70 Q24 58 64 58 Q106 58 110 70 Q100 80 64 80 Q26 80 18 70z" fill="${sand}"/>
    <path d="M28 66 Q${36+h%10} ${30+h%8} 62 ${34+h%6} Q${88-h%7} 30 100 66 Q64 74 28 66z" fill="${g[0]}"/>
    <path d="M40 66 Q52 ${48+h%6} 66 50 Q80 46 92 66 Q64 70 40 66z" fill="${g[1]}" opacity=".7"/>
    ${palm}${flag}
    <text x="62" y="58" text-anchor="middle" font-size="26">${ICON[c.id]||"🏝️"}</text>${fog}</svg>`;
}
function isle(c){
  const st=state(c.id);
  return `<a class="isle ${st}" href="#ch-${c.id}"><span class="art">${islandArt(c,st)}</span>
    <span class="info"><span class="pixel num">${st==="clear"?"★ ":""}CH${c.c}</span><b>${esc(c.n)}</b><small>${st==="clear"?"已通關":st?"進行中":"未探索"} · ${vidsOf(c).length} 支影片${c.quiz?" · 基會":""}</small></span></a>`;
}
function drawTrails(){
  document.querySelectorAll(".trail").forEach(tr=>{
    tr.querySelector("svg.path")?.remove();
    const box=tr.getBoundingClientRect();const pts=[...tr.querySelectorAll(".art")].map(a=>{const r=a.getBoundingClientRect();return [r.left-box.left+r.width/2,r.top-box.top+r.height*.62]});
    if(pts.length<2)return;
    let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const my=(y0+y1)/2;d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}
    tr.insertAdjacentHTML("afterbegin",`<svg class="path" aria-hidden="true"><path d="${d}" fill="none" stroke="rgba(255,216,74,.55)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/></svg>`);
  });
}
function home(){
  const G=DATA.find(x=>x.g===grade)||DATA[1];

  <div class="guide">${mascot("point","lg")}<div class="bubble"><b>嗨！今天要攻略哪一關？</b><span>選一座島開始，看完影片、打倒基會 Boss 就能通關。</span></div></div>
  <div class="hud">
    <div class="hud-row"><span><span class="pixel lv">LV.${lv}</span>　自然冒險者</span><span class="sub">已通關 ${cleared} / ${total} 座島</span></div>
    <div class="xp" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${cleared}"><i style="width:${Math.max(3,cleared/total*100)}%"></i></div>
  </div>
  <div class="menu">
    <a class="mbtn" href="#map"><img class="pic" style="width:63px" src="${CHAR.magnify}" alt=""><b>冒險地圖</b><span>依章節複習</span></a>
    <a class="mbtn" href="#exam"><img class="pic" style="width:76px" src="${CHAR.book}" alt=""><b>會考大魔王</b><span>110～115 解析、模擬考</span></a>
    <a class="mbtn" href="#videos"><img class="pic" style="width:74px" src="${CHAR.laptop}" alt=""><b>新影片</b><span>上傳後自動出現</span></a>
    <a class="mbtn" href="#tools"><img class="pic" style="width:84px" src="${CHAR.present}" alt=""><b>教室工具</b><span>考試時程、模擬考時程</span></a>
  </div>

  <section class="block" id="map">
    <div class="block-head"><h2>冒險地圖</h2><span class="sub">每章是一座島</span></div>
    <div class="tabs" role="tablist">${DATA.map(x=>`<button role="tab" id="tab-${x.g}" data-g="${x.g}" aria-selected="${x.g===G.g}">${x.label}</button>`).join("")}</div>
    <div class="worlds">${G.sems.map(S=>`<div class="world"><div class="world-head"><div><h3>${S.label}群島</h3><span class="pixel sub">${S.ch.length} ISLANDS</span></div><span class="moon" aria-hidden="true"></span></div>
      <div class="trail">${S.ch.map(C=>isle(byId(`${G.g}-${S.s}-${C.c}`))).join("")}</div></div>`).join("")}</div>
    <div class="legend"><span><i class="dot" style="background:var(--lock)"></i>未探索</span><span><i class="dot" style="background:var(--sea)"></i>進行中</span><span><i class="dot" style="background:var(--glow)"></i>已通關</span></div>
  </section>

  <section class="block" id="videos">
    <div class="block-head"><h2>新影片</h2><span class="sub">每天自動從 YouTube 更新</span></div>
    <div class="vids">${VIDEOS.filter(v=>v.chapter).slice(0,5).map((v,i)=>{const c=byId(v.chapter);return `<a class="vid" href="${WATCH(v.id)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span><span class="t">${esc(v.title)}<small>${i<2?'<span class="new">NEW</span>　':""}${v.date||""}　${c?`${c.sl} Ch.${c.c} ${esc(c.n)}`:""}</small></span></a>`}).join("")}</div>
  </section>

  <section class="block" id="exam">
    <div class="block-head"><h2>會考大魔王</h2><span class="sub">九年級最終關卡</span></div>
    <div class="links">
      <a class="lk" href="play/exam-110-115/">🏆 110～115 會考自然解析<small>歷屆試題逐題解析</small></a>
      <a class="lk" href="play/mock-answers/">📝 模擬考詳解<small>每次模擬考的題目解說</small></a>
    </div>
  </section>

  <section class="block" id="tools">
    <div class="block-head"><h2>教室工具</h2><span class="sub">上課時用</span></div>
    <div class="links">
      <a class="lk" href="play/exam-schedule/">🗓️ 考試時程<small>本學期段考日期與範圍</small></a>
      <a class="lk" href="play/mock-schedule/">🗓️ 模擬考時程<small>九年級模擬考日期</small></a>
    </div>
  </section>`;
}

const TIPS=["先看影片再挑戰 Boss，通關率會高很多喔！","看完一支就打勾，地圖上的島會慢慢亮起來。","卡關了？回去看那一節的影片，再來一次！"];
function level(id){
  const c=byId(id); if(!c) return home();
  const i=flat.indexOf(c), prev=flat[i-1], next=flat[i+1];
  const vs=vidsOf(c), p=prog[id]||{q:[]}, st=state(id), done=vs.filter(v=>(p.q||[]).includes(v.id)).length;
  return `
  <div class="crumb"><a href="#map">冒險地圖</a> › ${c.sl}群島</div>
  <div class="stage">
    <div class="stage-top"><span class="art" style="width:150px;height:116px">${islandArt(c,st)}</span>
      <div><span class="pixel sub">${c.sl} · CH${c.c}</span><h1>${esc(c.n)}</h1><span class="sub">影片任務 ${done} / ${vs.length}</span></div></div>
    <div class="xp"><i style="width:${Math.max(3,done/Math.max(1,vs.length)*100)}%"></i></div>
  </div>
  <div class="cgrid">
    <section><div class="block-head"><h2>影片任務</h2><span class="sub">看完打勾</span></div>
      <div class="vids">${vs.length?vs.map(v=>{const d=(p.q||[]).includes(v.id);return `<div class="quest ${d?"done":""}"><button class="chk" data-k="${v.id}" aria-pressed="${d}" aria-label="標記看完：${esc(v.title)}">${d?"✓":""}</button>
        <a href="${WATCH(v.id)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span><span class="t">${esc(v.title)}<small>${v.kind}${v.date?"　"+v.date:""}</small></span></a></div>`}).join(""):`<div class="boss off"><span class="ico">🎬</span><span>影片整理中<small>阿豪老師上傳後會自動出現</small></span></div>`}</div></section>
    <section><div class="boss-head"><h2>Boss 戰</h2><img src="${CHAR.hazmat}" alt=""></div>
      <div class="vids">
        ${c.game?`<a class="boss game" href="${P(c.game)}"><span class="ico">🎮</span><span>互動小遊戲<small>邊玩邊複習觀念</small></span></a>`:`<div class="boss off"><span class="ico">🎮</span><span>互動小遊戲<small>這座島還沒有</small></span></div>`}
        ${c.quiz?`<a class="boss quiz" href="${P(c.quiz)}"><span class="ico">👑</span><span>基會試煉<small>會考程度的 Boss</small></span></a>`:`<div class="boss off"><span class="ico">👑</span><span>基會試煉<small>這座島還沒有</small></span></div>`}
        ${c.isl?`<a class="boss isl" href="${P(c.isl)}"><span class="ico">🏝️</span><span>島嶼課程複習<small>G${c.g}_${c.s}_C${c.c}</small></span></a>`:""}
      </div>
      ${st==="clear"?`<div class="win"><img src="${CHAR.cheer}" alt="阿豪老師歡呼"><div><b>恭喜通關！</b><span class="sub">這座島已經點亮了</span></div></div>`:""}
      <button class="clearbtn" id="clear" aria-pressed="${st==="clear"}">${st==="clear"?"★ 已通關（再按一次取消）":"我通關了！點亮這座島"}</button>
      <div class="guide" style="margin-top:16px">${mascot(POSE[c.id]||(i%2?"idea":"think"))}<div class="bubble"><b>阿豪老師提示</b><span>${TIPS[i%TIPS.length]}</span></div></div>
    </section>
  </div>
  <div class="pager">${prev?`<a href="#ch-${prev.id}"><small>‹ 上一座島</small>${prev.sl} Ch.${prev.c} ${esc(prev.n)}</a>`:"<span></span>"}${next?`<a href="#ch-${next.id}"><small>下一座島 ›</small>${next.sl} Ch.${next.c} ${esc(next.n)}</a>`:"<span></span>"}</div>`;
}

function render(){
  const h=location.hash.slice(1), m=h.match(/^ch-(\d-\d-\d)/), view=document.getElementById("view");
  view.innerHTML=m?level(m[1]):home();
  view.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{grade=b.dataset.g;store.set("ahao-grade",grade);render();document.getElementById("map").scrollIntoView()}));
  if(m){
    const id=m[1];
    view.querySelectorAll(".chk").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;const p=prog[id]||(prog[id]={q:[]});p.q=p.q||[];
      p.q=p.q.includes(k)?p.q.filter(x=>x!==k):[...p.q,k];save();render()}));
    document.getElementById("clear").addEventListener("click",()=>{const p=prog[id]||(prog[id]={q:[]});p.clear=p.clear?0:1;save();render()});
    if(!render.keep) window.scrollTo(0,0);
  } else if(h && h!=="home"){const el=document.getElementById(h);el&&el.scrollIntoView()} else window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{render.keep=false;render()});
// keep scroll when toggling checks
const _r=render;render=function(){const y=window.scrollY;_r();drawTrails();if(render.keep)window.scrollTo(0,y);render.keep=true};
render.keep=false;

function stars(){
  const cv=document.getElementById("stars"),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<Math.round(w*h/5000);i++){x.fillStyle=`rgba(238,241,255,${.25+rnd()*.6})`;const r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h,r,0,7);x.fill()}
}
applyLayout();stars();
fetch("data/videos.json").then(r=>r.json()).then(v=>{VIDEOS=v}).catch(()=>{}).finally(()=>render());
</script>
